<script type="text/babel">

const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indkb25kcGhjbW5oZHNsY3lwZXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MDA3MDcsImV4cCI6MjA4NDQ3NjcwN30.wIisWHb3w4cSGZIB4f3q0Z6lboidH6SzL7oGToGdnsw';

const comps = [
    {name:'Job Knowledge & Expertise',desc:'Technical skills and knowledge',icon:'fa-brain'},

];

const avg = r => { const v=Object.values(r||{}); return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'0.0'; };

/* ── Attendance deduction helpers ── */
const calcDeduction = (lateDays) => {
  if (!lateDays || lateDays === 0) return 0;
  if (lateDays <= 3)  return 2;
  if (lateDays <= 6)  return 5;
  if (lateDays <= 10) return 8;
  if (lateDays <= 15) return 12;
  return 15;
};
const scoreToPercent = (avgRating) => Math.round((parseFloat(avgRating||0)/5)*100);
const adjustedScore  = (avgRating, ded) => Math.max(0, scoreToPercent(avgRating)-(ded||0));
const gradeFromScore = (score) => {
  if(score>=90) return {name:'BEACON · Solstice',color:'#1A3A5C',cls:'bg-indigo-100 text-indigo-800'};
  if(score>=80) return {name:'BLAZE · Horizon', color:'#C9980A',cls:'bg-yellow-100 text-yellow-800'};
  if(score>=75) return {name:'FLAME · Noon',    color:'#E8851A',cls:'bg-orange-100 text-orange-800'};

  if(score>=60) return {name:'SPARK · Dawn',    color:'#C1440E',cls:'bg-red-100 text-red-800'};

};

/* ── Device / browser helpers ── */
const getBrowser=ua=>{if(ua.includes('Chrome')&&!ua.includes('Edg'))return'Chrome';if(ua.includes('Firefox'))return'Firefox';if(ua.includes('Safari')&&!ua.includes('Chrome'))return'Safari';if(ua.includes('Edg'))return'Edge';if(ua.includes('OPR')||ua.includes('Opera'))return'Opera';return'Unknown';};
const getOS=ua=>{if(ua.includes('Windows'))return'Windows';if(ua.includes('Mac'))return'MacOS';if(ua.includes('Android'))return'Android';if(ua.includes('iPhone')||ua.includes('iPad'))return'iOS';if(ua.includes('Linux'))return'Linux';return'Unknown';};
const getDevice=ua=>{if(/Mobi|Android|iPhone|iPad/i.test(ua))return'Mobile';if(/Tablet|iPad/i.test(ua))return'Tablet';return'Desktop';};
    const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const currentPeriod=()=>{const d=new Date();return {month:MONTHS[d.getMonth()],year:String(d.getFullYear())};};
const isRoutine=a=>/recurring/i.test(a.activity_type||'');

function Toast({message,type,onClose}) {
    useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
    const bg={success:'bg-green-600',error:'bg-red-600',info:'bg-blue-600'}[type];
    const ic={success:'fa-check-circle',error:'fa-exclamation-circle',info:'fa-info-circle'}[type];
    return <div className={`toast-box ${bg} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3`}>
        <i className={`fas ${ic} text-lg`}/><span className="font-medium">{message}</span>
        <button onClick={onClose} className="ml-4 opacity-70 hover:opacity-100"><i className="fas fa-times"/></button>
    </div>;
}

function App() {
    const [user,setUser]=useState(null);
    const [view,setView]=useState('login');
    const [toast,setToast]=useState(null);
    const notify=(msg,type='success')=>setToast({message:msg,type});

    useEffect(()=>{
        const s=localStorage.getItem('rahama_session');
        if(s){
            const u=JSON.parse(s);
            setUser(u);
            setView(u.role==='employee'?'dashboard':'supervisor');
            // Saved sessions predate the is_mne flag, so re-read it from the
            // database on load rather than requiring everyone to log out.
            fetch(`${SB}/rest/v1/users?id=eq.${u.id}&select=is_mne`,{headers:H})
                .then(r=>r.json())
                .then(d=>{
                    if(Array.isArray(d)&&d.length){
                        const flag=!!d[0].is_mne;
                        if(flag!==!!u.is_mne){
                            const nu={...u,is_mne:flag};
                            setUser(nu);
                            localStorage.setItem('rahama_session',JSON.stringify(nu));
                            localStorage.setItem('pms_user',JSON.stringify(nu));
                        }
                    }
                }).catch(()=>{});
        }
    },[]);

    /* ── UPDATED login — logs device, browser, OS, IP ── */
    const login=async(email,pw,role)=>{
        try{
            // Credentials are checked inside the database by verify_login().
            // The browser never reads the password column.
            const r=await fetch(`${SB}/rest/v1/rpc/verify_login`,{method:'POST',headers:HR,
                body:JSON.stringify({p_email:email,p_password:pw,p_role:role})});
            const account=r.ok?await r.json():null;

            /* collect device info */
            const ua=navigator.userAgent;
            const deviceInfo={device:getDevice(ua),browser:getBrowser(ua),os:getOS(ua),screen_size:`${window.screen.width}x${window.screen.height}`};

            /* collect IP silently */
            let ipInfo={ip_address:'Unknown',location:'Unknown'};
            try{
                const ip=await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(4000)});
                if(ip.ok){const d=await ip.json();ipInfo={ip_address:d.ip||'Unknown',location:`${d.city||''}${d.city?', ':''}${d.region||''}${d.region?', ':''}${d.country_name||''}`.trim()};}
            }catch(e){}

            if(account&&account.id){
                const d={email:account.email,name:account.name,role,id:account.id,is_mne:!!account.is_mne};
                setUser(d);
                localStorage.setItem('rahama_session',JSON.stringify(d));
                localStorage.setItem('pms_user',JSON.stringify(d));
                setView(role==='employee'?'dashboard':'supervisor');
                notify(`Welcome, ${account.name}!`);
                /* log success — silent fail */
                fetch(`${SB}/rest/v1/login_logs`,{method:'POST',headers:HJ,
                    body:JSON.stringify({user_id:account.id,email,name:account.name,role,...deviceInfo,...ipInfo,status:'success'})
                }).catch(()=>{});
            } else {
                notify('Invalid credentials','error');
                /* log failed attempt — silent fail */
                fetch(`${SB}/rest/v1/login_logs`,{method:'POST',headers:HJ,
                    body:JSON.stringify({user_id:null,email,name:'—',role,...deviceInfo,...ipInfo,status:'failed'})
                }).catch(()=>{});
            }
        }catch(e){notify('Login failed','error');}
    };

    const logout=()=>{setUser(null);localStorage.removeItem('rahama_session');setView('login');};

    return <>
        {toast&&<Toast {...toast} onClose={()=>setToast(null)}/>}
        {view==='login'&&<Login onLogin={login}/>}
        {view==='dashboard'&&<Dashboard user={user} onLogout={logout} notify={notify}/>}
        {view==='supervisor'&&<SuperDash user={user} onLogout={logout} notify={notify}/>}
    </>;
}

                    {[['employee','fa-user','Employee'],['supervisor','fa-user-tie','Supervisor']].map(([r,ic,lb])=>

            <div className="mb-4">

                    <input type="email" value={email} onChange={e=>setEmail(e.target.value)}

            </div>
            <div className="mb-6">
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Password</label>
                <div className="relative">
                    <i className="fas fa-lock absolute left-4 top-3.5 text-gray-400"/>
                    <input type={show?"text":"password"} value={pw} onChange={e=>setPw(e.target.value)}

                    <button onClick={()=>setShow(!show)} className="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600">
                        <i className={`fas fa-eye${show?'-slash':''}`}/>
                    </button>
                </div>
            </div>
            <button onClick={go} disabled={busy||!email||!pw}
                className="w-full btn-green text-white py-3.5 rounded-xl font-bold disabled:opacity-50">
                {busy?<><i className="fas fa-spinner fa-spin mr-2"/>Signing in...</>:<><i className="fas fa-sign-in-alt mr-2"/>Sign In</>}
            </button>
            <p className="text-center text-xs text-gray-400 mt-6">© 2025 RAHAMA Initiative</p>
        </div>
    </div>;
}

function ChangePw({user,onClose,notify}) {
    const [cur,setCur]=useState('');const [nw,setNw]=useState('');const [cf,setCf]=useState('');const [busy,setBusy]=useState(false);
    const go=async()=>{
        if(nw!==cf){notify('Passwords do not match','error');return;}
        if(nw.length<8){notify('Minimum 8 characters','error');return;}
        if(cur===nw){notify('New password must be different','error');return;}
        setBusy(true);
        try{
            // The database verifies the current password and stores the new one
            // hashed. The browser never handles the stored value.
            const r=await fetch(`${SB}/rest/v1/rpc/change_password`,{method:'POST',headers:HR,
                body:JSON.stringify({p_user_id:user.id,p_current:cur,p_new:nw})});
            if(!r.ok){
                const t=await r.text();
                notify(t.includes('at least 8')?'Password must be at least 8 characters':'Failed to update password','error');
            } else {
                const ok=await r.json();
                if(ok===true){notify('Password changed successfully!');onClose();}
                else notify('Current password is incorrect','error');
            }
        }catch(e){notify('Error changing password','error');}
        setBusy(false);
    };
    return <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div className="bg-white rounded-2xl p-6 max-w-md w-full animate-in">
            <div className="flex justify-between items-center mb-6">
                <h2 className="text-xl font-bold text-gray-800"><i className="fas fa-key text-green-600 mr-2"/>Change Password</h2>
                <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center"><i className="fas fa-times text-gray-500"/></button>
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-5"><p className="text-xs text-amber-700"><i className="fas fa-info-circle mr-1"/>Password must be at least 8 characters.</p></div>
            <div className="space-y-4">
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Current Password</label><input type="password" value={cur} onChange={e=>setCur(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl" placeholder="Current password"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">New Password</label><input type="password" value={nw} onChange={e=>setNw(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl" placeholder="New password"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Confirm New Password</label><input type="password" value={cf} onChange={e=>setCf(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl" placeholder="Confirm password"/>
                    {cf&&nw!==cf&&<p className="text-red-500 text-xs mt-1"><i className="fas fa-exclamation-triangle mr-1"/>Passwords don't match</p>}</div>
            </div>
            <div className="flex gap-3 mt-6">
                <button onClick={onClose} className="flex-1 bg-gray-100 py-3 rounded-xl font-semibold hover:bg-gray-200">Cancel</button>
                <button onClick={go} disabled={busy||!cur||!nw||!cf||nw!==cf} className="flex-1 btn-green text-white py-3 rounded-xl font-semibold disabled:opacity-50">{busy?'Updating...':'Update Password'}</button>
            </div>
        </div>
    </div>;
}

/* ==================== LOGIN LOGS ==================== */
function LoginLogs({notify,onBack}) {
    const [logs,setLogs]=useState([]);
    const [loading,setLoading]=useState(true);
    const [filter,setFilter]=useState('all');
    const [search,setSearch]=useState('');
    const [days,setDays]=useState(7);

    useEffect(()=>{
        setLoading(true);
        const since=new Date(Date.now()-days*24*60*60*1000).toISOString();
        fetch(`${SB}/rest/v1/login_logs?login_time=gte.${since}&order=login_time.desc&limit=300`,{headers:H})
        .then(r=>r.json())
        .then(d=>{setLogs(Array.isArray(d)?d:[]);setLoading(false);})
        .catch(()=>setLoading(false));
    },[days]);

    const filtered=logs.filter(l=>{
        const mf=filter==='all'||l.status===filter;
        const ms=!search||[l.name,l.email,l.device,l.browser,l.os,l.location].some(v=>(v||'').toLowerCase().includes(search.toLowerCase()));
        return mf&&ms;
    });

    const successCount=logs.filter(l=>l.status==='success').length;
    const failedCount=logs.filter(l=>l.status==='failed').length;
    const uniqueUsers=[...new Set(logs.filter(l=>l.status==='success').map(l=>l.email))].length;

    const fmt=ts=>{if(!ts)return'--';const d=new Date(ts);return d.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true});};
    const devIcon=d=>d==='Mobile'?'fa-mobile-alt':d==='Tablet'?'fa-tablet-alt':'fa-desktop';

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Login Activity Logs</h1>
            <p className="text-gray-500 mt-1">Track all login attempts, devices, and locations</p>
        </div>

        <div className="grid grid-cols-3 gap-4 mb-6">
            {[{label:'Successful Logins',val:successCount,color:'text-green-600',bg:'bg-green-50',icon:'fa-check-circle'},
              {label:'Unique Staff',val:uniqueUsers,color:'text-blue-600',bg:'bg-blue-50',icon:'fa-users'},
              {label:'Failed Attempts',val:failedCount,color:'text-red-500',bg:'bg-red-50',icon:'fa-times-circle'}
            ].map((s,i)=><div key={i} className="glass rounded-xl p-5 stat">
                <div className="flex justify-between items-start">
                    <div><p className="text-xs font-bold text-gray-400 uppercase">{s.label}</p>
                        <p className={`text-3xl font-extrabold mt-1 ${s.color}`}>{s.val}</p>
                        <p className="text-xs text-gray-400 mt-1">Last {days} days</p></div>
                    <div className={`w-10 h-10 ${s.bg} rounded-lg flex items-center justify-center`}><i className={`fas ${s.icon} ${s.color}`}/></div>
                </div>
            </div>)}
        </div>

        <div className="glass rounded-xl p-4 mb-6 flex flex-wrap items-center gap-3">
            <div className="flex gap-2">
                {[['all','All'],['success','Success'],['failed','Failed']].map(([k,l])=>
                    <button key={k} onClick={()=>setFilter(k)}
                        className={`px-4 py-2 rounded-xl text-sm font-bold transition ${filter===k?'btn-green text-white':'text-gray-500 hover:bg-gray-100'}`}>{l}</button>
                )}
            </div>
            <select value={days} onChange={e=>setDays(Number(e.target.value))} className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-medium">
                <option value={1}>Last 24 hours</option>
                <option value={7}>Last 7 days</option>
                <option value={14}>Last 14 days</option>
                <option value={30}>Last 30 days</option>
            </select>
            <input type="text" value={search} onChange={e=>setSearch(e.target.value)}
                className="flex-1 min-w-0 px-4 py-2 border-2 border-gray-200 rounded-xl text-sm"
                placeholder="Search name, email, device, location..."/>
        </div>

        <div className="glass rounded-2xl p-6">
            <h2 className="text-lg font-bold mb-4"><i className="fas fa-list text-blue-600 mr-2"/>Login Records ({filtered.length})</h2>

/* ==================== MONITORING & EVALUATION ====================
   Tracks project activity DELIVERY against the approved work plan.
   Deliberately independent of finance — bulk procurements and multi-month
   activities make spend a poor proxy for delivery. Grading uses RAHAMA's
   existing scale: <0.70 Unacceptable · 0.70–0.94 Meets Standard · ≥0.95 Outstanding
================================================================= */
const WP_STATUSES=['Not Started','On-Hold','Incomplete','Ongoing (Routine)','Ongoing (One-Off Activity)','Completed','Completed For Period','Delayed'];
const wpStatusColour=s=>({'Completed':'#059669','Completed For Period':'#10b981','Ongoing (Routine)':'#0284c7','Ongoing (One-Off Activity)':'#0284c7','Delayed':'#dc2626','Incomplete':'#e65100','On-Hold':'#7b1fa2','Not Started':'#6b7280'}[s]||'#6b7280');
const wpGrade=score=>{
    if(score>=0.95) return {label:'Outstanding',   colour:'#059669', cls:'bg-green-100 text-green-800'};
    if(score>=0.70) return {label:'Meets Standard',colour:'#e65100', cls:'bg-amber-100 text-amber-800'};
    return               {label:'Unacceptable', colour:'#dc2626', cls:'bg-red-100 text-red-700'};
};

/* Parse the uploaded workbook: locate the sheet + header row, forward-fill
   merged hierarchy cells, and read month markers into a planned-months array. */
function parseWorkPlanWorkbook(wb){
    const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const norm=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
    let best={rows:[],sheetName:null};
    for(const sheetName of wb.SheetNames){
        const grid=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:null,raw:true});
        let headerIdx=-1;
        for(let i=0;i<Math.min(grid.length,25);i++){
            const joined=(grid[i]||[]).map(norm).join('|').toLowerCase();
            if(joined.includes('sub-activit')&&joined.includes('type of activity')){headerIdx=i;break;}
        }
        if(headerIdx===-1) continue;
        const hdr=(grid[headerIdx]||[]).map(norm);
        const findCol=(...needles)=>hdr.findIndex(h=>{const l=h.toLowerCase();return needles.some(n=>l.includes(n));});
        const H={stage:findCol('project stage'),milestone:findCol('milestone','deliverable'),keyAct:findCol('key activit'),
                 subAct:findCol('sub-activit','sub activit'),type:findCol('type of activity'),totalMon:findCol('total month'),
                 dri:findCol('dri'),budget:hdr.findIndex(h=>h.toLowerCase()==='budget'),year:findCol('year'),months:{}};
        hdr.forEach((h,i)=>{const u=h.toUpperCase();if(MONTHS.includes(u))H.months[u]=i;});
        const rows=[];let curStage='',curMile='',curKey='';
        for(let i=headerIdx+1;i<grid.length;i++){
            const r=grid[i]||[];
            const val=c=>(c!=null&&c>=0)?norm(r[c]):'';
            const stage=val(H.stage),mile=val(H.milestone),key=val(H.keyAct);
            if(stage)curStage=stage; if(mile)curMile=mile; if(key)curKey=key;
            const sub=val(H.subAct),typ=val(H.type);
            if(!sub&&!typ) continue;
            if(!sub&&!curKey) continue;
            const planned=Object.keys(H.months).filter(m=>{const v=r[H.months[m]];return v!=null&&String(v).trim()!=='';});
            const budgetRaw=H.budget>=0?r[H.budget]:null;
            rows.push({stage:curStage,milestone:curMile,keyActivity:curKey,subActivity:sub||curKey,
                activityType:typ||'One off',dri:val(H.dri),
                totalMonths:(()=>{const n=parseInt(val(H.totalMon));return isNaN(n)?(planned.length||1):n;})(),
                plannedMonths:planned,
                budgetRef:(typeof budgetRaw==='number')?budgetRaw:null,
                budgetNote:(typeof budgetRaw==='string')?norm(budgetRaw):'',
                year:val(H.year),include:true});
        }
        if(rows.length>best.rows.length) best={rows,sheetName};
    }
    return best;
}
function MandEDashboard({plans,counts,acts,notify,onOpenPlan}) {
    // acts = { [work_plan_id]: [activities] } — passed in from parent, fetched once
    const projectStats = plans.map(p=>{
        const list = acts[p.id]||[];
        const done = list.filter(a=>['Completed','Completed For Period'].includes(a.current_status)&&a.verification_status==='verified').length;
        const total = list.length||counts[p.id]||0;
        const score = total?done/total:0;
        return {...p, total, done, score, grade:wpGrade(score)};
    });

    const allActs = Object.values(acts).flat();
    const totalActs = allActs.length;
    const totalDone = allActs.filter(a=>['Completed','Completed For Period'].includes(a.current_status)&&a.verification_status==='verified').length;
    const overallScore = totalActs?totalDone/totalActs:0;
    const overallGrade = wpGrade(overallScore);
    const awaiting = allActs.filter(a=>a.verification_status==='submitted').length;

    // Status breakdown for donut
    const statusCounts = {};
    allActs.forEach(a=>{const s=a.current_status||'Not Started';statusCounts[s]=(statusCounts[s]||0)+1;});
    const statusEntries = WP_STATUSES.filter(s=>statusCounts[s]).map(s=>({status:s,count:statusCounts[s],color:wpStatusColour(s)}));

    // Build donut arc segments
    const R=70, C=2*Math.PI*R;
    let acc=0;
    const arcs = statusEntries.map(e=>{
        const frac = totalActs? e.count/totalActs : 0;
        const dash = frac*C;
        const arc = {...e, dashArray:`${dash} ${C-dash}`, dashOffset: -acc*C};
        acc += frac;
        return arc;
    });

    return <div className="space-y-6">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Projects</p><p className="text-3xl font-extrabold text-gray-800 mt-1">{plans.length}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Total Activities</p><p className="text-3xl font-extrabold text-gray-800 mt-1">{totalActs}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Awaiting Verification</p><p className="text-3xl font-extrabold text-amber-600 mt-1">{awaiting}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Overall Grade</p>
                <p className="text-lg font-extrabold mt-2" style={{color:overallGrade.colour}}>{overallGrade.label}</p>
                <p className="text-xs text-gray-400">{Math.round(overallScore*100)}% complete</p></div>
        </div>

        <div className="grid md:grid-cols-3 gap-6">
            {/* Donut chart */}
            <div className="glass rounded-2xl p-6 md:col-span-1 flex flex-col items-center">
                <h3 className="font-bold text-gray-800 mb-4 self-start"><i className="fas fa-chart-pie text-cyan-600 mr-2"/>Activity Status</h3>
                <svg viewBox="0 0 180 180" width="180" height="180">
                    <circle cx="90" cy="90" r={R} fill="none" stroke="#f3f4f6" strokeWidth="24"/>
                    {arcs.map((a,i)=><circle key={i} cx="90" cy="90" r={R} fill="none" stroke={a.color} strokeWidth="24"
                        strokeDasharray={a.dashArray} strokeDashoffset={a.dashOffset} transform="rotate(-90 90 90)"/>)}
                    <text x="90" y="85" textAnchor="middle" fontSize="24" fontWeight="800" fill="#1f2937">{Math.round(overallScore*100)}%</text>
                    <text x="90" y="105" textAnchor="middle" fontSize="10" fill="#9ca3af">VERIFIED</text>
                </svg>
                <div className="grid grid-cols-1 gap-1.5 mt-4 w-full">
                    {statusEntries.map((e,i)=><div key={i} className="flex items-center justify-between text-xs">
                        <span className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full" style={{background:e.color}}/>{e.status}</span>
                        <span className="font-bold text-gray-600">{e.count}</span>
                    </div>)}
                </div>
            </div>

            {/* Per-project completion bars */}
            <div className="glass rounded-2xl p-6 md:col-span-2">
                <h3 className="font-bold text-gray-800 mb-4"><i className="fas fa-chart-bar text-indigo-600 mr-2"/>Completion by Project</h3>
                <div className="space-y-4">
                    {projectStats.map(p=><div key={p.id} className="cursor-pointer" onClick={()=>onOpenPlan(p)}>
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-sm font-semibold text-gray-700 truncate">{p.plan_name}</span>
                            <span className="text-xs font-bold" style={{color:p.grade.colour}}>{Math.round(p.score*100)}% · {p.grade.label}</span>
                        </div>
                        <div className="cbar"><div className="cbar-fill" style={{width:`${p.score*100}%`,background:p.grade.colour}}/></div>
                        <p className="text-xs text-gray-400 mt-1">{p.done}/{p.total} activities verified</p>
                    </div>)}
                    {projectStats.length===0&&<p className="text-center text-gray-400 py-6">No work plans yet</p>}
                </div>
            </div>
        </div>
    </div>;
}
function MandE({user,notify,onBack}) {
    const [view,setView]=useState('register');
    const [plans,setPlans]=useState([]);
    const [loading,setLoading]=useState(true);
    const [err,setErr]=useState(null);
    const [counts,setCounts]=useState({});
    const [selPlan,setSelPlan]=useState(null);
    const [actsByPlan,setActsByPlan]=useState({}); 

    const load=async()=>{setLoading(true);setErr(null);
        try{
            const r=await fetch(`${SB}/rest/v1/work_plans?order=created_at.desc`,{headers:H});
            if(!r.ok) throw new Error('Work plan tables not found — run the SQL setup first.');
            const d=await r.json();
            if(!Array.isArray(d)) throw new Error('Unexpected response from database.');
            setPlans(d);
            const a=await fetch(`${SB}/rest/v1/work_plan_activities?select=work_plan_id`,{headers:H});
            const ad=await a.json();
            const c={};(Array.isArray(ad)?ad:[]).forEach(x=>{c[x.work_plan_id]=(c[x.work_plan_id]||0)+1;});
            setCounts(c);
            const allActRows=await fetch(`${SB}/rest/v1/work_plan_activities?select=*`,{headers:H}).then(r=>r.json());
            const grouped={};(Array.isArray(allActRows)?allActRows:[]).forEach(x=>{(grouped[x.work_plan_id]=grouped[x.work_plan_id]||[]).push(x);});
            setActsByPlan(grouped);
        }catch(e){setErr(e.message);}
        setLoading(false);};
    useEffect(()=>{load();},[]);

    if(view==='import')   return <WorkPlanImport user={user} notify={notify} onDone={()=>{setView('register');load();}}/>;
    if(view==='activities')return <WorkPlanActivities plan={selPlan} user={user} notify={notify} onBack={()=>{setView('register');load();}}/>;
    if(view==='assign')   return <WorkPlanAssign plan={selPlan} user={user} notify={notify} onDone={()=>{setView('register');load();}}/>;

    const publish=async(p)=>{
        if(!confirm('Publish this work plan?\n\nIt becomes the approved baseline that delivery is measured against.')) return;
        const r=await fetch(`${SB}/rest/v1/work_plans?id=eq.${p.id}`,{method:'PATCH',headers:HJ,
            body:JSON.stringify({status:'active',approved_by:user.name,approved_at:new Date().toISOString()})});
        if(r.ok){notify('Work plan published');load();}else notify('Failed to publish','error');
    };

    const badge=s=>{const m={draft:'bg-gray-100 text-gray-700',active:'bg-green-100 text-green-700',closed:'bg-purple-100 text-purple-700'};
        return <span className={`px-2 py-1 rounded-full text-xs font-bold uppercase ${m[s]||m.draft}`}>{s||'draft'}</span>;};

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
            <div className="flex flex-wrap justify-between items-center gap-4">
                <div><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Monitoring &amp; Evaluation</h1>
                    <p className="text-gray-500 mt-1">Project work plans and delivery tracking</p></div>
                <button onClick={()=>setView('import')} className="btn-green text-white px-5 py-3 rounded-xl font-bold text-sm"><i className="fas fa-upload mr-2"/>Import Work Plan</button>
            </div>
        </div>

        {err&&<div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-5 mb-6">
            <h3 className="font-bold text-amber-800 mb-1"><i className="fas fa-triangle-exclamation mr-2"/>Setup required</h3>
            <p className="text-sm text-amber-700">{err}</p></div>}
{!loading && <MandEDashboard plans={plans} counts={counts} acts={actsByPlan} notify={notify}
            onOpenPlan={(p)=>{setSelPlan(p);setView('activities');}}/>}
        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>
        :plans.length===0&&!err?<div className="glass rounded-2xl p-12 text-center text-gray-400">
            <i className="fas fa-clipboard-list text-4xl mb-3"/><p className="font-semibold">No work plans yet</p>
            <p className="text-sm mt-1">Import a work plan from Excel to get started.</p></div>
        :<div className="space-y-3">{plans.map(p=>
            <div key={p.id} className="glass rounded-2xl p-5">
                <div className="flex flex-wrap justify-between items-start gap-4">
                    <div className="min-w-0">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                            <h3 className="font-bold text-gray-800">{p.plan_name}</h3>{badge(p.status)}
                        </div>
                        <p className="text-sm text-gray-500">{p.project_code} · {counts[p.id]||0} activities</p>
                        <p className="text-xs text-gray-400 mt-1">Created by {p.created_by||'—'}{p.start_date?` · ${p.start_date} → ${p.end_date||'—'}`:''}</p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                        <button onClick={()=>{setSelPlan(p);setView('activities');}} className="px-4 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-xl font-semibold text-sm"><i className="fas fa-list mr-2"/>Activities</button>
                        <button onClick={()=>{setSelPlan(p);setView('assign');}} className="px-4 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-xl font-semibold text-sm"><i className="fas fa-users mr-2"/>Assign</button>
                        {(p.status||'draft')==='draft'&&<button onClick={()=>publish(p)} className="btn-green text-white px-4 py-2 rounded-xl font-semibold text-sm"><i className="fas fa-check mr-2"/>Publish</button>}
                    </div>
                </div>
            </div>)}</div>}
    </div></div>;
}

function WorkPlanImport({user,notify,onDone}) {
    const [parsed,setParsed]=useState(null);
    const [fileName,setFileName]=useState('');
    const [projectCode,setProjectCode]=useState('');
    const [planName,setPlanName]=useState('');
    const [startDate,setStartDate]=useState('');
    const [endDate,setEndDate]=useState('');
    const [busy,setBusy]=useState(false);
    const fileRef=useRef(null);

    const onFile=async(e)=>{
        const f=e.target.files[0]; if(!f) return;
        setFileName(f.name);
        try{
            const buf=await f.arrayBuffer();
            const wb=XLSX.read(buf,{type:'array'});
            const p=parseWorkPlanWorkbook(wb);
            if(!p.rows.length){notify('No activity rows found — check the sheet has "Sub-Activities" and "Type of activity" headings','error');setParsed(null);return;}
            setParsed(p); notify(`${p.rows.length} activities found in "${p.sheetName}"`,'info');
        }catch(ex){notify('Could not read file: '+ex.message,'error');}
    };

    const toggle=(i,val)=>{const c={...parsed};c.rows=[...c.rows];c.rows[i]={...c.rows[i],include:val};setParsed(c);};
    const toggleAll=val=>{const c={...parsed};c.rows=c.rows.map(r=>({...r,include:val}));setParsed(c);};

    const save=async()=>{
        if(!projectCode.trim()){notify('Enter the project code','error');return;}
        if(!planName.trim()){notify('Give the work plan a name','error');return;}
        const rows=parsed.rows.filter(r=>r.include);
        if(!rows.length){notify('No activities selected','error');return;}
        setBusy(true);
        try{
            const r=await fetch(`${SB}/rest/v1/work_plans`,{method:'POST',
                headers:{...H,'Content-Type':'application/json','Prefer':'return=representation'},
                body:JSON.stringify({project_code:projectCode.trim(),plan_name:planName.trim(),
                    start_date:startDate||null,end_date:endDate||null,status:'draft',
                    source_sheet:parsed.sheetName,activity_count:rows.length,created_by:user.name})});
            if(!r.ok) throw new Error(await r.text());
            const plan=(await r.json())[0];

            // Re-use any saved DRI → owner mapping for this project
            let driMap={};
            try{
                const m=await fetch(`${SB}/rest/v1/work_plan_dri_map?project_code=eq.${encodeURIComponent(projectCode.trim())}`,{headers:H});
                const md=await m.json();
                (Array.isArray(md)?md:[]).forEach(x=>{driMap[x.dri]=x.staff_email;});
            }catch(e){}

            const payload=rows.map((x,i)=>({work_plan_id:plan.id,project_code:projectCode.trim(),
                stage:x.stage||null,milestone:x.milestone||null,key_activity:x.keyActivity||null,
                sub_activity:x.subActivity,activity_type:x.activityType,dri:x.dri||null,
                assigned_to:driMap[(x.dri||'').trim()]||null,
                total_months:x.totalMonths,planned_months:JSON.stringify(x.plannedMonths),
                budget_ref:x.budgetRef,budget_note:x.budgetNote||null,year:x.year||null,
                sort_order:i,current_status:'Not Started'}));
            for(let i=0;i<payload.length;i+=100){
                const br=await fetch(`${SB}/rest/v1/work_plan_activities`,{method:'POST',headers:HJ,body:JSON.stringify(payload.slice(i,i+100))});
                if(!br.ok) throw new Error(await br.text());
            }
            notify(`Work plan saved — ${rows.length} activities imported`);
            onDone();
        }catch(e){notify('Save failed: '+String(e.message).slice(0,120),'error');}
        setBusy(false);
    };

    const sel=parsed?parsed.rows.filter(r=>r.include).length:0;
    const totalBudget=parsed?parsed.rows.reduce((s,r)=>s+(r.budgetRef||0),0):0;

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onDone} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Import Work Plan</h1>
            <p className="text-gray-500 mt-1">Upload the Excel work plan — activities are extracted for review before saving</p>
        </div>

        <div className="glass rounded-2xl p-6 mb-6 space-y-4">
            <div className="grid md:grid-cols-2 gap-4">
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Project Code *</label>
                    <input value={projectCode} onChange={e=>setProjectCode(e.target.value)} placeholder="e.g. CBA101" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Work Plan Name *</label>
                    <input value={planName} onChange={e=>setPlanName(e.target.value)} placeholder="e.g. ECHO HIP Work Plan 2026" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Start Date</label>
                    <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">End Date</label>
                    <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
            </div>
            <div>
                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Excel File *</label>
                <div onClick={()=>fileRef.current&&fileRef.current.click()}

                    :<div><i className="fas fa-cloud-arrow-up text-gray-400 text-2xl mb-2"/><p className="text-sm text-gray-500">Click to select the work plan (.xlsx)</p>
                        <p className="text-xs text-gray-400 mt-1">The sheet with the master schedule is detected automatically</p></div>}
                </div>
                <input ref={fileRef} type="file" accept=".xlsx,.xlsm,.xls" className="hidden" onChange={onFile}/>

                <div className="flex flex-wrap gap-6 items-center">
