        {!readOnly?<>
            <div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-3"><i className="fas fa-file-alt text-blue-600 mr-2"/>Supporting Evidence (Optional)</h3><p className="text-sm text-gray-500 mb-4">Upload files or links to support your response.</p>
                {evidence.length>0&&<div className="space-y-2 mb-4">{evidence.map((ev,i)=><div key={i} className="flex items-center gap-3 bg-blue-50 rounded-xl p-3"><i className={`fas ${ev.file?'fa-file-circle-check text-green-500':'fa-paperclip text-blue-500'}`}/><div className="flex-1 min-w-0"><p className="text-sm font-semibold text-gray-800 truncate">{ev.description}</p><div className="flex items-center gap-2 mt-0.5">{ev.file&&<span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium"><i className="fas fa-file mr-1"/>{ev.file.name} ({(ev.file.size/1024).toFixed(0)}KB)</span>}{ev.link&&<span className="text-xs text-blue-600 truncate">{ev.link}</span>}</div></div>{ev.file&&ev.file.data&&<a href={ev.file.data} download={ev.file.name} className="text-blue-500 hover:text-blue-700 flex-shrink-0"><i className="fas fa-download"/></a>}<button onClick={()=>setEvidence(evidence.filter((_,j)=>j!==i))} className="text-red-400 hover:text-red-600 flex-shrink-0"><i className="fas fa-trash-alt"/></button></div>)}</div>}
                <div className="space-y-3"><input type="text" value={evDesc} onChange={e=>setEvDesc(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm" placeholder="Description"/>
                    <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Upload File (max 5MB)</label>
                        <div className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer hover:border-green-400 hover:bg-green-50 transition ${evFile?'border-green-400 bg-green-50':'border-gray-300'}`} onClick={()=>fileRef.current&&fileRef.current.click()}>
                            {evFile?<div className="flex items-center justify-center gap-2"><i className="fas fa-file-circle-check text-green-600"/><span className="text-sm font-semibold text-green-700">{evFile.name}</span><button onClick={(e)=>{e.stopPropagation();setEvFile(null);if(fileRef.current)fileRef.current.value='';}} className="ml-2 text-red-400"><i className="fas fa-times-circle"/></button></div>:<div><i className="fas fa-cloud-arrow-up text-gray-400 text-2xl mb-2"/><p className="text-sm text-gray-500">Click to select a file</p><p className="text-xs text-gray-400 mt-1">PDF, PNG, JPG, DOC, DOCX</p></div>}
                        </div>
                        <input ref={fileRef} type="file" className="hidden" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx" onChange={e=>{const f=e.target.files[0];if(f){if(f.size>5*1024*1024){notify('File too large','error');e.target.value='';return;}setEvFile(f);}}}/>
                    </div>
                    <input type="text" value={evLink} onChange={e=>setEvLink(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm" placeholder="Or paste a link/URL (optional)"/>
                    <button onClick={addEv} disabled={!evDesc.trim()||uploading} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold text-sm disabled:opacity-50 hover:bg-blue-700">{uploading?<><i className="fas fa-spinner fa-spin mr-2"/>Uploading...</>:<><i className="fas fa-plus mr-2"/>Add Evidence</>}</button>
                </div>
            </div>
            <div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-4"><i className="fas fa-gavel text-green-600 mr-2"/>Your Decision</h3>
                <div className="grid md:grid-cols-2 gap-4 mb-4">
                    <button onClick={()=>setResponse('accepted')} className={`p-5 rounded-xl border-2 text-left transition ${response==='accepted'?'border-green-500 bg-green-50':'border-gray-200 hover:border-green-300'}`}>
                        <div className="flex items-center gap-3 mb-2"><div className={`w-10 h-10 rounded-full flex items-center justify-center ${response==='accepted'?'bg-green-500 text-white':'bg-gray-100 text-gray-400'}`}><i className="fas fa-check"/></div><h4 className="font-bold text-gray-800">Accept Review</h4></div>
                        <p className="text-sm text-gray-500">I agree with my supervisor's assessment.</p></button>
                    <button onClick={()=>setResponse('rejected')} className={`p-5 rounded-xl border-2 text-left transition ${response==='rejected'?'border-red-500 bg-red-50':'border-gray-200 hover:border-red-300'}`}>
                        <div className="flex items-center gap-3 mb-2"><div className={`w-10 h-10 rounded-full flex items-center justify-center ${response==='rejected'?'bg-red-500 text-white':'bg-gray-100 text-gray-400'}`}><i className="fas fa-times"/></div><h4 className="font-bold text-gray-800">Dispute Review</h4></div>
                        <p className="text-sm text-gray-500">I disagree and want to provide reasoning.</p></button>
                </div>
                <div><label className="block text-sm font-bold text-gray-700 mb-2">Your Comments {response==='rejected'&&<span className="text-red-500">* (required)</span>}</label>
                    <textarea value={comments} onChange={e=>setComments(e.target.value)} rows="5" className={`w-full px-4 py-3 border-2 rounded-xl text-sm ${response==='rejected'&&comments.trim().length<20?'border-red-300':'border-gray-200'}`} placeholder={response==='rejected'?'Explain which ratings you disagree with and why (min 20 chars)...':'Additional comments (optional)...'}/>
                    {response==='rejected'&&comments.trim().length<20&&<p className="text-red-500 text-xs mt-1"><i className="fas fa-exclamation-circle mr-1"/>Min 20 characters required</p>}</div>
            </div>
            <div className="glass rounded-xl p-6 flex gap-4">
                <button onClick={onDone} disabled={busy} className="flex-1 bg-gray-100 py-4 rounded-xl font-bold hover:bg-gray-200">Cancel</button>
                <button onClick={submit} disabled={busy||!response||(response==='rejected'&&comments.trim().length<20)} className={`flex-1 text-white py-4 rounded-xl font-bold disabled:opacity-50 ${response==='rejected'?'bg-red-600 hover:bg-red-700':'btn-green'}`}>
                    {busy?'Submitting...':!response?'Select Accept or Dispute':response==='accepted'?'✓ Accept Review':'⚠ Submit Dispute'}</button>
            </div>
        </>:<div className="glass rounded-2xl p-6 mb-6">
            <h3 className="font-bold mb-3"><i className={`fas ${appraisal.employee_review_status==='accepted'?'fa-check-circle text-green-600':'fa-exclamation-circle text-red-600'} mr-2`}/>Your Response: {appraisal.employee_review_status==='accepted'?'Accepted':'Disputed'}</h3>
            {appraisal.employee_review_comments&&<div className="bg-gray-50 rounded-xl p-4 mb-3"><p className="text-sm text-gray-700 whitespace-pre-wrap">{appraisal.employee_review_comments}</p></div>}
            {appraisal.employee_evidence&&appraisal.employee_evidence.length>0&&<div><p className="text-sm font-bold text-gray-600 mb-2">Attached Evidence:</p>{appraisal.employee_evidence.map((ev,i)=><div key={i} className="flex items-center gap-2 bg-blue-50 rounded-lg p-3 mb-2"><i className={`fas ${ev.file?'fa-file-circle-check text-green-500':'fa-paperclip text-blue-500'}`}/><div className="flex-1 min-w-0"><span className="text-sm font-semibold text-gray-800">{ev.description}</span>{ev.file&&<span className="text-xs text-gray-500 ml-2">({ev.file.name})</span>}</div>{ev.file&&ev.file.data&&<a href={ev.file.data} download={ev.file.name} className="text-blue-600 text-xs font-semibold hover:underline flex-shrink-0"><i className="fas fa-download mr-1"/>Download</a>}{ev.link&&<a href={ev.link} target="_blank" rel="noreferrer" className="text-blue-600 text-xs hover:underline flex-shrink-0">{ev.link}</a>}</div>)}</div>}
            <button onClick={onDone} className="mt-4 btn-green text-white px-6 py-3 rounded-xl font-semibold"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
        </div>}
    </div></div>;
}

/* ==================== ATTENDANCE ==================== */
const OFFICES=[{name:'Kano Office',lat:11.984881,lng:8.530260,radius:500},{name:'Katsina Office',lat:12.943856,lng:7.608453,radius:500}];
function getDistanceM(lat1,lon1,lat2,lon2){const R=6371e3,r=Math.PI/180,dLat=(lat2-lat1)*r,dLon=(lon2-lon1)*r,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
async function checkOfficeNetwork(){try{const r=await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(5000)});if(!r.ok)return{ok:false,reason:'Could not verify network'};const d=await r.json();const city=(d.city||'').toLowerCase(),region=(d.region||'').toLowerCase();if(city.includes('kano')||city.includes('katsina')||region.includes('kano')||region.includes('katsina'))return{ok:true,method:'network',ip:d.ip,city:d.city||d.region};return{ok:false,reason:`Network: ${d.city||d.region||'Unknown'} — not office area`};}catch(e){return{ok:false,reason:'Network check failed'};}}
function checkGPS(){return new Promise(resolve=>{if(!navigator.geolocation){resolve({ok:false,reason:'GPS not available'});return;}navigator.geolocation.getCurrentPosition(pos=>{for(const o of OFFICES){const dist=getDistanceM(pos.coords.latitude,pos.coords.longitude,o.lat,o.lng);if(dist<=o.radius){resolve({ok:true,method:'gps',distance:Math.round(dist),office:o.name});return;}}const nearest=OFFICES.map(o=>({...o,dist:getDistanceM(pos.coords.latitude,pos.coords.longitude,o.lat,o.lng)})).sort((a,b)=>a.dist-b.dist)[0];resolve({ok:false,reason:`Nearest: ${nearest.name} (${Math.round(nearest.dist)}m, max ${nearest.radius}m)`});},err=>{const msgs={1:'Location permission denied',2:'Location unavailable',3:'Location timed out'};resolve({ok:false,reason:msgs[err.code]||'GPS error'});},{enableHighAccuracy:true,timeout:10000,maximumAge:0});})}

function Attendance({user,notify,onBack}) {
    const [today,setToday]=useState(null);const [history,setHistory]=useState([]);const [loading,setLoading]=useState(true);const [note,setNote]=useState('');const [busy,setBusy]=useState(false);const [month,setMonth]=useState(new Date().toISOString().slice(0,7));const [locStatus,setLocStatus]=useState(null);
    const todayStr=new Date().toISOString().slice(0,10);
    const load=async()=>{setLoading(true);try{const tr=await fetch(`${SB}/rest/v1/attendance?employee_id=eq.${user.id}&date=eq.${todayStr}`,{headers:H});if(!tr.ok){setLoading(false);return;}const td=await tr.json();setToday(Array.isArray(td)&&td.length>0?td[0]:null);
        const hr=await fetch(`${SB}/rest/v1/attendance?employee_id=eq.${user.id}&order=date.desc`,{headers:H});const hd=await hr.json();setHistory(Array.isArray(hd)?hd.filter(r=>r.date&&r.date.startsWith(month)):[]);}catch(e){}setLoading(false);};
    useEffect(()=>{load();},[month]);
    const verifyLocation=async()=>{setLocStatus({checking:true});const gps=await checkGPS();if(gps.ok){setLocStatus({passed:true,method:'GPS',detail:`${gps.distance}m from ${gps.office}`});return true;}const net=await checkOfficeNetwork();if(net.ok){setLocStatus({passed:true,method:'Network',detail:`IP in ${net.city}`});return true;}setLocStatus({failed:true,gpsReason:gps.reason,netReason:net.reason});return false;};
    const clockIn=async()=>{setBusy(true);const allowed=await verifyLocation();if(!allowed){notify('Cannot clock in — you must be at the office','error');setBusy(false);return;}
        try{const now=new Date().toISOString();const hour=new Date().getHours();const status=hour>=9?'late':'present';const locInfo=locStatus.method?` [${locStatus.method}]`:'';
        const r=await fetch(`${SB}/rest/v1/attendance`,{method:'POST',headers:HJ,body:JSON.stringify({employee_id:user.id,date:todayStr,clock_in:now,clock_in_note:(note||'')+locInfo||null,status})});
        if(r.ok){notify(status==='late'?'Clocked in (Late)':'Clocked in!');setNote('');load();}else{const t=await r.text();if(t.includes('duplicate')||t.includes('unique')){notify('Already clocked in today','error');}else notify('Failed to clock in','error');}}catch(e){notify('Error','error');}setBusy(false);};
    const clockOut=async()=>{if(!today){notify("Haven't clocked in today",'error');return;}setBusy(true);try{const r=await fetch(`${SB}/rest/v1/attendance?id=eq.${today.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({clock_out:new Date().toISOString(),clock_out_note:note||null})});if(r.ok){notify('Clocked out!');setNote('');load();}else notify('Failed','error');}catch(e){notify('Error','error');}setBusy(false);};
    const fmt=ts=>{if(!ts)return'--';const d=new Date(ts);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true});};
    const dur=(a,b)=>{if(!a||!b)return'--';const ms=new Date(b)-new Date(a);return `${Math.floor(ms/3600000)}h ${Math.floor((ms%3600000)/60000)}m`;};
    const nowH=new Date().getHours(),nowM=new Date().getMinutes(),timeStr=`${nowH%12||12}:${String(nowM).padStart(2,'0')} ${nowH>=12?'PM':'AM'}`;
    const totalDays=history.length,lateDays=history.filter(h=>h.status==='late').length;const avgHours=history.filter(h=>h.clock_in&&h.clock_out).map(h=>(new Date(h.clock_out)-new Date(h.clock_in))/3600000);const avgH=avgHours.length?(avgHours.reduce((a,b)=>a+b,0)/avgHours.length).toFixed(1):'0';
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
            <div className="flex justify-between items-end"><div><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Attendance</h1><p className="text-gray-500 mt-1">{user.name} · {new Date().toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p></div><div className="text-right"><p className="text-xs font-bold text-gray-400 uppercase">Current Time</p><p className="text-2xl font-extrabold text-blue-600">{timeStr}</p></div></div></div>
        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>:<>
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="text-lg font-bold mb-4"><i className="fas fa-fingerprint text-blue-600 mr-2"/>Today's Attendance</h2>
            {today?<div>
                <div className="grid md:grid-cols-3 gap-4 mb-4">
                    <div className="bg-green-50 border border-green-200 rounded-xl p-4 text-center"><p className="text-xs font-bold text-green-500 uppercase">Clock In</p><p className="text-2xl font-extrabold text-green-700 mt-1">{fmt(today.clock_in)}</p>{today.clock_in_note&&<p className="text-xs text-gray-500 mt-1 italic">{today.clock_in_note}</p>}</div>
                    <div className={`border rounded-xl p-4 text-center ${today.clock_out?'bg-blue-50 border-blue-200':'bg-amber-50 border-amber-200'}`}><p className={`text-xs font-bold uppercase ${today.clock_out?'text-blue-500':'text-amber-500'}`}>Clock Out</p><p className={`text-2xl font-extrabold mt-1 ${today.clock_out?'text-blue-700':'text-amber-600'}`}>{fmt(today.clock_out)}</p></div>
                    <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 text-center"><p className="text-xs font-bold text-gray-400 uppercase">Duration</p><p className="text-2xl font-extrabold text-gray-700 mt-1">{dur(today.clock_in,today.clock_out)}</p></div>
                </div>
                <div className="flex items-center gap-2 mb-4"><span className={`px-3 py-1 rounded-full text-xs font-bold ${today.status==='late'?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'}`}>{today.status==='late'?'⏰ Late':'✓ On Time'}</span>{today.clock_out&&<span className="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700">✓ Day Complete</span>}</div>
                {!today.clock_out&&<><input type="text" value={note} onChange={e=>setNote(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm mb-3" placeholder="Clock out note (optional)..."/>
                    <button onClick={clockOut} disabled={busy} className="w-full py-4 rounded-xl font-bold text-white text-lg disabled:opacity-50" style={{background:'linear-gradient(135deg,#dc2626,#b91c1c)'}}>{busy?<><i className="fas fa-spinner fa-spin mr-2"/>Processing...</>:<><i className="fas fa-sign-out-alt mr-2"/>Clock Out</>}</button></>}
            </div>:<div>
                <div className="text-center py-6 mb-4"><div className="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center" style={{background:'linear-gradient(135deg,#dcfce7,#bbf7d0)'}}><i className="fas fa-clock text-green-600 text-3xl"/></div><p className="text-gray-600 font-semibold">You haven't clocked in today</p><p className="text-sm text-gray-400 mt-1">Standard hours: 8:00 AM - 5:00 PM</p></div>
                <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4"><div className="flex items-start gap-2"><i className="fas fa-map-marker-alt text-blue-600 mt-0.5"/><div><p className="text-sm font-semibold text-blue-800">Location Verification Required</p><p className="text-xs text-blue-600 mt-0.5">You must be at the office to clock in. GPS or network will be checked automatically.</p></div></div></div>
                {locStatus&&<div className={`rounded-xl p-4 mb-4 ${locStatus.checking?'bg-gray-50 border border-gray-200':locStatus.passed?'bg-green-50 border border-green-200':'bg-red-50 border border-red-200'}`}>
                    {locStatus.checking&&<div className="flex items-center gap-2 text-gray-600"><i className="fas fa-spinner fa-spin"/><span className="text-sm font-medium">Verifying your location...</span></div>}
                    {locStatus.passed&&<div className="flex items-center gap-2 text-green-700"><i className="fas fa-check-circle"/><span className="text-sm font-medium">Location verified via {locStatus.method} — {locStatus.detail}</span></div>}
                    {locStatus.failed&&<div><div className="flex items-center gap-2 text-red-700 mb-2"><i className="fas fa-times-circle"/><span className="text-sm font-bold">Location verification failed</span></div><p className="text-xs text-red-600"><i className="fas fa-location-dot mr-1"/>GPS: {locStatus.gpsReason}</p><p className="text-xs text-red-600 mt-1"><i className="fas fa-wifi mr-1"/>Network: {locStatus.netReason}</p><p className="text-xs text-red-500 mt-2 font-medium">Please ensure you are at the office and try again.</p></div>}
                </div>}
                <input type="text" value={note} onChange={e=>setNote(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm mb-3" placeholder="Clock in note (optional)..."/>
                <button onClick={clockIn} disabled={busy} className="w-full py-4 rounded-xl font-bold text-white text-lg btn-green disabled:opacity-50">{busy?<><i className="fas fa-spinner fa-spin mr-2"/>Verifying location...</>:<><i className="fas fa-sign-in-alt mr-2"/>Clock In</>}</button>
            </div>}
        </div>
        <div className="grid grid-cols-3 gap-4 mb-6">
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Days Present</p><p className="text-3xl font-extrabold text-green-600 mt-1">{totalDays}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Late Days</p><p className="text-3xl font-extrabold text-amber-600 mt-1">{lateDays}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Avg Hours</p><p className="text-3xl font-extrabold text-blue-600 mt-1">{avgH}</p></div>
        </div>
        <div className="glass rounded-2xl p-6"><div className="flex justify-between items-center mb-4"><h2 className="text-lg font-bold"><i className="fas fa-calendar-alt text-blue-600 mr-2"/>Attendance History</h2><input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-medium"/></div>
            {history.length===0?<div className="text-center py-8 text-gray-400"><i className="fas fa-calendar-xmark text-3xl mb-2"/><p className="font-semibold">No records for this month</p></div>
            :<div className="space-y-2">{history.map(h=><div key={h.id} className="flex items-center gap-4 border-2 border-gray-100 rounded-xl p-4 hover:border-blue-200 transition">
                <div className="w-12 h-12 rounded-xl bg-gray-100 flex flex-col items-center justify-center flex-shrink-0"><span className="text-xs font-bold text-gray-400 uppercase leading-none">{new Date(h.date+'T12:00:00').toLocaleDateString([],{weekday:'short'})}</span><span className="text-lg font-extrabold text-gray-800 leading-none">{new Date(h.date+'T12:00:00').getDate()}</span></div>
                <div className="flex-1 min-w-0"><div className="flex items-center gap-2 mb-1"><span className={`px-2 py-0.5 rounded-full text-xs font-bold ${h.status==='late'?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'}`}>{h.status==='late'?'Late':'On Time'}</span>{!h.clock_out&&<span className="px-2 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-600">No Clock Out</span>}</div>
                    <div className="flex items-center gap-4 text-sm text-gray-600"><span><i className="fas fa-sign-in-alt text-green-500 mr-1"/>{fmt(h.clock_in)}</span><span><i className="fas fa-sign-out-alt text-red-400 mr-1"/>{fmt(h.clock_out)}</span><span className="font-semibold text-gray-800"><i className="fas fa-hourglass-half text-blue-400 mr-1"/>{dur(h.clock_in,h.clock_out)}</span></div>
                </div>
            </div>)}</div>}
        </div></>}
    </div></div>;
}

/* ==================== ATTENDANCE ADMIN ==================== */
function AttendanceAdmin({notify,onBack}) {
    const [records,setRecords]=useState([]);const [names,setNames]=useState({});const [loading,setLoading]=useState(true);const [date,setDate]=useState(new Date().toISOString().slice(0,10));const [viewMode,setViewMode]=useState('daily');const [month,setMonth]=useState(new Date().toISOString().slice(0,7));
    const load=async()=>{setLoading(true);try{let url=viewMode==='daily'?`${SB}/rest/v1/attendance?date=eq.${date}&order=clock_in.asc`:`${SB}/rest/v1/attendance?date=gte.${month}-01&date=lte.${month}-31&order=date.desc,clock_in.asc`;
        const r=await fetch(url,{headers:H});if(!r.ok){setLoading(false);return;}const data=await r.json();if(!Array.isArray(data)){setRecords([]);setLoading(false);return;}setRecords(data);
        const ids=[...new Set(data.map(a=>a.employee_id))];if(ids.length>0){const ur=await fetch(`${SB}/rest/v1/users?select=id,name&id=in.(${ids.join(',')})&role=eq.employee`,{headers:H});const users=await ur.json();if(Array.isArray(users)){const n={};users.forEach(u=>n[u.id]=u.name);setNames(n);}}
        const ar=await fetch(`${SB}/rest/v1/users?select=id,name&role=eq.employee`,{headers:H});const allEmp=await ar.json();if(Array.isArray(allEmp)){allEmp.forEach(u=>{if(!names[u.id])setNames(prev=>({...prev,[u.id]:u.name}));});}}catch(e){}setLoading(false);};
    useEffect(()=>{load();},[date,month,viewMode]);
    const fmt=ts=>{if(!ts)return'--';return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true});};
    const dur=(a,b)=>{if(!a||!b)return'--';const ms=new Date(b)-new Date(a);return `${Math.floor(ms/3600000)}h ${Math.floor((ms%3600000)/60000)}m`;};
    const present=records.filter(r=>r.date===date).length,late=records.filter(r=>r.date===date&&r.status==='late').length,onTime=present-late;
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Team Attendance</h1><p className="text-gray-500 mt-1">Monitor team clock-in and clock-out records</p></div>
        <div className="glass rounded-xl p-4 mb-6 flex flex-wrap items-center gap-3">
            <div className="flex gap-2"><button onClick={()=>setViewMode('daily')} className={`px-4 py-2 rounded-xl text-sm font-bold transition ${viewMode==='daily'?'btn-green text-white':'text-gray-500 hover:bg-gray-100'}`}><i className="fas fa-calendar-day mr-2"/>Daily</button><button onClick={()=>setViewMode('monthly')} className={`px-4 py-2 rounded-xl text-sm font-bold transition ${viewMode==='monthly'?'btn-green text-white':'text-gray-500 hover:bg-gray-100'}`}><i className="fas fa-calendar mr-2"/>Monthly</button></div>
            {viewMode==='daily'?<input type="date" value={date} onChange={e=>setDate(e.target.value)} className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-medium ml-auto"/>:<input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-medium ml-auto"/>}
        </div>
        {viewMode==='monthly'&&records.length>0&&(()=>{
          const byEmp={};
          records.forEach(r=>{if(!byEmp[r.employee_id])byEmp[r.employee_id]={total:0,late:0};byEmp[r.employee_id].total++;if(r.status==='late')byEmp[r.employee_id].late++;});
          return <div className="glass rounded-2xl p-5 mb-6">
            <h3 className="font-bold mb-3 text-sm text-gray-600 uppercase tracking-wider"><i className="fas fa-calculator text-amber-500 mr-2"/>Appraisal Deduction Preview — This Month</h3>
            <div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="border-b-2 border-gray-100">
              <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Staff</th>
              <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Days Present</th>
              <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Late Days</th>
              <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Score Deduction</th>
              <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Impact</th>
            </tr></thead>
            <tbody>{Object.entries(byEmp).map(([id,s])=>{const ded=calcDeduction(s.late);return <tr key={id} className="border-b border-gray-50">
              <td className="py-2 px-2 font-semibold text-gray-800">{names[id]||'Staff'}</td>
              <td className="py-2 px-2 text-gray-600">{s.total}</td>
              <td className="py-2 px-2"><span className={`font-bold ${s.late>3?'text-red-600':s.late>0?'text-amber-600':'text-gray-500'}`}>{s.late}</span></td>
              <td className="py-2 px-2"><span className={`font-bold px-2 py-0.5 rounded-full text-xs ${ded>0?'bg-red-100 text-red-700':'bg-green-100 text-green-700'}`}>{ded>0?`−${ded} pts`:'None'}</span></td>
              <td className="py-2 px-2 text-xs text-gray-500">{ded===0?'✓ No impact':ded<=2?'Minor':ded<=5?'Moderate':ded<=8?'Significant':ded<=12?'Severe':'Maximum'}</td>
            </tr>;})}
            </tbody></table></div>
          </div>;
        })()}
        {viewMode==='daily'&&<div className="grid grid-cols-3 gap-4 mb-6"><div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Present</p><p className="text-3xl font-extrabold text-green-600 mt-1">{present}</p></div><div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">On Time</p><p className="text-3xl font-extrabold text-blue-600 mt-1">{onTime}</p></div><div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Late</p><p className="text-3xl font-extrabold text-amber-600 mt-1">{late}</p></div></div>}
        <div className="glass rounded-2xl p-6"><h2 className="text-lg font-bold mb-4"><i className="fas fa-list text-blue-600 mr-2"/>{viewMode==='daily'?`Records for ${new Date(date+'T12:00:00').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}`:`Records for ${new Date(month+'-01T12:00:00').toLocaleDateString([],{year:'numeric',month:'long'})}`}</h2>
            {loading?<div className="text-center py-8 text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>:records.length===0?<div className="text-center py-8 text-gray-400"><i className="fas fa-calendar-xmark text-3xl mb-2"/><p className="font-semibold">No attendance records</p></div>
            :<div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="border-b-2 border-gray-100"><th className="text-left py-3 px-2 font-bold text-gray-500 uppercase text-xs">Employee</th>{viewMode==='monthly'&&<th className="text-left py-3 px-2 font-bold text-gray-500 uppercase text-xs">Date</th>}<th className="text-left py-3 px-2 font-bold text-gray-500 uppercase text-xs">Clock In</th><th className="text-left py-3 px-2 font-bold text-gray-500 uppercase text-xs">Clock Out</th><th className="text-left py-3 px-2 font-bold text-gray-500 uppercase text-xs">Duration</th><th className="text-left py-3 px-2 font-bold text-gray-500 uppercase text-xs">Status</th></tr></thead>
            <tbody>{records.map(r=><tr key={r.id} className="border-b border-gray-50 hover:bg-gray-50"><td className="py-3 px-2 font-semibold text-gray-800"><i className="fas fa-user-circle text-green-500 mr-2"/>{names[r.employee_id]||'Employee'}</td>{viewMode==='monthly'&&<td className="py-3 px-2 text-gray-600">{new Date(r.date+'T12:00:00').toLocaleDateString([],{month:'short',day:'numeric'})}</td>}<td className="py-3 px-2 text-gray-600">{fmt(r.clock_in)}{r.clock_in_note&&<span className="text-xs text-gray-400 ml-1" title={r.clock_in_note}>📝</span>}</td><td className="py-3 px-2 text-gray-600">{fmt(r.clock_out)}{r.clock_out_note&&<span className="text-xs text-gray-400 ml-1" title={r.clock_out_note}>📝</span>}</td><td className="py-3 px-2 font-semibold text-gray-800">{dur(r.clock_in,r.clock_out)}</td><td className="py-3 px-2"><span className={`px-2 py-0.5 rounded-full text-xs font-bold ${r.status==='late'?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'}`}>{r.status==='late'?'Late':'On Time'}</span></td></tr>)}</tbody></table></div>}
        </div>
    </div></div>;
}

/* ==================== SUPERVISOR DASHBOARD — with Login Logs button ==================== */

    const [allApps,setAllApps]=useState([]);const [selected,setSelected]=useState(null);const [names,setNames]=useState({});const [showPw,setShowPw]=useState(false);const [tab,setTab]=useState('pending');
    const [showAttendance,setShowAttendance]=useState(false);const [showLeave,setShowLeave]=useState(false);const [showHR,setShowHR]=useState(false);const [showLoginLogs,setShowLoginLogs]=useState(false);const [showMandE,setShowMandE]=useState(false);const [showMyActs,setShowMyActs]=useState(false);

    if(showLeave) return <LeaveAdmin notify={notify} onBack={()=>setShowLeave(false)}/>;
    if(showHR) return <HRAdmin notify={notify} onBack={()=>setShowHR(false)}/>;
    if(showLoginLogs) return <LoginLogs notify={notify} onBack={()=>setShowLoginLogs(false)}/>;
    if(showMandE) return <MandE user={user} notify={notify} onBack={()=>setShowMandE(false)}/>;
    if(showMyActs) return <MyActivities user={user} notify={notify} onBack={()=>setShowMyActs(false)}/>;

                <div><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Supervisor Dashboard</h1><p className="text-gray-500 font-medium mt-1"><i className="fas fa-user-tie text-green-600 mr-2"/>{user.name}</p></div>
                <div className="flex gap-2"><button onClick={()=>setShowPw(true)} className="px-4 py-2 bg-green-50 text-green-700 hover:bg-green-100 rounded-xl font-medium text-sm"><i className="fas fa-key mr-2"/>Password</button><button onClick={onLogout} className="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-xl text-sm"><i className="fas fa-sign-out-alt mr-2"/>Logout</button></div>

        </div>
        {/* Action buttons */}

        ].map((b,i)=><button key={i} onClick={b.fn} className="w-full glass rounded-2xl p-5 mb-4 hover:shadow-xl stat group">

function SupReview({app,name,notify,onDone}) {
    const done=app.status==='completed';
    const [lateDays,setLateDays]=useState(app.attendance_late_days||0);
    const [deduction,setDeduction]=useState(app.attendance_deduction||0);
    const [attLoaded,setAttLoaded]=useState(false);

    useEffect(()=>{
        const month=new Date(app.created_at).toISOString().slice(0,7);
        fetch(`${SB}/rest/v1/attendance?employee_id=eq.${app.employee_id}&date=gte.${month}-01&date=lte.${month}-31`,{headers:H})
        .then(r=>r.json())
        .then(records=>{
            if(Array.isArray(records)){
                const late=records.filter(r=>r.status==='late').length;
                const ded=calcDeduction(late);
                setLateDays(late); setDeduction(ded); setAttLoaded(true);
            }
        }).catch(()=>setAttLoaded(true));
    },[]);

    const [rate,setRate]=useState(app.supervisor_ratings||{});const [comm,setComm]=useState(app.supervisor_comments||{});const [overall,setOverall]=useState(app.supervisor_overall_comments||'');const [busy,setBusy]=useState(false);

    const compScore=scoreToPercent(avg(rate));
    const finalScr=adjustedScore(avg(rate),deduction);
    const gradeBand=gradeFromScore(finalScr);
    const rated=Object.keys(rate).length;

    const progress=(rated/comps.length)*100;const allComm=Object.keys(rate).every(k=>comm[k]&&comm[k].trim().length>=10);const missing=Object.keys(rate).filter(k=>!comm[k]||comm[k].trim().length<10);
    const submit=async()=>{if(rated<comps.length){notify('Rate all competencies','error');return;}if(!allComm){notify(`Add feedback for: ${missing[0]}`,'error');return;}if(!overall.trim()){notify('Add overall assessment','error');return;}setBusy(true);
        try{const r=await fetch(`${SB}/rest/v1/appraisals?id=eq.${app.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({status:'completed',supervisor_ratings:rate,supervisor_comments:comm,supervisor_overall_comments:overall,completed_at:new Date().toISOString(),employee_review_status:'pending',attendance_late_days:lateDays,attendance_deduction:deduction,final_score:finalScr,grade_band:gradeBand.name})});if(r.ok){notify('Review completed!');onDone();}else notify('Failed','error');}catch(e){notify('Error','error');}setBusy(false);};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><button onClick={onDone} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <div className="flex justify-between items-end mb-4"><div><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">{done?'Review Details':'Performance Review'}</h1><p className="text-gray-500 mt-1"><i className="fas fa-user-circle text-green-600 mr-2"/>{name}</p></div>{!done&&<div className="text-right"><p className="text-xs font-bold text-gray-400 uppercase">Progress</p><p className="text-3xl font-extrabold text-green-600">{Math.round(progress)}%</p></div>}</div>
            {!done&&<><div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden"><div className="bg-gradient-to-r from-green-500 to-emerald-600 h-3 rounded-full progress-anim" style={{width:`${progress}%`}}/></div><p className="text-xs text-gray-400 mt-2">{rated} of {comps.length} rated</p></>}
        </div>
        {app.employee_review_status==='rejected'&&app.employee_review_comments&&<div className="bg-red-50 border-2 border-red-200 rounded-2xl p-5 mb-6"><div className="flex items-start gap-3"><div className="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center flex-shrink-0"><i className="fas fa-flag text-red-600"/></div><div><h3 className="font-bold text-red-800">Employee Disputed This Review</h3><p className="text-sm text-red-700 mt-1 whitespace-pre-wrap">{app.employee_review_comments}</p>{app.employee_evidence&&app.employee_evidence.length>0&&<div className="mt-3"><p className="text-xs font-bold text-red-600 mb-1">Evidence Provided:</p>{app.employee_evidence.map((ev,i)=><div key={i} className="flex items-center gap-2 bg-white rounded-lg p-2 mb-1"><i className={`fas ${ev.file?'fa-file-circle-check text-green-500':'fa-paperclip text-red-400'}`}/><span className="text-sm text-gray-800">{ev.description}</span>{ev.file&&<span className="text-xs text-gray-500">({ev.file.name})</span>}{ev.file&&ev.file.data&&<a href={ev.file.data} download={ev.file.name} className="text-blue-600 text-xs font-semibold hover:underline ml-auto"><i className="fas fa-download mr-1"/>Download</a>}{ev.link&&!ev.file&&<a href={ev.link} target="_blank" rel="noreferrer" className="text-blue-600 text-xs hover:underline ml-auto">{ev.link}</a>}</div>)}</div>}</div></div></div>}
        {!done&&<><div className="glass rounded-xl p-5 mb-6"><h3 className="font-bold text-sm mb-3 text-gray-600"><i className="fas fa-info-circle text-green-600 mr-2"/>Rating Scale</h3><div className="grid grid-cols-5 gap-2">{rats.map(r=><div key={r.v} className="p-2 rounded-lg border text-center" style={{borderColor:r.c+'40',background:r.c+'10'}}><div className="font-extrabold text-sm" style={{color:r.c}}>{r.v}</div><div className="text-xs text-gray-600">{r.l}</div></div>)}</div></div>
        <div className="bg-amber-50 border-2 border-amber-200 rounded-xl p-4 mb-6"><p className="text-sm text-amber-800 font-semibold"><i className="fas fa-exclamation-triangle mr-2"/>Feedback Required</p><p className="text-xs text-amber-600 mt-1">Written feedback (min 10 characters) is mandatory for each competency.</p></div></>}
        {!done && attLoaded && (
          <div className="glass rounded-2xl p-6 mb-6 border-2 border-green-100">
            <h2 className="text-lg font-bold mb-4"><i className="fas fa-calculator text-green-600 mr-2"/>Live Score Preview</h2>
            <div className="grid grid-cols-3 gap-4 mb-4">
              <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center">
                <p className="text-xs font-bold text-blue-500 uppercase">Competency Score</p>
                <p className="text-3xl font-extrabold text-blue-700 mt-1">{compScore}<span className="text-base text-blue-400">/100</span></p>
                <p className="text-xs text-blue-400 mt-1">avg {avg(rate)}/5 × 100</p>
              </div>
              <div className={`border rounded-xl p-4 text-center ${deduction>0?'bg-red-50 border-red-200':'bg-green-50 border-green-200'}`}>
                <p className={`text-xs font-bold uppercase ${deduction>0?'text-red-500':'text-green-500'}`}>Attendance Deduction</p>
                <p className={`text-3xl font-extrabold mt-1 ${deduction>0?'text-red-600':'text-green-600'}`}>{deduction>0?`−${deduction}`:'0'}</p>
                <p className="text-xs text-gray-400 mt-1">{lateDays} late day{lateDays!==1?'s':''} this month</p>
              </div>
              <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4 text-center">
                <p className="text-xs font-bold text-gray-500 uppercase">Final Score</p>
                <p className="text-3xl font-extrabold mt-1" style={{color:gradeBand.color}}>{finalScr}<span className="text-base text-gray-400">/100</span></p>
                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${gradeBand.cls}`}>{gradeBand.name}</span>
              </div>
            </div>
            {deduction>0&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-start gap-2">
              <i className="fas fa-clock text-amber-500 mt-0.5 flex-shrink-0"/>
              <p className="text-xs text-amber-700"><strong>{lateDays} late arrival{lateDays!==1?'s':''}</strong> this month — <strong>−{deduction} points</strong> deducted per RAHAMA attendance policy.</p>
            </div>}
            {deduction===0&&<div className="bg-green-50 border border-green-200 rounded-xl p-3 flex items-center gap-2"><i className="fas fa-check-circle text-green-500"/><p className="text-xs text-green-700 font-medium">No late arrivals this month — full score preserved.</p></div>}
          </div>
        )}
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="text-lg font-bold mb-6">Competency Review</h2>
            <div className="space-y-6">{comps.map(c=>{const isR=rate[c.name]!==undefined;const hasC=comm[c.name]&&comm[c.name].trim().length>=10;const needC=isR&&!hasC&&!done;
                return <div key={c.name} className={`border-2 rounded-xl p-5 transition ${isR&&hasC?'border-green-200':needC?'border-amber-300':'border-gray-100'}`}>
                    <div className="flex items-center gap-2 mb-4"><i className={`fas ${c.icon} text-green-600`}/><h3 className="font-bold text-gray-800">{c.name}</h3>{isR&&hasC&&!done&&<span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold"><i className="fas fa-check"/></span>}</div>
                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4"><div className="flex justify-between items-center mb-1"><p className="text-xs font-bold text-blue-500 uppercase">Employee Self-Rating</p><p className="text-xl font-extrabold text-blue-700">{app.self_ratings?.[c.name]||'N/A'}/5</p></div>{app.self_comments?.[c.name]&&<p className="text-sm text-gray-600 mt-2 italic border-t border-blue-100 pt-2">"{app.self_comments[c.name]}"</p>}</div>
                    {!done?<><label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Your Assessment</label>
                        <div className="grid grid-cols-5 gap-2 mb-4">{rats.map(r=><button key={r.v} onClick={()=>setRate({...rate,[c.name]:r.v})} className={`py-3 rounded-xl border-2 font-medium r-btn ${rate[c.name]===r.v?'sel':'bg-white border-gray-200 hover:border-green-300'}`}><div className="font-extrabold text-lg">{r.v}</div><div className="text-xs opacity-80 hidden md:block">{r.l}</div></button>)}</div>
                        <textarea placeholder="Your feedback (required, min 10 chars)..." value={comm[c.name]||''} onChange={e=>setComm({...comm,[c.name]:e.target.value})} rows="3" className={`w-full px-4 py-3 border-2 rounded-xl text-sm ${needC?'border-amber-300 bg-amber-50':'border-gray-200'}`}/>
                        {needC&&<p className="text-amber-600 text-xs mt-1"><i className="fas fa-exclamation-circle mr-1"/>{Math.max(0,10-(comm[c.name]?.trim().length||0))} more chars needed</p>}
                    </>:<div className="bg-green-50 border border-green-200 rounded-xl p-4"><div className="flex justify-between items-center mb-1"><p className="text-xs font-bold text-green-500 uppercase">Supervisor Rating</p><p className="text-xl font-extrabold text-green-700">{rate[c.name]||'N/A'}/5</p></div>{comm[c.name]&&<p className="text-sm text-gray-600 mt-2 italic border-t border-green-100 pt-2">"{comm[c.name]}"</p>}</div>}
                </div>;})}
        </div></div>
        <div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-3"><i className="fas fa-comment text-blue-600 mr-2"/>Employee's Overall Reflection</h3><div className="bg-blue-50 border border-blue-200 rounded-xl p-5"><p className="text-gray-700 whitespace-pre-wrap text-sm">{app.self_overall_comments||'No comments provided'}</p></div></div>
        {app.employee_evidence&&app.employee_evidence.length>0&&<div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-3"><i className="fas fa-file-alt text-blue-600 mr-2"/>Employee's Supporting Documents</h3><div className="space-y-2">{app.employee_evidence.map((ev,i)=><div key={i} className="flex items-center gap-3 bg-blue-50 rounded-xl p-3"><i className={`fas ${ev.file?'fa-file-circle-check text-green-500':'fa-paperclip text-blue-500'}`}/><div className="flex-1 min-w-0"><p className="text-sm font-semibold text-gray-800 truncate">{ev.description}</p><div className="flex items-center gap-2 mt-0.5">{ev.file&&<span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium"><i className="fas fa-file mr-1"/>{ev.file.name} ({(ev.file.size/1024).toFixed(0)}KB)</span>}{ev.link&&<span className="text-xs text-blue-600 truncate">{ev.link}</span>}</div></div>{ev.file&&ev.file.data&&<a href={ev.file.data} download={ev.file.name} className="text-blue-600 text-xs font-semibold hover:underline flex-shrink-0"><i className="fas fa-download mr-1"/>Download</a>}{ev.link&&!ev.file&&<a href={ev.link} target="_blank" rel="noreferrer" className="text-blue-600 text-xs hover:underline flex-shrink-0">{ev.link}</a>}</div>)}</div></div>}
        {!done?<><div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-3"><i className="fas fa-award text-green-600 mr-2"/>Your Overall Assessment <span className="text-red-500">*</span></h3><textarea value={overall} onChange={e=>setOverall(e.target.value)} rows="8" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm" placeholder="Strengths, areas for improvement, development goals, action items..."/></div>
        <div className="glass rounded-xl p-6 flex gap-4"><button onClick={onDone} disabled={busy} className="flex-1 bg-gray-100 py-4 rounded-xl font-bold hover:bg-gray-200">Cancel</button><button onClick={submit} disabled={busy||progress<100||!allComm||!overall.trim()} className="flex-1 btn-green text-white py-4 rounded-xl font-bold disabled:opacity-50">{busy?'Submitting...':progress<100?`Rate All (${rated}/${comps.length})`:!allComm?'Add Feedback':!overall.trim()?'Add Assessment':'Complete Review'}</button></div>
        </>:overall&&<div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-3"><i className="fas fa-award text-green-600 mr-2"/>Supervisor's Overall Assessment</h3><div className="bg-green-50 border border-green-200 rounded-xl p-5"><p className="text-gray-700 whitespace-pre-wrap text-sm">{overall}</p></div></div>}
    </div></div>;
}

function LeaveRequest({user,notify,onBack}) {
    const [type,setType]=useState('');const [start,setStart]=useState('');const [end,setEnd]=useState('');const [reason,setReason]=useState('');const [busy,setBusy]=useState(false);
    const submit=async()=>{if(!type||!start||!end||!reason.trim()){notify('Complete all fields','error');return;}setBusy(true);
        try{const r=await fetch(`${SB}/rest/v1/leave_requests`,{method:'POST',headers:HJ,body:JSON.stringify({employee_id:user.id,leave_type:type,start_date:start,end_date:end,reason})});if(r.ok){notify('Leave request submitted!');onBack();}else notify('Failed to submit','error');}catch(e){notify('Error','error');}setBusy(false);};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-purple-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold text-gray-800">Request Leave / Permission</h1><p className="text-gray-500 mt-1">{user.name}</p></div>
        <div className="glass rounded-2xl p-6 space-y-4">
            <select value={type} onChange={e=>setType(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"><option value="">Select type</option><option>Annual Leave</option><option>Sick Leave</option><option>Official Duty</option><option>Late Arrival</option><option>Early Closing</option></select>
            <input type="date" value={start} onChange={e=>setStart(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <input type="date" value={end} onChange={e=>setEnd(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <textarea value={reason} onChange={e=>setReason(e.target.value)} rows="4" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl" placeholder="Explain your request..."/>
            <button onClick={submit} disabled={busy} className="w-full py-4 rounded-xl font-bold text-white disabled:opacity-50" style={{background:'linear-gradient(135deg,#8b5cf6,#6d28d9)'}}>{busy?'Submitting...':'Submit Request'}</button>
        </div>
    </div></div>;
}

function LeaveAdmin({notify,onBack}) {
    const [list,setList]=useState([]);const [names,setNames]=useState({});const [selected,setSelected]=useState(null);
    const load=()=>{fetch(`${SB}/rest/v1/leave_requests?order=created_at.desc`,{headers:H}).then(r=>r.json()).then(d=>{setList(d||[]);const ids=[...new Set(d.map(a=>a.employee_id))];if(ids.length>0)fetch(`${SB}/rest/v1/users?select=id,name&id=in.(${ids.join(',')})`,{headers:H}).then(r=>r.json()).then(us=>{const n={};us.forEach(u=>n[u.id]=u.name);setNames(n);});});};
    useEffect(()=>{load();},[]);
    if(selected) return <LeaveReview req={selected} name={names[selected.employee_id]} notify={notify} onDone={()=>{setSelected(null);load();}}/>;
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">Leave Requests</h1></div>
        {list.length===0?<div className="glass p-10 text-center text-gray-400">No leave requests</div>
        :<div className="space-y-3">{list.map(l=><div key={l.id} className="glass p-4 rounded-xl flex justify-between items-center cursor-pointer hover:shadow" onClick={()=>setSelected(l)}>
            <div><p className="font-bold">{names[l.employee_id]||'Employee'}</p><p className="text-sm text-gray-500">{new Date(l.start_date).toLocaleDateString()} → {new Date(l.end_date).toLocaleDateString()}</p></div>
            <span className={`px-3 py-1 rounded-full text-xs font-bold ${l.status==='approved'?'bg-green-100 text-green-700':l.status==='rejected'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700'}`}>{l.status||'pending'}</span>
        </div>)}</div>}
    </div></div>;
}

function LeaveReview({req,name,notify,onDone}) {
    const [decision,setDecision]=useState(req.status||'');const [comment,setComment]=useState(req.supervisor_comment||'');const [busy,setBusy]=useState(false);
    const save=async()=>{if(!decision){notify('Choose approve or reject','error');return;}setBusy(true);const r=await fetch(`${SB}/rest/v1/leave_requests?id=eq.${req.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({status:decision,supervisor_comment:comment})});if(r.ok){notify('Decision saved');onDone();}else notify('Failed','error');setBusy(false);};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onDone} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">{name}</h1><p className="text-gray-500">{new Date(req.start_date).toLocaleDateString()} → {new Date(req.end_date).toLocaleDateString()}</p>{req.reason&&<p className="mt-2 text-sm">{req.reason}</p>}</div>
        <div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-3">Decision</h3>
            <div className="flex gap-3 mb-4"><button onClick={()=>setDecision('approved')} className={`px-4 py-2 rounded-xl ${decision==='approved'?'bg-green-600 text-white':'bg-gray-100'}`}>Approve</button><button onClick={()=>setDecision('rejected')} className={`px-4 py-2 rounded-xl ${decision==='rejected'?'bg-red-600 text-white':'bg-gray-100'}`}>Reject</button></div>
            <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="Supervisor comment..." className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm"/>
        </div>
        <button onClick={save} disabled={busy} className="w-full btn-green text-white py-4 rounded-xl font-bold disabled:opacity-50">{busy?'Saving...':'Save Decision'}</button>
    </div></div>;
}

function Directory({user,notify,onBack}) {
    const [staff,setStaff]=useState([]);const [loading,setLoading]=useState(true);const [search,setSearch]=useState('');
    const load=async()=>{setLoading(true);try{const u=await fetch(`${SB}/rest/v1/users?select=id,name,email,role,is_mne`,{headers:H}).then(r=>r.json());const p=await fetch(`${SB}/rest/v1/staff_profiles`,{headers:H}).then(r=>r.json());setStaff(u.map(x=>({...x,...(p.find(pp=>pp.user_id===x.id)||{})})));}catch(e){}setLoading(false);};
    useEffect(()=>{load();},[]);
    const list=staff.filter(s=>[(s.name||''),(s.department||''),(s.position||'')].some(v=>v.toLowerCase().includes(search.toLowerCase())));
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">Staff Directory</h1><p className="text-gray-500">Contact information for RAHAMA staff</p></div>
        <div className="glass rounded-xl p-4 mb-6"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, department, position..." className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
        {loading?<div className="text-center py-10 text-gray-400"><i className="fas fa-spinner fa-spin"/></div>
        :<div className="space-y-3">{list.map(s=><div key={s.id} className="glass rounded-xl p-4"><h3 className="font-bold text-gray-800">{s.name}</h3><p className="text-sm text-gray-500">{s.position||'—'} · {s.department||'—'}</p>{s.phone&&<a href={`tel:${s.phone}`} className="text-indigo-600 text-sm font-semibold"><i className="fas fa-phone mr-1"/>Call</a>}<div><a href={`mailto:${s.email}`} className="text-blue-600 text-sm"><i className="fas fa-envelope mr-1"/>Email</a></div></div>)}{list.length===0&&<p className="text-center text-gray-400 py-6">No staff found</p>}</div>}
    </div></div>;
}

function HRAdmin({notify,onBack}) {
    const [staff,setStaff]=useState([]);const [profiles,setProfiles]=useState({});const [selected,setSelected]=useState(null);const [loading,setLoading]=useState(true);
    const load=async()=>{setLoading(true);try{const u=await fetch(`${SB}/rest/v1/users?select=id,name,email,role&role=eq.employee`,{headers:H}).then(r=>r.json());setStaff(u||[]);const ids=u.map(x=>x.id);if(ids.length>0){const pd=await fetch(`${SB}/rest/v1/staff_profiles?user_id=in.(${ids.join(',')})`,{headers:H}).then(r=>r.json());const map={};pd.forEach(p=>map[p.user_id]=p);setProfiles(map);}}catch(e){}setLoading(false);};
    useEffect(()=>{load();},[]);
    if(selected) return <HRProfileEdit staff={selected} profile={profiles[selected.id]} notify={notify} onDone={()=>{setSelected(null);load();}}/>;
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">HR Staff Profiles</h1></div>
        {loading?<div className="text-center py-10"><i className="fas fa-spinner fa-spin"/></div>
        :<div className="space-y-3">{staff.map(s=><div key={s.id} className="glass rounded-xl p-4 flex justify-between items-center cursor-pointer hover:shadow" onClick={()=>setSelected(s)}><div><p className="font-bold">{s.name}</p><p className="text-xs text-gray-500">{profiles[s.id]?.position||'No profile yet'}</p></div><i className="fas fa-pen text-blue-600"/></div>)}</div>}
    </div></div>;
}

function HRProfileEdit({staff,profile,notify,onDone}) {
    const [position,setPosition]=useState(profile?.position||'');const [department,setDepartment]=useState(profile?.department||'');const [phone,setPhone]=useState(profile?.phone||'');const [supervisor,setSupervisor]=useState(profile?.supervisor_name||'');const [busy,setBusy]=useState(false);
    const save=async()=>{setBusy(true);try{const payload={user_id:staff.id,position,department,phone,supervisor_name:supervisor};let r;if(profile){r=await fetch(`${SB}/rest/v1/staff_profiles?user_id=eq.${staff.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(payload)});}else{r=await fetch(`${SB}/rest/v1/staff_profiles`,{method:'POST',headers:HJ,body:JSON.stringify(payload)});}if(r.ok){notify('Profile saved');onDone();}else notify('Failed','error');}catch(e){notify('Error','error');}setBusy(false);};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onDone} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">{staff.name}</h1></div>
        <div className="glass rounded-2xl p-6 space-y-4">
            <input value={position} onChange={e=>setPosition(e.target.value)} placeholder="Position" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <input value={department} onChange={e=>setDepartment(e.target.value)} placeholder="Department" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Phone number" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <input value={supervisor} onChange={e=>setSupervisor(e.target.value)} placeholder="Supervisor" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
        </div>
        <button onClick={save} disabled={busy} className="w-full btn-green text-white py-4 rounded-xl font-bold mt-4 disabled:opacity-50">{busy?'Saving...':'Save Profile'}</button>
    </div></div>;
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
