    },[]);
    const rated=Object.keys(rate).length;const progress=(rated/comps.length)*100;
    const allComm=Object.keys(rate).every(k=>comm[k]&&comm[k].trim().length>=10);const missing=Object.keys(rate).filter(k=>!comm[k]||comm[k].trim().length<10);
    const fileToBase64=(file)=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
    const addEv=async()=>{if(!evDesc.trim()){notify('Describe the evidence','error');return;}setUploading(true);
        try{let fileData=null;if(evFile){if(evFile.size>5*1024*1024){notify('File too large (max 5MB)','error');setUploading(false);return;}fileData={name:evFile.name,type:evFile.type,size:evFile.size,data:await fileToBase64(evFile)};}
        setEvidence([...evidence,{description:evDesc,link:evLink,file:fileData,added_at:new Date().toISOString()}]);setEvDesc('');setEvLink('');setEvFile(null);if(fileRef.current)fileRef.current.value='';notify('Evidence added','info');}catch(e){notify('Error processing file','error');}setUploading(false);};
    const submit=async()=>{
        if(deadlineInfo?.locked){notify('The self-assessment deadline has passed. Contact your supervisor.','error');return;}
        if(rated<comps.length){notify('Rate all competencies','error');return;}if(!allComm){notify(`Add justification for: ${missing[0]}`,'error');return;}if(!overall.trim()){notify('Add overall reflection','error');return;}
        setBusy(true);try{const payload={employee_id:user.id,status:'pending',self_ratings:rate,self_comments:comm,self_overall_comments:overall};if(evidence.length>0)payload.employee_evidence=evidence;
        const r=await fetch(`${SB}/rest/v1/appraisals`,{method:'POST',headers:HJ,body:JSON.stringify(payload)});if(r.ok){notify('Assessment submitted!');onDone();}else notify('Failed','error');}catch(e){notify('Error','error');}setBusy(false);};
    if(checkingDeadline) return <div className="min-h-screen flex items-center justify-center"><i className="fas fa-spinner fa-spin text-3xl text-gray-300"/></div>;
    if(deadlineInfo?.locked) return <div className="min-h-screen p-4 md:p-8"><div className="max-w-2xl mx-auto">
        <div className="glass rounded-3xl p-10 text-center animate-in">

            <p className="text-gray-500 mb-1">The deadline for this review cycle was <strong>{new Date(deadlineInfo.deadline+'T12:00:00').toLocaleDateString([],{day:'numeric',month:'long',year:'numeric'})}</strong>.</p>
            <p className="text-gray-500 mb-6">If you still need to submit, contact your supervisor to have the window reopened.</p>
            <button onClick={onDone} className="btn-green text-white px-6 py-3 rounded-xl font-bold"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
        </div>
    </div></div>;
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onDone} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>

        <div className="glass rounded-xl p-5 mb-6"><h3 className="font-bold text-sm mb-3 text-gray-600"><i className="fas fa-info-circle text-green-600 mr-2"/>Rating Scale</h3>
            <div className="grid grid-cols-5 gap-2">{rats.map(r=><div key={r.v} className="p-2 rounded-lg border text-center" style={{borderColor:r.c+'40',background:r.c+'10'}}><div className="font-extrabold text-sm" style={{color:r.c}}>{r.v}</div><div className="text-xs text-gray-600">{r.l}</div></div>)}</div></div>
        <div className="bg-amber-50 border-2 border-amber-200 rounded-xl p-4 mb-6"><p className="text-sm text-amber-800 font-semibold"><i className="fas fa-exclamation-triangle mr-2"/>Justification Required</p><p className="text-xs text-amber-600 mt-1">Provide a justification comment (min 10 characters) for each rating.</p></div>

                    <div className="grid grid-cols-5 gap-2 mb-4">{rats.map(r=><button key={r.v} onClick={()=>setRate({...rate,[c.name]:r.v})} className={`py-3 rounded-xl border-2 font-medium r-btn ${rate[c.name]===r.v?'sel':'bg-white border-gray-200 hover:border-green-300'}`}><div className="font-extrabold text-lg">{r.v}</div><div className="text-xs opacity-80 hidden md:block">{r.l}</div></button>)}</div>
                    <textarea placeholder="Justification (required) — explain your rating with examples..." value={comm[c.name]||''} onChange={e=>setComm({...comm,[c.name]:e.target.value})} rows="3" className={`w-full px-4 py-3 border-2 rounded-xl text-sm ${needC?'border-amber-300 bg-amber-50':'border-gray-200'}`}/>
                    {needC&&<p className="text-amber-600 text-xs mt-1 font-medium"><i className="fas fa-exclamation-circle mr-1"/>Min 10 chars — {Math.max(0,10-(comm[c.name]?.trim().length||0))} more needed</p>}

        </div></div>
        <div className="glass rounded-2xl p-6 mb-6">

                <i className={`fas ${ev.file?'fa-file-circle-check text-green-500':'fa-link text-blue-500'}`}/>
                <div className="flex-1 min-w-0"><p className="text-sm font-semibold text-gray-800 truncate">{ev.description}</p>
                    <div className="flex items-center gap-2 mt-0.5">{ev.file&&<span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium"><i className="fas fa-file mr-1"/>{ev.file.name} ({(ev.file.size/1024).toFixed(0)}KB)</span>}{ev.link&&<span className="text-xs text-blue-600 truncate">{ev.link}</span>}</div></div>

            <div className="space-y-3">

function EmpReview({appraisal,user,notify,onDone}) {
    const [response,setResponse]=useState(appraisal.employee_review_status==='pending'?'':appraisal.employee_review_status||'');const [comments,setComments]=useState(appraisal.employee_review_comments||'');const [evidence,setEvidence]=useState(appraisal.employee_evidence||[]);const [evDesc,setEvDesc]=useState('');const [evLink,setEvLink]=useState('');const [evFile,setEvFile]=useState(null);const [uploading,setUploading]=useState(false);const [busy,setBusy]=useState(false);
    // Revising self-ratings is only offered while actively composing a dispute —

    const [showSelfEdit,setShowSelfEdit]=useState(false);
    const [selfRate,setSelfRate]=useState(appraisal.self_ratings||{});
    const [selfComm,setSelfComm]=useState(appraisal.self_comments||{});

    const selfAvg=avg(appraisal.self_ratings);const supAvg=avg(appraisal.supervisor_ratings);const diff=(selfAvg-supAvg).toFixed(1);
    const fileToBase64=(file)=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
    const addEv=async()=>{if(!evDesc.trim()){notify('Describe the evidence','error');return;}setUploading(true);try{let fileData=null;if(evFile){if(evFile.size>5*1024*1024){notify('File too large','error');setUploading(false);return;}fileData={name:evFile.name,type:evFile.type,size:evFile.size,data:await fileToBase64(evFile)};}setEvidence([...evidence,{description:evDesc,link:evLink,file:fileData,added_at:new Date().toISOString()}]);setEvDesc('');setEvLink('');setEvFile(null);if(fileRef.current)fileRef.current.value='';notify('Evidence added','info');}catch(e){notify('Error','error');}setUploading(false);};
    const submit=async()=>{if(!response){notify('Select Accept or Dispute','error');return;}if(response==='rejected'&&comments.trim().length<20){notify('Provide detailed reasons (min 20 chars)','error');return;}setBusy(true);try{
        const body={employee_review_status:response,employee_review_comments:comments,employee_evidence:evidence,review_submitted_at:new Date().toISOString()};
        // Only send revised self-ratings if the employee actually opened the panel — a
        // plain Accept never touches self_ratings/self_comments at all.
        if(response==='rejected'&&showSelfEdit){body.self_ratings=selfRate;body.self_comments=selfComm;}
        const r=await fetch(`${SB}/rest/v1/appraisals?id=eq.${appraisal.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(body)});if(r.ok){notify(response==='accepted'?'Review accepted!':'Dispute submitted');onDone();}else notify('Failed','error');}catch(e){notify('Error','error');}setBusy(false);};

            {(appraisal.final_score!==undefined)&&(
              <div className="mb-5 p-4 rounded-xl border-2 flex flex-wrap gap-4 items-center" style={{borderColor:gradeFromScore(appraisal.final_score).color+'55',background:gradeFromScore(appraisal.final_score).color+'11'}}>

                    <span className="text-4xl font-extrabold" style={{color:gradeFromScore(appraisal.final_score).color}}>{appraisal.final_score}</span>
                    <span className="text-gray-400 text-sm">/100</span>
                  </div>
                  {appraisal.attendance_deduction>0&&<p className="text-xs text-red-500 mt-1"><i className="fas fa-clock mr-1"/>−{appraisal.attendance_deduction} pts deducted ({appraisal.attendance_late_days} late day{appraisal.attendance_late_days!==1?'s':''})</p>}

                </div>
                <span className={`text-sm font-bold px-3 py-1.5 rounded-full ${gradeFromScore(appraisal.final_score).cls}`}>{appraisal.grade_band||gradeFromScore(appraisal.final_score).name}</span>
              </div>

                    {appraisal.self_comments?.[c.name]&&<div className="bg-blue-50 rounded-lg p-3 mb-2"><p className="text-xs font-bold text-blue-500 mb-1">Your Comment:</p><p className="text-sm text-gray-700">{appraisal.self_comments[c.name]}</p></div>}

        {!readOnly?<>
            <div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-3"><i className="fas fa-file-alt text-blue-600 mr-2"/>Supporting Evidence (Optional)</h3><p className="text-sm text-gray-500 mb-4">Upload files or links to support your response.</p>
                {evidence.length>0&&<div className="space-y-2 mb-4">{evidence.map((ev,i)=><div key={i} className="flex items-center gap-3 bg-blue-50 rounded-xl p-3"><i className={`fas ${ev.file?'fa-file-circle-check text-green-500':'fa-paperclip text-blue-500'}`}/><div className="flex-1 min-w-0"><p className="text-sm font-semibold text-gray-800 truncate">{ev.description}</p><div className="flex items-center gap-2 mt-0.5">{ev.file&&<span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium"><i className="fas fa-file mr-1"/>{ev.file.name} ({(ev.file.size/1024).toFixed(0)}KB)</span>}{ev.link&&<span className="text-xs text-blue-600 truncate">{ev.link}</span>}</div></div>{ev.file&&ev.file.data&&<a href={ev.file.data} download={ev.file.name} className="text-blue-500 hover:text-blue-700 flex-shrink-0"><i className="fas fa-download"/></a>}<button onClick={()=>setEvidence(evidence.filter((_,j)=>j!==i))} className="text-red-400 hover:text-red-600 flex-shrink-0"><i className="fas fa-trash-alt"/></button></div>)}</div>}
                <div className="space-y-3"><input type="text" value={evDesc} onChange={e=>setEvDesc(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm" placeholder="Description"/>
                    <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Upload File (max 5MB)</label>
                        <div className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer hover:border-green-400 hover:bg-green-50 transition ${evFile?'border-green-400 bg-green-50':'border-gray-300'}`} onClick={()=>fileRef.current&&fileRef.current.click()}>
                            {evFile?<div className="flex items-center justify-center gap-2"><i className="fas fa-file-circle-check text-green-600"/><span className="text-sm font-semibold text-green-700">{evFile.name}</span><button onClick={(e)=>{e.stopPropagation();setEvFile(null);if(fileRef.current)fileRef.current.value='';}} className="ml-2 text-red-400"><i className="fas fa-times-circle"/></button></div>:<div><i className="fas fa-cloud-arrow-up text-gray-400 text-2xl mb-2"/><p className="text-sm text-gray-500">Click to select a file</p><p className="text-xs text-gray-400 mt-1">PDF, PNG, JPG, DOC, DOCX</p></div>}
                        </div>
                        <input ref={fileRef} type="file" className="hidden" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx" onChange={e=>{const f=e.target.files[0];if(f){if(f.size>5*1024*1024){notify('File too large','error');e.target.value='';return;}setEvFile(f);}}}/>
                    </div>
                    <input type="text" value={evLink} onChange={e=>setEvLink(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm" placeholder="Or paste a link/URL (optional)"/>
                    <button onClick={addEv} disabled={!evDesc.trim()||uploading} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold text-sm disabled:opacity-50 hover:bg-blue-700">{uploading?<><i className="fas fa-spinner fa-spin mr-2"/>Uploading...</>:<><i className="fas fa-plus mr-2"/>Add Evidence</>}</button>
                </div>

            <div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-4"><i className="fas fa-gavel text-green-600 mr-2"/>Your Decision</h3>
                <div className="grid md:grid-cols-2 gap-4 mb-4">
                    <button onClick={()=>setResponse('accepted')} className={`p-5 rounded-xl border-2 text-left transition ${response==='accepted'?'border-green-500 bg-green-50':'border-gray-200 hover:border-green-300'}`}>
                        <div className="flex items-center gap-3 mb-2"><div className={`w-10 h-10 rounded-full flex items-center justify-center ${response==='accepted'?'bg-green-500 text-white':'bg-gray-100 text-gray-400'}`}><i className="fas fa-check"/></div><h4 className="font-bold text-gray-800">Accept Review</h4></div>
                        <p className="text-sm text-gray-500">I agree with my supervisor's assessment.</p></button>
                    <button onClick={()=>setResponse('rejected')} className={`p-5 rounded-xl border-2 text-left transition ${response==='rejected'?'border-red-500 bg-red-50':'border-gray-200 hover:border-red-300'}`}>
                        <div className="flex items-center gap-3 mb-2"><div className={`w-10 h-10 rounded-full flex items-center justify-center ${response==='rejected'?'bg-red-500 text-white':'bg-gray-100 text-gray-400'}`}><i className="fas fa-times"/></div><h4 className="font-bold text-gray-800">Dispute Review</h4></div>
                        <p className="text-sm text-gray-500">I disagree and want to provide reasoning.</p></button>
                </div>
                <div><label className="block text-sm font-bold text-gray-700 mb-2">Your Comments {response==='rejected'&&<span className="text-red-500">* (required)</span>}</label>
                    <textarea value={comments} onChange={e=>setComments(e.target.value)} rows="5" className={`w-full px-4 py-3 border-2 rounded-xl text-sm ${response==='rejected'&&comments.trim().length<20?'border-red-300':'border-gray-200'}`} placeholder={response==='rejected'?'Explain which ratings you disagree with and why (min 20 chars)...':'Additional comments (optional)...'}/>
                    {response==='rejected'&&comments.trim().length<20&&<p className="text-red-500 text-xs mt-1"><i className="fas fa-exclamation-circle mr-1"/>Min 20 characters required</p>}</div>
            </div>
            {response==='rejected'&&<div className="glass rounded-2xl p-6 mb-6">
                <button onClick={()=>setShowSelfEdit(!showSelfEdit)} className="flex items-center justify-between w-full text-left">
                    <span className="font-bold text-gray-800"><i className="fas fa-pen-to-square text-amber-600 mr-2"/>Revise My Self-Ratings (optional)</span>
                    <i className={`fas fa-chevron-${showSelfEdit?'up':'down'} text-gray-400`}/>
                </button>
                <p className="text-sm text-gray-500 mt-1">If part of your dispute is that your own self-rating no longer reflects what you meant, you can adjust it here — this is separate from your comment above and only applies to the ratings you originally submitted, not your supervisor's.</p>
                {showSelfEdit&&<div className="space-y-4 mt-5">{comps.map(c=><div key={c.name} className="border-2 border-gray-100 rounded-xl p-4">
                    <p className="font-semibold text-gray-800 text-sm mb-3">{c.name}</p>
                    <div className="grid grid-cols-5 gap-2 mb-3">{rats.map(r=><button key={r.v} onClick={()=>setSelfRate({...selfRate,[c.name]:r.v})}
                        className={`py-2.5 rounded-lg border-2 font-medium r-btn ${selfRate[c.name]===r.v?'sel':'bg-white border-gray-200 hover:border-green-300'}`}>
                        <div className="font-extrabold">{r.v}</div></button>)}</div>
                    <textarea value={selfComm[c.name]||''} onChange={e=>setSelfComm({...selfComm,[c.name]:e.target.value})} rows="2"
                        className="w-full px-3 py-2 border-2 border-gray-200 rounded-lg text-sm" placeholder="Justification for this rating..."/>
                </div>)}</div>}
            </div>}
            <div className="glass rounded-xl p-6 flex gap-4">
                <button onClick={onDone} disabled={busy} className="flex-1 bg-gray-100 py-4 rounded-xl font-bold hover:bg-gray-200">Cancel</button>
                <button onClick={submit} disabled={busy||!response||(response==='rejected'&&comments.trim().length<20)} className={`flex-1 text-white py-4 rounded-xl font-bold disabled:opacity-50 ${response==='rejected'?'bg-red-600 hover:bg-red-700':'btn-green'}`}>
                    {busy?'Submitting...':!response?'Select Accept or Dispute':response==='accepted'?'✓ Accept Review':'⚠ Submit Dispute'}</button>
            </div>
        </>:<div className="glass rounded-2xl p-6 mb-6">
            <h3 className="font-bold mb-3"><i className={`fas ${appraisal.employee_review_status==='accepted'?'fa-check-circle text-green-600':'fa-exclamation-circle text-red-600'} mr-2`}/>Your Response: {appraisal.employee_review_status==='accepted'?'Accepted':'Disputed'}</h3>
            {appraisal.employee_review_comments&&<div className="bg-gray-50 rounded-xl p-4 mb-3"><p className="text-sm text-gray-700 whitespace-pre-wrap">{appraisal.employee_review_comments}</p></div>}
            {appraisal.employee_evidence&&appraisal.employee_evidence.length>0&&<div><p className="text-sm font-bold text-gray-600 mb-2">Attached Evidence:</p>{appraisal.employee_evidence.map((ev,i)=><div key={i} className="flex items-center gap-2 bg-blue-50 rounded-lg p-3 mb-2"><i className={`fas ${ev.file?'fa-file-circle-check text-green-500':'fa-paperclip text-blue-500'}`}/><div className="flex-1 min-w-0"><span className="text-sm font-semibold text-gray-800">{ev.description}</span>{ev.file&&<span className="text-xs text-gray-500 ml-2">({ev.file.name})</span>}</div>{ev.file&&ev.file.data&&<a href={ev.file.data} download={ev.file.name} className="text-blue-600 text-xs font-semibold hover:underline flex-shrink-0"><i className="fas fa-download mr-1"/>Download</a>}{ev.link&&<a href={ev.link} target="_blank" rel="noreferrer" className="text-blue-600 text-xs hover:underline flex-shrink-0">{ev.link}</a>}</div>)}</div>}
            <button onClick={onDone} className="mt-4 btn-green text-white px-6 py-3 rounded-xl font-semibold"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
        </div>}
    </div></div>;
}

/* ==================== ATTENDANCE ==================== */
const OFFICES=[{name:'Kano Office',lat:11.984881,lng:8.530260,radius:500},{name:'Katsina Office',lat:12.943856,lng:7.608453,radius:500}];
function getDistanceM(lat1,lon1,lat2,lon2){const R=6371e3,r=Math.PI/180,dLat=(lat2-lat1)*r,dLon=(lon2-lon1)*r,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
async function checkOfficeNetwork(){try{const r=await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(5000)});if(!r.ok)return{ok:false,reason:'Could not verify network'};const d=await r.json();const city=(d.city||'').toLowerCase(),region=(d.region||'').toLowerCase();if(city.includes('kano')||city.includes('katsina')||region.includes('kano')||region.includes('katsina'))return{ok:true,method:'network',ip:d.ip,city:d.city||d.region};return{ok:false,reason:`Network: ${d.city||d.region||'Unknown'} — not office area`};}catch(e){return{ok:false,reason:'Network check failed'};}}
function checkGPS(){return new Promise(resolve=>{if(!navigator.geolocation){resolve({ok:false,reason:'GPS not available'});return;}navigator.geolocation.getCurrentPosition(pos=>{for(const o of OFFICES){const dist=getDistanceM(pos.coords.latitude,pos.coords.longitude,o.lat,o.lng);if(dist<=o.radius){resolve({ok:true,method:'gps',distance:Math.round(dist),office:o.name});return;}}const nearest=OFFICES.map(o=>({...o,dist:getDistanceM(pos.coords.latitude,pos.coords.longitude,o.lat,o.lng)})).sort((a,b)=>a.dist-b.dist)[0];resolve({ok:false,reason:`Nearest: ${nearest.name} (${Math.round(nearest.dist)}m, max ${nearest.radius}m)`});},err=>{const msgs={1:'Location permission denied',2:'Location unavailable',3:'Location timed out'};resolve({ok:false,reason:msgs[err.code]||'GPS error'});},{enableHighAccuracy:true,timeout:10000,maximumAge:0});})}

function Attendance({user,notify,onBack}) {
    const [today,setToday]=useState(null);const [history,setHistory]=useState([]);const [loading,setLoading]=useState(true);const [note,setNote]=useState('');const [busy,setBusy]=useState(false);const [month,setMonth]=useState(new Date().toISOString().slice(0,7));const [locStatus,setLocStatus]=useState(null);
    const todayStr=new Date().toISOString().slice(0,10);
    const load=async()=>{setLoading(true);try{const tr=await fetch(`${SB}/rest/v1/attendance?employee_id=eq.${user.id}&date=eq.${todayStr}`,{headers:H});if(!tr.ok){setLoading(false);return;}const td=await tr.json();setToday(Array.isArray(td)&&td.length>0?td[0]:null);
        const hr=await fetch(`${SB}/rest/v1/attendance?employee_id=eq.${user.id}&order=date.desc`,{headers:H});const hd=await hr.json();setHistory(Array.isArray(hd)?hd.filter(r=>r.date&&r.date.startsWith(month)):[]);}catch(e){}setLoading(false);};
    useEffect(()=>{load();},[month]);
    const verifyLocation=async()=>{setLocStatus({checking:true});const gps=await checkGPS();if(gps.ok){setLocStatus({passed:true,method:'GPS',detail:`${gps.distance}m from ${gps.office}`});return true;}const net=await checkOfficeNetwork();if(net.ok){setLocStatus({passed:true,method:'Network',detail:`IP in ${net.city}`});return true;}setLocStatus({failed:true,gpsReason:gps.reason,netReason:net.reason});return false;};
    const clockIn=async()=>{setBusy(true);const allowed=await verifyLocation();if(!allowed){notify('Cannot clock in — you must be at the office','error');setBusy(false);return;}
        try{const now=new Date().toISOString();const hour=new Date().getHours();const status=hour>=9?'late':'present';const locInfo=locStatus.method?` [${locStatus.method}]`:'';
        const r=await fetch(`${SB}/rest/v1/attendance`,{method:'POST',headers:HJ,body:JSON.stringify({employee_id:user.id,date:todayStr,clock_in:now,clock_in_note:(note||'')+locInfo||null,status})});
        if(r.ok){notify(status==='late'?'Clocked in (Late)':'Clocked in!');setNote('');load();}else{const t=await r.text();if(t.includes('duplicate')||t.includes('unique')){notify('Already clocked in today','error');}else notify('Failed to clock in','error');}}catch(e){notify('Error','error');}setBusy(false);};
    const clockOut=async()=>{if(!today){notify("Haven't clocked in today",'error');return;}setBusy(true);try{const r=await fetch(`${SB}/rest/v1/attendance?id=eq.${today.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({clock_out:new Date().toISOString(),clock_out_note:note||null})});if(r.ok){notify('Clocked out!');setNote('');load();}else notify('Failed','error');}catch(e){notify('Error','error');}setBusy(false);};
    const fmt=ts=>{if(!ts)return'--';const d=new Date(ts);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true});};
    const dur=(a,b)=>{if(!a||!b)return'--';const ms=new Date(b)-new Date(a);return `${Math.floor(ms/3600000)}h ${Math.floor((ms%3600000)/60000)}m`;};
    const nowH=new Date().getHours(),nowM=new Date().getMinutes(),timeStr=`${nowH%12||12}:${String(nowM).padStart(2,'0')} ${nowH>=12?'PM':'AM'}`;
    const totalDays=history.length,lateDays=history.filter(h=>h.status==='late').length;const avgHours=history.filter(h=>h.clock_in&&h.clock_out).map(h=>(new Date(h.clock_out)-new Date(h.clock_in))/3600000);const avgH=avgHours.length?(avgHours.reduce((a,b)=>a+b,0)/avgHours.length).toFixed(1):'0';
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
            <div className="flex justify-between items-end"><div><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Attendance</h1><p className="text-gray-500 mt-1">{user.name} · {new Date().toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p></div><div className="text-right"><p className="text-xs font-bold text-gray-400 uppercase">Current Time</p><p className="text-2xl font-extrabold text-blue-600">{timeStr}</p></div></div></div>
        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>:<>
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="text-lg font-bold mb-4"><i className="fas fa-fingerprint text-blue-600 mr-2"/>Today's Attendance</h2>
            {today?<div>
                <div className="grid md:grid-cols-3 gap-4 mb-4">
                    <div className="bg-green-50 border border-green-200 rounded-xl p-4 text-center"><p className="text-xs font-bold text-green-500 uppercase">Clock In</p><p className="text-2xl font-extrabold text-green-700 mt-1">{fmt(today.clock_in)}</p>{today.clock_in_note&&<p className="text-xs text-gray-500 mt-1 italic">{today.clock_in_note}</p>}</div>
                    <div className={`border rounded-xl p-4 text-center ${today.clock_out?'bg-blue-50 border-blue-200':'bg-amber-50 border-amber-200'}`}><p className={`text-xs font-bold uppercase ${today.clock_out?'text-blue-500':'text-amber-500'}`}>Clock Out</p><p className={`text-2xl font-extrabold mt-1 ${today.clock_out?'text-blue-700':'text-amber-600'}`}>{fmt(today.clock_out)}</p></div>
                    <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 text-center"><p className="text-xs font-bold text-gray-400 uppercase">Duration</p><p className="text-2xl font-extrabold text-gray-700 mt-1">{dur(today.clock_in,today.clock_out)}</p></div>
                </div>
                <div className="flex items-center gap-2 mb-4"><span className={`px-3 py-1 rounded-full text-xs font-bold ${today.status==='late'?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'}`}>{today.status==='late'?'⏰ Late':'✓ On Time'}</span>{today.clock_out&&<span className="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700">✓ Day Complete</span>}</div>
                {!today.clock_out&&<><input type="text" value={note} onChange={e=>setNote(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm mb-3" placeholder="Clock out note (optional)..."/>
                    <button onClick={clockOut} disabled={busy} className="w-full py-4 rounded-xl font-bold text-white text-lg disabled:opacity-50" style={{background:'linear-gradient(135deg,#dc2626,#b91c1c)'}}>{busy?<><i className="fas fa-spinner fa-spin mr-2"/>Processing...</>:<><i className="fas fa-sign-out-alt mr-2"/>Clock Out</>}</button></>}
            </div>:<div>
                <div className="text-center py-6 mb-4"><div className="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center" style={{background:'linear-gradient(135deg,#dcfce7,#bbf7d0)'}}><i className="fas fa-clock text-green-600 text-3xl"/></div><p className="text-gray-600 font-semibold">You haven't clocked in today</p><p className="text-sm text-gray-400 mt-1">Standard hours: 8:00 AM - 5:00 PM</p></div>
                <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4"><div className="flex items-start gap-2"><i className="fas fa-map-marker-alt text-blue-600 mt-0.5"/><div><p className="text-sm font-semibold text-blue-800">Location Verification Required</p><p className="text-xs text-blue-600 mt-0.5">You must be at the office to clock in. GPS or network will be checked automatically.</p></div></div></div>
                {locStatus&&<div className={`rounded-xl p-4 mb-4 ${locStatus.checking?'bg-gray-50 border border-gray-200':locStatus.passed?'bg-green-50 border border-green-200':'bg-red-50 border border-red-200'}`}>

/* ==================== FIELD TRIPS ==================== */
function fmtDur(a,b){if(!a)return'--';const ms=(b?new Date(b):new Date())-new Date(a);const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return `${h}h ${m}m`;}

/* ── Field trip security helpers ── */
const TRIP_STALE_MIN=20; // minutes without a location update before a trip is flagged
const tripEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const waNumber=p=>{let d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('0'))d='234'+d.slice(1);else if(d.length===10)d='234'+d;return d;};
const TRIP_TEMPLATES=['Please check in now and confirm you are safe.','Please share your current location and expected return time.','Avoid your planned route. Contact Security before moving on.','Pause movement and stay where you are until Security contacts you.','Return to base as soon as it is safe to do so.'];
const tripTime=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

function FieldTrip({user,notify,onBack}) {
    const [active,setActive]=useState(null);
    const [history,setHistory]=useState([]);
    const [pings,setPings]=useState([]);
    const [loading,setLoading]=useState(true);
    const [purpose,setPurpose]=useState('');
    const [destination,setDestination]=useState('');
    const [busy,setBusy]=useState(false);
    const [gpsStatus,setGpsStatus]=useState(null);
    const watchIdRef=useRef(null);
    const lastPingRef=useRef({t:0,lat:null,lng:null});
    const mapRef=useRef(null);
    const mapObj=useRef(null);
    const markerRef=useRef(null);
    const polylineRef=useRef(null);

    const load=async()=>{setLoading(true);try{
        const ar=await fetch(`${SB}/rest/v1/field_trips?employee_id=eq.${user.id}&status=eq.active&order=started_at.desc&limit=1`,{headers:H});
        const ad=await ar.json();
        const cur=Array.isArray(ad)&&ad.length>0?ad[0]:null;
        setActive(cur);
        if(cur){
            const pr=await fetch(`${SB}/rest/v1/trip_pings?trip_id=eq.${cur.id}&order=recorded_at.asc`,{headers:H});
            const pd=await pr.json();setPings(Array.isArray(pd)?pd:[]);
        } else setPings([]);
        const hr=await fetch(`${SB}/rest/v1/field_trips?employee_id=eq.${user.id}&status=eq.completed&order=started_at.desc&limit=20`,{headers:H});
        const hd=await hr.json();setHistory(Array.isArray(hd)?hd:[]);
    }catch(e){}setLoading(false);};
    useEffect(()=>{load();},[]);

    /* Messages from Security while a trip is active — checked every 30s */
    const [msgs,setMsgs]=useState([]);const [replies,setReplies]=useState({});const seenRef=useRef(new Set());
    const loadMsgs=async(tripId)=>{try{
        const r=await fetch(`${SB}/rest/v1/trip_messages?trip_id=eq.${encodeURIComponent(String(tripId))}&order=sent_at.desc`,{headers:H});
        const d=r.ok?await r.json():[];const arr=Array.isArray(d)?d:[];
        const fresh=arr.filter(m=>!m.read_at&&!seenRef.current.has(m.id));
        if(fresh.length){fresh.forEach(m=>seenRef.current.add(m.id));try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(_){}
            fetch(`${SB}/rest/v1/trip_messages?id=in.(${fresh.map(m=>m.id).join(',')})`,{method:'PATCH',headers:HJ,body:JSON.stringify({read_at:new Date().toISOString()})}).catch(()=>{});}
        setMsgs(arr);}catch(e){}};
    useEffect(()=>{if(!active){setMsgs([]);return;}loadMsgs(active.id);const iv=setInterval(()=>loadMsgs(active.id),30000);return()=>clearInterval(iv);},[active&&active.id]);
    const ackMsg=async m=>{const reply=(replies[m.id]||'').trim().slice(0,500);
        const r=await fetch(`${SB}/rest/v1/trip_messages?id=eq.${m.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({acknowledged_at:new Date().toISOString(),reply:reply||null})});
        if(r.ok){notify('Security can now see you received this');loadMsgs(active.id);}else notify('Could not send — check your connection','error');};

    const recordPing=(tripId,lat,lng,accuracy)=>{
        const now=Date.now();const last=lastPingRef.current;
        const moved=last.lat==null?Infinity:getDistanceM(lat,lng,last.lat,last.lng);
        // Throttle: at most one ping every 45s, unless the person has moved >100m since the last one.
        if(now-last.t<45000 && moved<100) return;
        lastPingRef.current={t:now,lat,lng};
        fetch(`${SB}/rest/v1/trip_pings`,{method:'POST',headers:HJ,body:JSON.stringify({trip_id:tripId,lat,lng,accuracy:accuracy||null})}).catch(()=>{});
        setPings(p=>[...p,{lat,lng,recorded_at:new Date().toISOString()}]);
    };

    const beginWatch=(tripId)=>{
        if(!navigator.geolocation){setGpsStatus('GPS not available on this device');return;}
        watchIdRef.current=navigator.geolocation.watchPosition(
            pos=>{setGpsStatus(null);recordPing(tripId,pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);},
            err=>{const msgs={1:'Location permission denied — this trip is not being tracked',2:'Location unavailable',3:'Location signal lost, retrying…'};setGpsStatus(msgs[err.code]||'GPS error');},
            {enableHighAccuracy:true,maximumAge:20000,timeout:30000}
        );
    };

    // Resume watching if there's already an active trip (e.g. after a page reload).
    useEffect(()=>{
        if(active&&watchIdRef.current==null) beginWatch(active.id);
        return ()=>{ if(watchIdRef.current!=null){navigator.geolocation.clearWatch(watchIdRef.current);watchIdRef.current=null;} };
    },[active&&active.id]);

    // The moment the tab comes back to the foreground (phone unlocked, browser
    // reopened, app switched back to), grab one fresh GPS fix right away
    // instead of waiting for the next scheduled ping — shortens the gap left
    // by however long the tab was backgrounded/suspended.
    useEffect(()=>{
        if(!active) return;
        const onVisible=()=>{
            if(document.visibilityState==='visible'){
                navigator.geolocation.getCurrentPosition(pos=>{
                    lastPingRef.current={t:0,lat:null,lng:null}; // force through the normal throttle just this once
                    recordPing(active.id,pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);
                },()=>{},{enableHighAccuracy:true,timeout:15000});
            }
        };
        document.addEventListener('visibilitychange',onVisible);
        return ()=>document.removeEventListener('visibilitychange',onVisible);
    },[active&&active.id]);

    // Live self-view map: lets staff actually see their own position update as
    // they move, instead of just trusting a "points logged" counter. Creates
    // the map when a trip starts and tears it down when it ends.
    useEffect(()=>{
        if(!active){ if(mapObj.current){mapObj.current.remove();mapObj.current=null;markerRef.current=null;polylineRef.current=null;} return; }
        if(!window.L||!mapRef.current) return;
        if(!mapObj.current){
            mapObj.current=window.L.map(mapRef.current).setView([9.0,8.0],13);
            window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(mapObj.current);
        }
    },[active&&active.id]);

    useEffect(()=>{
        if(!mapObj.current||!pings.length) return;
        const latlngs=pings.map(p=>[p.lat,p.lng]);
        const last=latlngs[latlngs.length-1];
        if(!markerRef.current) markerRef.current=window.L.marker(last).addTo(mapObj.current);
        else markerRef.current.setLatLng(last);
        if(latlngs.length>1){
            if(!polylineRef.current) polylineRef.current=window.L.polyline(latlngs,{color:'#059669',weight:4}).addTo(mapObj.current);
            else polylineRef.current.setLatLngs(latlngs);
        }
        mapObj.current.setView(last, Math.max(mapObj.current.getZoom(),15));
    },[pings]);

    const startTrip=()=>{
        if(!purpose.trim()){notify('Enter a purpose for the trip','error');return;}
        setBusy(true);
        navigator.geolocation.getCurrentPosition(async pos=>{
            try{
                const r=await fetch(`${SB}/rest/v1/field_trips`,{method:'POST',headers:{...HJ,'Prefer':'return=representation'},body:JSON.stringify({
                    employee_id:user.id,purpose:purpose.trim(),destination:destination.trim()||null,status:'active',
                    started_at:new Date().toISOString(),start_lat:pos.coords.latitude,start_lng:pos.coords.longitude
                })});
                if(r.ok){
                    const d=await r.json();const trip=Array.isArray(d)?d[0]:d;
                    setPurpose('');setDestination('');notify('Trip started — tracking is on');
                    setPings([{lat:pos.coords.latitude,lng:pos.coords.longitude,recorded_at:new Date().toISOString()}]);
                    setActive(trip);
                } else notify('Could not start trip','error');
            }catch(e){notify('Error starting trip','error');}
            setBusy(false);
        },err=>{
            const msgs={1:'Location permission denied — cannot start a tracked trip',2:'Location unavailable',3:'Location timed out'};
            notify(msgs[err.code]||'GPS error','error');setBusy(false);
        },{enableHighAccuracy:true,timeout:15000});
    };

    const endTrip=()=>{
        if(!active)return;
        setBusy(true);
        if(watchIdRef.current!=null){navigator.geolocation.clearWatch(watchIdRef.current);watchIdRef.current=null;}
        const finish=async(endLat,endLng)=>{
            const all=endLat!=null?[...pings,{lat:endLat,lng:endLng}]:pings;
            let dist=0;for(let i=1;i<all.length;i++) dist+=getDistanceM(all[i-1].lat,all[i-1].lng,all[i].lat,all[i].lng);
            const body={status:'completed',ended_at:new Date().toISOString(),distance_km:+(dist/1000).toFixed(2)};
            if(endLat!=null){body.end_lat=endLat;body.end_lng=endLng;}
            const r=await fetch(`${SB}/rest/v1/field_trips?id=eq.${active.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(body)});
            if(r.ok){notify(endLat!=null?'Trip ended':'Trip ended (no final GPS fix)');setActive(null);setPings([]);load();}else notify('Failed to end trip','error');
            setBusy(false);
        };
        navigator.geolocation.getCurrentPosition(pos=>finish(pos.coords.latitude,pos.coords.longitude),()=>finish(null,null),{enableHighAccuracy:true,timeout:10000});
    };

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-4xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Field Trips</h1><p className="text-gray-500 mt-1">Start a trip when you head out — your location logs periodically until you end it</p>
        </div>
        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>:<>
        {active?<div className="glass rounded-2xl p-6 mb-6 border-2 border-green-200">
            <div className="flex items-center gap-2 mb-3"><span className="w-3 h-3 rounded-full bg-green-500 animate-pulse"/><h2 className="text-lg font-bold text-green-700">Trip in progress</h2></div>
            {msgs.filter(m=>!m.acknowledged_at).map(m=><div key={m.id} className="bg-red-50 border-2 border-red-300 rounded-xl p-4 mb-3">
                <p className="text-xs font-bold text-red-700 uppercase tracking-wide"><i className="fas fa-shield-halved mr-1"/>Message from Security · {m.from_name} · {tripTime(m.sent_at)}</p>
                <p className="text-gray-800 font-semibold mt-2 whitespace-pre-wrap">{m.message}</p>
                <input value={replies[m.id]||''} onChange={e=>setReplies({...replies,[m.id]:e.target.value})} maxLength={500} placeholder="Reply (optional) — e.g. where you are, when you'll be back" className="w-full px-3 py-2 border-2 border-red-200 rounded-xl text-sm mt-3 bg-white"/>
                <button onClick={()=>ackMsg(m)} className="mt-2 w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-bold text-sm"><i className="fas fa-check mr-2"/>Received — I'm safe</button>
            </div>)}
            {msgs.some(m=>m.acknowledged_at)&&<details className="mb-3"><summary className="text-xs text-gray-500 cursor-pointer font-semibold">Earlier messages from Security ({msgs.filter(m=>m.acknowledged_at).length})</summary>
                <div className="space-y-2 mt-2">{msgs.filter(m=>m.acknowledged_at).map(m=><div key={m.id} className="bg-gray-50 rounded-xl p-3 text-sm"><p className="text-xs text-gray-400">{m.from_name} · {tripTime(m.sent_at)}</p><p className="text-gray-700 whitespace-pre-wrap">{m.message}</p>{m.reply&&<p className="text-xs text-green-700 mt-1">Your reply: {m.reply}</p>}</div>)}</div></details>}
            <p className="text-gray-800 font-semibold">{active.purpose}</p>
            {active.destination&&<p className="text-sm text-gray-500">→ {active.destination}</p>}
            <div className="grid grid-cols-2 gap-4 mt-4">
                <div className="bg-gray-50 rounded-xl p-4"><p className="text-xs font-bold text-gray-400 uppercase">Started</p><p className="font-bold text-gray-800">{new Date(active.started_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</p></div>
                <div className="bg-gray-50 rounded-xl p-4"><p className="text-xs font-bold text-gray-400 uppercase">Duration</p><p className="font-bold text-gray-800">{fmtDur(active.started_at)}</p></div>
            </div>
            <div ref={mapRef} className="mt-4" style={{height:'220px',borderRadius:'12px'}}/>
            <p className="text-xs text-gray-400 mt-3">{pings.length} location point{pings.length!==1?'s':''} logged</p>
            {gpsStatus&&<p className="text-xs text-amber-600 mt-2"><i className="fas fa-triangle-exclamation mr-1"/>{gpsStatus}</p>}
            <button onClick={endTrip} disabled={busy} className="mt-4 w-full bg-red-500 hover:bg-red-600 disabled:opacity-50 text-white py-3 rounded-xl font-bold"><i className="fas fa-flag-checkered mr-2"/>End Trip</button>
        </div>:<div className="glass rounded-2xl p-6 mb-6">
            <h2 className="text-lg font-bold mb-4"><i className="fas fa-route text-green-600 mr-2"/>Start a Trip</h2>
            <input value={purpose} onChange={e=>setPurpose(e.target.value)} placeholder="Purpose (e.g. Facility supervision visit)" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl mb-3"/>
            <input value={destination} onChange={e=>setDestination(e.target.value)} placeholder="Destination (optional)" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl mb-4"/>
            <p className="text-xs text-gray-400 mb-3"><i className="fas fa-location-dot mr-1"/>Your phone will ask for location access. Tracking only runs while this page is open.</p>
            <button onClick={startTrip} disabled={busy||!purpose.trim()} className="w-full btn-green disabled:opacity-50 text-white py-3 rounded-xl font-bold"><i className="fas fa-play mr-2"/>Start Trip</button>
        </div>}
        <div className="glass rounded-2xl p-6">
            <h2 className="text-lg font-bold mb-4"><i className="fas fa-clock-rotate-left text-blue-600 mr-2"/>Trip History</h2>
            {history.length===0?<div className="text-center py-8 text-gray-400"><i className="fas fa-route text-3xl mb-2"/><p className="font-semibold">No completed trips yet</p></div>
            :<div className="space-y-3">{history.map(t=><div key={t.id} className="border-2 border-gray-100 rounded-xl p-4">
                <div className="flex justify-between items-start"><div><p className="font-semibold text-gray-800">{t.purpose}</p>{t.destination&&<p className="text-sm text-gray-500">→ {t.destination}</p>}<p className="text-xs text-gray-400 mt-1">{new Date(t.started_at).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})} · {new Date(t.started_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} – {t.ended_at?new Date(t.ended_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'--'}</p></div>
                <div className="text-right"><p className="text-xs font-bold text-gray-400 uppercase">Distance</p><p className="font-bold text-gray-800">{t.distance_km?`${t.distance_km} km`:'--'}</p></div></div>
            </div>)}</div>}
        </div>
        </>}
    </div></div>;
}

function FieldTripAdmin({user,notify,onBack}) {
    const [activeTrips,setActiveTrips]=useState([]);
    const [recent,setRecent]=useState([]);
    const [names,setNames]=useState({});
    const [pingsByTrip,setPingsByTrip]=useState({});
    const [loading,setLoading]=useState(true);
    const mapRef=useRef(null);
    const mapObj=useRef(null);
    const markersRef=useRef({});
    const polylinesRef=useRef({});
    const [msgsByTrip,setMsgsByTrip]=useState({});const [phones,setPhones]=useState({});const [emerg,setEmerg]=useState({});const [lastUpdated,setLastUpdated]=useState(null);
    const [refreshing,setRefreshing]=useState(false);const [composeFor,setComposeFor]=useState(null);const [draft,setDraft]=useState('');const [sending,setSending]=useState(false);

    const load=async()=>{
        try{
            const ar=await fetch(`${SB}/rest/v1/field_trips?status=eq.active&order=started_at.desc`,{headers:H});
            const ad=await ar.json();const activeArr=Array.isArray(ad)?ad:[];setActiveTrips(activeArr);
            const rr=await fetch(`${SB}/rest/v1/field_trips?status=eq.completed&order=started_at.desc&limit=30`,{headers:H});
            const rd=await rr.json();const recentArr=Array.isArray(rd)?rd:[];setRecent(recentArr);
            const ids=[...new Set([...activeArr,...recentArr].map(t=>t.employee_id))];
            if(ids.length>0){
                const ur=await fetch(`${SB}/rest/v1/users?select=id,name&id=in.(${ids.join(',')})`,{headers:H});
                const ud=await ur.json();const n={};(ud||[]).forEach(u=>n[u.id]=u.name);setNames(n);
            }
            if(activeArr.length>0){
                // Full ping history per active trip (not just the latest point) so the
                // map can draw the actual route walked/driven, not a single static dot.
                const tripIds=activeArr.map(t=>t.id).join(',');
                const pr=await fetch(`${SB}/rest/v1/trip_pings?trip_id=in.(${tripIds})&order=recorded_at.asc`,{headers:H});
                const pd=await pr.json();
                const byTrip={};(pd||[]).forEach(p=>{(byTrip[p.trip_id]=byTrip[p.trip_id]||[]).push(p);});
                setPingsByTrip(byTrip);
            } else setPingsByTrip({});
            if(activeArr.length>0){
                const uids=[...new Set(activeArr.map(t=>t.employee_id))];
                const [ph,ms]=await Promise.all([
                    fetch(`${SB}/rest/v1/staff_profiles?user_id=in.(${uids.join(',')})&select=user_id,phone`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]),
                    fetch(`${SB}/rest/v1/trip_messages?trip_id=in.(${activeArr.map(t=>encodeURIComponent(String(t.id))).join(',')})&order=sent_at.asc`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[])]);
                const pm={};(Array.isArray(ph)?ph:[]).forEach(p=>{if(p.phone)pm[p.user_id]=p.phone;});setPhones(pm);
                const ec=await fetch(`${SB}/rest/v1/staff_emergency_contacts?user_id=in.(${uids.join(',')})&select=user_id,contact_name,relationship,phone,medical_note`,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]);
                const em={};(Array.isArray(ec)?ec:[]).forEach(x=>em[x.user_id]=x);setEmerg(em);
                const mm={};(Array.isArray(ms)?ms:[]).forEach(m=>{(mm[m.trip_id]=mm[m.trip_id]||[]).push(m);});setMsgsByTrip(mm);
            } else setMsgsByTrip({});
            setLastUpdated(new Date());
        }catch(e){}
        setLoading(false);
    };
    useEffect(()=>{load();const iv=setInterval(load,30000);return()=>clearInterval(iv);},[]);

    useEffect(()=>{
        if(!window.L||!mapRef.current)return;
        if(!mapObj.current){
            mapObj.current=window.L.map(mapRef.current).setView([9.0,8.0],6);
            window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(mapObj.current);
        }
        const map=mapObj.current;
        Object.values(markersRef.current).forEach(m=>map.removeLayer(m));
        markersRef.current={};
        Object.values(polylinesRef.current).forEach(l=>map.removeLayer(l));
        polylinesRef.current={};
        const allPoints=[];
        activeTrips.forEach(t=>{
            const trail=(pingsByTrip[t.id]||[]).map(p=>[p.lat,p.lng]);
            const points=trail.length?trail:(t.start_lat!=null?[[t.start_lat,t.start_lng]]:[]);
            if(!points.length)return;
            points.forEach(pt=>allPoints.push(pt));
            if(points.length>1){
                polylinesRef.current[t.id]=window.L.polyline(points,{color:'#dc2626',weight:3,opacity:0.7}).addTo(map);
            }
            const last=points[points.length-1];
            const pings=pingsByTrip[t.id];
            const lastPing=pings&&pings.length?pings[pings.length-1]:null;
            const marker=window.L.marker(last).addTo(map).bindPopup(`<b>${tripEsc(names[t.employee_id]||'Staff')}</b><br/>${tripEsc(t.purpose)}${lastPing?`<br/><span style="color:#888">Updated ${new Date(lastPing.recorded_at).toLocaleTimeString()}</span>`:'<br/><span style="color:#888">Awaiting first ping</span>'}`);
            markersRef.current[t.id]=marker;
        });
        // Keep every active trip visible without requiring the supervisor to
        // manually pan — the map used to sit fixed on Kano/Katsina regardless
        // of where staff actually were.
        if(allPoints.length===1) map.setView(allPoints[0],14);
        else if(allPoints.length>1) map.fitBounds(allPoints,{padding:[40,40],maxZoom:14});
    },[activeTrips,pingsByTrip,names]);

    const refreshNow=async()=>{setRefreshing(true);await load();setRefreshing(false);};
    const lastSeen=t=>{const p=pingsByTrip[t.id];return new Date(p&&p.length?p[p.length-1].recorded_at:t.started_at);};
    const minsSince=t=>Math.floor((Date.now()-lastSeen(t).getTime())/60000);
    const isStale=t=>minsSince(t)>TRIP_STALE_MIN;
    const staleCount=activeTrips.filter(isStale).length;
    const sortedActive=[...activeTrips].sort((a,b)=>(isStale(b)-isStale(a))||(lastSeen(a)-lastSeen(b)));
    const sendMsg=async t=>{const text=draft.trim();if(!text){notify('Write a message first','error');return;}setSending(true);
        try{const r=await fetch(`${SB}/rest/v1/trip_messages`,{method:'POST',headers:HJ,body:JSON.stringify({trip_id:String(t.id),to_user_id:t.employee_id,from_name:(user&&user.name)||'Security',message:text.slice(0,1000)})});
            if(r.ok){notify('Message sent. It will show on their trip screen.');setDraft('');setComposeFor(null);load();}else notify('Could not send the message','error');}
        catch(e){notify('Could not send — check your connection','error');}
        setSending(false);};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Field Trips</h1><div className="flex flex-wrap justify-between items-end gap-3"><p className="text-gray-500 mt-1">Live locations and routes for staff currently on a trip · refreshes every 30s{lastUpdated?` · last updated ${lastUpdated.toLocaleTimeString()}`:''}</p>
            <button onClick={refreshNow} disabled={refreshing} className="px-4 py-2 rounded-xl font-semibold text-sm bg-green-50 text-green-700 hover:bg-green-100 disabled:opacity-60"><i className={`fas fa-rotate mr-2 ${refreshing?'fa-spin':''}`}/>Refresh now</button></div>
            {staleCount>0&&<div className="mt-4 bg-red-50 border-2 border-red-200 rounded-xl p-3 text-sm font-semibold text-red-700"><i className="fas fa-triangle-exclamation mr-2"/>{staleCount} {staleCount===1?'person has':'people have'} not sent a location update for over {TRIP_STALE_MIN} minutes. Contact them.</div>}
        </div>
        <div className="glass rounded-2xl p-3 mb-6"><div ref={mapRef} style={{height:'420px',borderRadius:'12px'}}/></div>
        <div className="glass rounded-2xl p-6 mb-6">
            <h2 className="text-lg font-bold mb-4"><i className="fas fa-satellite-dish text-green-600 mr-2"/>Active Now ({activeTrips.length})</h2>
            {loading?<div className="text-center py-8 text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>
            :activeTrips.length===0?<div className="text-center py-8 text-gray-400"><i className="fas fa-route text-3xl mb-2"/><p className="font-semibold">No one is on a tracked trip right now</p></div>
                        :<div className="space-y-3">{sortedActive.map(t=>{const pings=pingsByTrip[t.id];const ping=pings&&pings.length?pings[pings.length-1]:null;const stale=isStale(t);const tm=msgsByTrip[String(t.id)]||[];const phone=phones[t.employee_id];const wa=waNumber(phone);
                return <div key={t.id} className={`border-2 rounded-xl p-4 ${stale?'border-red-300':'border-green-100'}`} style={{background:stale?'rgba(220,38,38,0.06)':'rgba(16,185,129,0.06)'}}>
                <div className="flex justify-between items-start gap-3"><div><p className="font-bold text-gray-800"><span className={`w-2 h-2 inline-block rounded-full mr-2 ${stale?'bg-red-500':'bg-green-500 animate-pulse'}`}/>{names[t.employee_id]||'Staff'}</p><p className="text-sm text-gray-600">{t.purpose}{t.destination?` → ${t.destination}`:''}</p><p className="text-xs text-gray-400 mt-1">Started {new Date(t.started_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · {fmtDur(t.started_at)} elapsed · {pings?pings.length:0} point{pings&&pings.length!==1?'s':''} logged</p></div>
                <div className={`text-right text-xs ${stale?'text-red-600 font-bold':'text-gray-400'}`}>{ping?`Updated ${new Date(ping.recorded_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`:'Awaiting first ping'}{stale&&<p>No update for {minsSince(t)} min</p>}</div></div>
                <div className="flex flex-wrap gap-2 mt-3">
                    {phone?<><a href={`tel:${String(phone).replace(/[^\d+]/g,'')}`} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-50 text-blue-700 hover:bg-blue-100"><i className="fas fa-phone mr-1"/>Call</a>
                        {wa&&<a href={`https://wa.me/${wa}`} target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 rounded-xl text-xs font-bold bg-green-50 text-green-700 hover:bg-green-100"><i className="fab fa-whatsapp mr-1"/>WhatsApp</a>}</>
                    :<span className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-100 text-gray-500">No phone number in HR profile</span>}
                    <button onClick={()=>{setComposeFor(composeFor===t.id?null:t.id);setDraft('');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-red-50 text-red-700 hover:bg-red-100"><i className="fas fa-message mr-1"/>Send message</button>
                </div>
                {emerg[t.employee_id]?<p className="text-xs text-gray-600 mt-2"><i className="fas fa-user-shield text-red-500 mr-1"/>Emergency contact: {emerg[t.employee_id].contact_name}{emerg[t.employee_id].relationship?` (${emerg[t.employee_id].relationship})`:''}{emerg[t.employee_id].phone&&<> · <a href={`tel:${String(emerg[t.employee_id].phone).replace(/[^\d+]/g,'')}`} className="text-blue-600 font-semibold">{emerg[t.employee_id].phone}</a></>}{emerg[t.employee_id].medical_note?` · ${emerg[t.employee_id].medical_note}`:''}</p>
                :<p className="text-xs text-gray-400 mt-2"><i className="fas fa-user-shield mr-1"/>No emergency contact on file</p>}
                {composeFor===t.id&&<div className="mt-3 bg-white rounded-xl p-3 border-2 border-gray-100">
                    <div className="flex flex-wrap gap-1 mb-2">{TRIP_TEMPLATES.map((tx,i)=><button key={i} onClick={()=>setDraft(tx)} className="px-2 py-1 rounded-lg text-xs bg-gray-100 text-gray-600 hover:bg-gray-200">{tx.split(' ').slice(0,4).join(' ')}…</button>)}</div>
                    <textarea rows={2} value={draft} onChange={e=>setDraft(e.target.value)} maxLength={1000} placeholder="Message to the traveller" className="w-full px-3 py-2 border-2 border-gray-200 rounded-xl text-sm"/>
                    <button onClick={()=>sendMsg(t)} disabled={sending} className="mt-2 btn-green text-white px-4 py-2 rounded-xl font-semibold text-sm disabled:opacity-60">{sending?'Sending…':'Send'}</button>
                    <span className="text-xs text-gray-400 ml-3">They see it next time their trip screen checks (within 30s while open).</span></div>}
                {tm.length>0&&<div className="mt-3 space-y-2">{tm.map(m=><div key={m.id} className="bg-white rounded-xl p-3 text-sm border border-gray-100">
                    <div className="flex justify-between gap-2"><p className="text-gray-700 whitespace-pre-wrap">{m.message}</p>
                        <span className={`shrink-0 px-2 py-0.5 rounded-full text-xs font-bold h-fit ${m.acknowledged_at?'bg-green-100 text-green-700':m.read_at?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700'}`}>{m.acknowledged_at?`✓ Acknowledged ${tripTime(m.acknowledged_at)}`:m.read_at?`Seen ${tripTime(m.read_at)}`:'Not seen yet'}</span></div>
                    <p className="text-xs text-gray-400 mt-1">{m.from_name} · {tripTime(m.sent_at)}</p>
                    {m.reply&&<p className="text-xs text-green-800 bg-green-50 rounded-lg p-2 mt-1"><b>Reply:</b> {m.reply}</p>}</div>)}</div>}
            </div>;})}</div>}
        </div>
        <div className="glass rounded-2xl p-6">
            <h2 className="text-lg font-bold mb-4"><i className="fas fa-clock-rotate-left text-blue-600 mr-2"/>Recent Completed Trips</h2>
            {recent.length===0?<div className="text-center py-8 text-gray-400"><i className="fas fa-route text-3xl mb-2"/><p className="font-semibold">No completed trips yet</p></div>
            :<div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="border-b-2 border-gray-100">
                <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Staff</th>
                <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Purpose</th>
                <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Date</th>
                <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Duration</th>
                <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase text-xs">Distance</th>
            </tr></thead><tbody>{recent.map(t=><tr key={t.id} className="border-b border-gray-50">
                <td className="py-2 px-2 font-semibold text-gray-800">{names[t.employee_id]||'Staff'}</td>
                <td className="py-2 px-2 text-gray-600">{t.purpose}{t.destination?` → ${t.destination}`:''}</td>
                <td className="py-2 px-2 text-gray-600">{new Date(t.started_at).toLocaleDateString([],{month:'short',day:'numeric'})}</td>
                <td className="py-2 px-2 text-gray-600">{fmtDur(t.started_at,t.ended_at)}</td>
                <td className="py-2 px-2 text-gray-600">{t.distance_km?`${t.distance_km} km`:'--'}</td>
            </tr>)}</tbody></table></div>}
        </div>
    </div></div>;
}

/* ==================== SUPERVISOR DASHBOARD — with Login Logs button ==================== */
function DeadlineSettings({user,notify,onBack}) {
    const [deadline,setDeadline]=useState('');
    const [overrideOpen,setOverrideOpen]=useState(false);
    const [loading,setLoading]=useState(true);
    const [busy,setBusy]=useState(false);
    const [meta,setMeta]=useState(null);

    const load=()=>{
        fetch(`${SB}/rest/v1/review_cycle_settings?id=eq.1`,{headers:H})
            .then(r=>r.json())
            .then(d=>{
                const s=Array.isArray(d)&&d.length?d[0]:null;
                setDeadline(s?.deadline||'');
                setOverrideOpen(!!s?.override_open);
                setMeta(s);
                setLoading(false);
            }).catch(()=>setLoading(false));
    };
    useEffect(()=>{load();},[]);

    const save=async()=>{
        setBusy(true);
        const r=await fetch(`${SB}/rest/v1/review_cycle_settings?id=eq.1`,{method:'PATCH',headers:HJ,
            body:JSON.stringify({deadline:deadline||null,override_open:overrideOpen,updated_by:user.name,updated_at:new Date().toISOString()})});
        if(r.ok){notify('Deadline settings saved');load();}else notify('Failed to save','error');
        setBusy(false);
    };

    const passed = meta?.deadline && new Date(meta.deadline+'T23:59:59')<new Date();
    const currentlyLocked = passed && !meta?.override_open;

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-2xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Self-Assessment Deadline</h1>
            <p className="text-gray-500 mt-1">Controls whether staff can still submit a self-assessment. Applies to everyone at once.</p>
        </div>

            <div className={`glass rounded-2xl p-5 mb-6 border-2 ${currentlyLocked?'border-red-200 bg-red-50':'border-green-200 bg-green-50'}`}>
                <p className={`font-bold ${currentlyLocked?'text-red-700':'text-green-700'}`}>
                    <i className={`fas ${currentlyLocked?'fa-lock':'fa-lock-open'} mr-2`}/>

                {meta?.updated_by&&<p className="text-xs text-gray-400 mt-1">Last changed by {meta.updated_by}{meta.updated_at?` on ${new Date(meta.updated_at).toLocaleDateString()}`:''}</p>}
            </div>

            <div className="glass rounded-2xl p-6 space-y-5">

                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Deadline Date</label>

                    <p className="text-xs text-gray-400 mt-1">After this date, staff can no longer start or submit a self-assessment — unless reopened below. Leave blank for no deadline at all.</p>
                </div>

                <div className="flex items-start gap-3 bg-amber-50 border-2 border-amber-200 rounded-xl p-4">
                    <input type="checkbox" checked={overrideOpen} onChange={e=>setOverrideOpen(e.target.checked)} className="mt-1 w-5 h-5"/>

                        <p className="font-semibold text-gray-800 text-sm">Force reopen for everyone</p>
                        <p className="text-xs text-gray-500 mt-1">Overrides the deadline above — while checked, everyone can submit regardless of the date. Uncheck to let the deadline take effect again.</p>
                    </div>
                </div>

                <button onClick={save} disabled={busy} className="w-full btn-green text-white py-3.5 rounded-xl font-bold disabled:opacity-50">
                    {busy?'Saving...':'Save Deadline Settings'}
                </button>
            </div>
        </>}
    </div></div>;
}

function parseQuarterLabel(label){
    const m=/^Q([1-4])\s+(\d{4})$/.exec(label||'');
    if(!m) return null;
    const q=Number(m[1]), year=Number(m[2]);
    return {start:new Date(year,(q-1)*3,1), end:new Date(year,q*3,0,23,59,59)};
}

function QuarterlyOverview({notify,onBack}) {
    const [quarter,setQuarter]=useState(currentQuarterLabel());
    const [apps,setApps]=useState([]);
    const [employees,setEmployees]=useState([]);
    const [loading,setLoading]=useState(true);

    const load=async()=>{
        setLoading(true);
        try{
            const a=await fetch(`${SB}/rest/v1/appraisals?order=created_at.desc`,{headers:H}).then(r=>r.json());
            setApps(Array.isArray(a)?a:[]);
            const u=await fetch(`${SB}/rest/v1/users?select=id,name,email&role=eq.employee&order=name.asc`,{headers:H}).then(r=>r.json());
            setEmployees(Array.isArray(u)?u:[]);
        }catch(e){}
        setLoading(false);
    };
    useEffect(()=>{load();},[]);

    const range=parseQuarterLabel(quarter);
    const inRange=dateStr=>{ if(!range||!dateStr) return false; const d=new Date(dateStr); return d>=range.start&&d<=range.end; };

    // Reviewed: explicitly tagged to this quarter by whoever completed the review.
    const reviewed=apps.filter(a=>!a.withdrawn&&a.status==='completed'&&a.review_period===quarter);
    // Awaiting review: submitted (by date) within this quarter but not yet reviewed —
    // pending appraisals have no review_period yet, so date is the only signal available.
    const pendingThisQuarter=apps.filter(a=>!a.withdrawn&&a.status==='pending'&&inRange(a.created_at));
    // Not yet submitted: anyone with no appraisal at all dated inside this quarter,
    // regardless of review status — this is the actual submission gap, not a review backlog.
    const submittedIds=new Set(apps.filter(a=>!a.withdrawn&&inRange(a.created_at)).map(a=>a.employee_id));
    const missing=employees.filter(e=>!submittedIds.has(e.id));

    const quarterOptions=[...new Set([...recentQuarters(8), ...apps.filter(a=>a.review_period).map(a=>a.review_period)])];

                    {quarterOptions.map(q=><option key={q} value={q}>{q}</option>)}
                </select>
            </div>
        </div>

        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>:<>
            <div className="grid grid-cols-3 gap-4 mb-6">
                <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Reviewed</p><p className="text-3xl font-extrabold text-green-600 mt-1">{reviewed.length}</p></div>
                <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Awaiting Review</p><p className="text-3xl font-extrabold text-amber-600 mt-1">{pendingThisQuarter.length}</p></div>
                <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Not Yet Submitted</p><p className="text-3xl font-extrabold text-red-500 mt-1">{missing.length}</p></div>

                {missing.length===0?<p className="text-sm text-gray-400">Everyone has submitted for {quarter}.</p>
                :<div className="grid md:grid-cols-2 gap-2">{missing.map(e=><div key={e.id} className="flex items-center gap-2 bg-red-50 border border-red-100 rounded-lg px-3 py-2">

            <div className="glass rounded-2xl p-6 mb-6">

                {pendingThisQuarter.length===0?<p className="text-sm text-gray-400">Nothing waiting on a review for {quarter}.</p>
                :<div className="space-y-2">{pendingThisQuarter.map(a=><div key={a.id} className="flex justify-between items-center bg-amber-50 border border-amber-100 rounded-lg px-4 py-2.5">
                    <span className="text-sm font-semibold text-gray-800">{employees.find(e=>e.id===a.employee_id)?.name||'Employee'}</span>
                    <span className="text-xs text-gray-400">Submitted {new Date(a.created_at).toLocaleDateString()}</span>
                </div>)}</div>}
            </div>

            <div className="glass rounded-2xl p-6">

}

function SupReview({app,name,user,notify,onDone}) {
    const done=app.status==='completed';
    const [lateDays,setLateDays]=useState(app.attendance_late_days||0);
    const [deduction,setDeduction]=useState(app.attendance_deduction||0);
    const [attLoaded,setAttLoaded]=useState(false);
    const [withdrawing,setWithdrawing]=useState(false);
    const [withdrawReason,setWithdrawReason]=useState('');
    const [withdrawBusy,setWithdrawBusy]=useState(false);

    const withdraw=async()=>{
        if(!withdrawReason.trim()){notify('Give a reason (e.g. duplicate, submitted in error)','error');return;}
        if(!confirm(`Withdraw this appraisal for ${name||'this employee'}? It moves to the Withdrawn tab and can be restored later if needed.`))return;
        setWithdrawBusy(true);
        try{
            const r=await fetch(`${SB}/rest/v1/appraisals?id=eq.${app.id}`,{method:'PATCH',headers:HJ,
                body:JSON.stringify({withdrawn:true,withdrawn_by:user?.name||null,withdrawn_at:new Date().toISOString(),withdrawal_reason:withdrawReason.trim()})});
            if(r.ok){notify('Appraisal withdrawn');onDone();}else notify('Failed','error');
        }catch(e){notify('Error','error');}
        setWithdrawBusy(false);
    };

    useEffect(()=>{
        const month=new Date(app.created_at).toISOString().slice(0,7);
        fetch(`${SB}/rest/v1/attendance?employee_id=eq.${app.employee_id}&date=gte.${month}-01&date=lte.${month}-31`,{headers:H})
        .then(r=>r.json())
        .then(records=>{
            if(Array.isArray(records)){
                const late=records.filter(r=>r.status==='late').length;
                const ded=calcDeduction(late);
                setLateDays(late); setDeduction(ded); setAttLoaded(true);
            }
        }).catch(()=>setAttLoaded(true));
    },[]);

    const [rate,setRate]=useState(app.supervisor_ratings||{});const [comm,setComm]=useState(app.supervisor_comments||{});const [overall,setOverall]=useState(app.supervisor_overall_comments||'');const [busy,setBusy]=useState(false);
    // Which quarter this review counts toward — defaults to the current
    // quarter but editable, since a review completed in early Q4 might
    // still be catching up on a Q3 submission.
    const [reviewPeriod,setReviewPeriod]=useState(app.review_period||currentQuarterLabel());
    // A completed review that the employee disputed can be reopened for editing —
    // every other completed review stays fully read-only.
    const [revising,setRevising]=useState(false);
    const canRevise=done&&app.employee_review_status==='rejected';
    const editable=!done||revising;

    const compScore=scoreToPercent(avg(rate));
    const finalScr=adjustedScore(avg(rate),deduction);
    const gradeBand=gradeFromScore(finalScr);
    const rated=Object.keys(rate).length;

    const progress=(rated/comps.length)*100;const allComm=Object.keys(rate).every(k=>comm[k]&&comm[k].trim().length>=10);const missing=Object.keys(rate).filter(k=>!comm[k]||comm[k].trim().length<10);
    const submit=async()=>{if(rated<comps.length){notify('Rate all competencies','error');return;}if(!allComm){notify(`Add feedback for: ${missing[0]}`,'error');return;}if(!overall.trim()){notify('Add overall assessment','error');return;}setBusy(true);
