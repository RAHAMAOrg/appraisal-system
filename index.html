/* ── Device / browser helpers ── */
const getBrowser=ua=>{if(ua.includes('Chrome')&&!ua.includes('Edg'))return'Chrome';if(ua.includes('Firefox'))return'Firefox';if(ua.includes('Safari')&&!ua.includes('Chrome'))return'Safari';if(ua.includes('Edg'))return'Edge';if(ua.includes('OPR')||ua.includes('Opera'))return'Opera';return'Unknown';};
const getOS=ua=>{if(ua.includes('Windows'))return'Windows';if(ua.includes('Mac'))return'MacOS';if(ua.includes('Android'))return'Android';if(ua.includes('iPhone')||ua.includes('iPad'))return'iOS';if(ua.includes('Linux'))return'Linux';return'Unknown';};
const getDevice=ua=>{if(/Mobi|Android|iPhone|iPad/i.test(ua))return'Mobile';if(/Tablet|iPad/i.test(ua))return'Tablet';return'Desktop';};
    const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const currentPeriod=()=>{const d=new Date();return {month:MONTHS[d.getMonth()],year:String(d.getFullYear())};};
// "Q3 2026" style label — used both as the default suggestion when a
// supervisor tags a completed review, and to bucket submission dates for
// the "who hasn't submitted" check (which can't rely on review_period,
// since that's only set once a review is actually completed).
const quarterLabel=(d)=>`Q${Math.floor(d.getMonth()/3)+1} ${d.getFullYear()}`;
const currentQuarterLabel=()=>quarterLabel(new Date());
const recentQuarters=(count=8)=>{
    const out=[]; const d=new Date();
    for(let i=0;i<count;i++){ out.push(quarterLabel(new Date(d.getFullYear(), d.getMonth()-i*3, 1))); }
    return out;
};
const isRoutine=a=>/recurring/i.test(a.activity_type||'');

/* Compress photos before they become base64 in the database.
   A 4MB phone photo becomes ~300KB; base64 inflates by ~33%, so this is the
   difference between 5.3MB and 400KB per MoV. Non-images pass through. */
const compressImage=async(file,maxDim=1600,quality=0.72)=>{
    if(!file||!file.type||!file.type.startsWith('image/')) return file;
    if(file.type==='image/gif') return file;
    if(file.size<300*1024) return file;
    try{
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
        const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl;});
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ if(w>=h){h=Math.round(h*(maxDim/w));w=maxDim;} else {w=Math.round(w*(maxDim/h));h=maxDim;} }
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');ctx.fillStyle='#FFF';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',quality));
        if(!blob||blob.size>=file.size) return file;
        return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
    }catch(e){return file;}
};

function Toast({message,type,onClose}) {
    useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
    const bg={success:'bg-green-600',error:'bg-red-600',info:'bg-blue-600'}[type];
    const ic={success:'fa-check-circle',error:'fa-exclamation-circle',info:'fa-info-circle'}[type];
    return <div className={`toast-box ${bg} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3`}>
        <i className={`fas ${ic} text-lg`}/><span className="font-medium">{message}</span>
        <button onClick={onClose} className="ml-4 opacity-70 hover:opacity-100"><i className="fas fa-times"/></button>
    </div>;
}

function App() {
    const [user,setUser]=useState(null);
    const [view,setView]=useState('login');
    const [toast,setToast]=useState(null);
    const notify=(msg,type='success')=>setToast({message:msg,type});

    useEffect(()=>{
        (async()=>{
            const s=localStorage.getItem('rahama_session');
            if(!s) return;
            let u=JSON.parse(s);
            // Pre-migration sessions (or anything hand-edited) have no real
            // access_token — those are no longer trusted at all.
            if(!u.access_token||!u.refresh_token){
                localStorage.removeItem('rahama_session');localStorage.removeItem('pms_user');return;
            }
            // Re-hydrate the Supabase Auth client with the stored session,
            // refreshing first if the access token has already expired (or
            // is about to). This replaces trusting the localStorage blob
            // outright with an actual signed-token check.
            const stale=!u.expires_at||(Date.now()/1000)>(u.expires_at-30);
            if(stale){
                if(!supabaseClient){localStorage.removeItem('rahama_session');localStorage.removeItem('pms_user');setView('login');return;}
                const {data,error}=await supabaseClient.auth.refreshSession({refresh_token:u.refresh_token});
                if(error||!data?.session){
                    localStorage.removeItem('rahama_session');localStorage.removeItem('pms_user');
                    setView('login');return;
                }
                u={...u,access_token:data.session.access_token,refresh_token:data.session.refresh_token,expires_at:data.session.expires_at,issuedAt:Date.now()};
                localStorage.setItem('rahama_session',JSON.stringify(u));
                localStorage.setItem('pms_user',JSON.stringify(u));
            } else if(supabaseClient){
                await supabaseClient.auth.setSession({access_token:u.access_token,refresh_token:u.refresh_token}).catch(()=>{});
            }
            setUser(u);
            setView(u.role==='employee'?'dashboard':'supervisor');
            // Saved sessions predate the is_mne flag, so re-read it from the
            // database on load rather than requiring everyone to log out.
            fetch(`${SB}/rest/v1/users?id=eq.${u.id}&select=is_mne`,{headers:H})
                .then(r=>r.json())
                .then(d=>{
                    if(Array.isArray(d)&&d.length){
                        const flag=!!d[0].is_mne;
                        if(flag!==!!u.is_mne){
                            const nu={...u,is_mne:flag};
                            setUser(nu);
                            localStorage.setItem('rahama_session',JSON.stringify(nu));
                            localStorage.setItem('pms_user',JSON.stringify(nu));
                        }
                    }
                }).catch(()=>{});
            // is_security is fetched separately and defensively — if that
            // column doesn't exist yet on `users`, this silently no-ops
            // instead of affecting login or session restore at all.
            fetch(`${SB}/rest/v1/users?id=eq.${u.id}&select=is_security`,{headers:H})
                .then(r=>r.ok?r.json():[])
                .then(d=>{
                    if(Array.isArray(d)&&d.length){
                        const secFlag=!!d[0].is_security;
                        if(secFlag!==!!u.is_security){
                            setUser(cur=>{
                                const nu={...(cur||u),is_security:secFlag};
                                localStorage.setItem('rahama_session',JSON.stringify(nu));
                                localStorage.setItem('pms_user',JSON.stringify(nu));
                                return nu;
                            });
                        }
                    }
                }).catch(()=>{});
        })();
    },[]);

    /* ── Login via Supabase Auth ──
       Credentials are now checked by GoTrue against auth.users (seeded
       from the same bcrypt hashes that used to live only in
       public.users.password_hash) instead of the old verify_login() RPC.
       Device/browser/OS/IP logging into login_logs is unchanged. */
    const login=async(email,pw,role)=>{
        try{
            if(!supabaseClient){notify('Auth unavailable — please reload the page','error');return;}
            const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pw});

            /* collect device info */
            const ua=navigator.userAgent;
            const deviceInfo={device:getDevice(ua),browser:getBrowser(ua),os:getOS(ua),screen_size:`${window.screen.width}x${window.screen.height}`};

            /* collect IP silently */
            let ipInfo={ip_address:'Unknown',location:'Unknown'};
            try{
                const ip=await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(4000)});
                if(ip.ok){const d=await ip.json();ipInfo={ip_address:d.ip||'Unknown',location:`${d.city||''}${d.city?', ':''}${d.region||''}${d.region?', ':''}${d.country_name||''}`.trim()};}
            }catch(e){}

            /* Auth only proves *who they are*; role/name/id/is_mne still
               live in public.users, so pull that profile once sign-in
               succeeds. The role picked on the login screen must match the
               role on file — this is now enforced here since the RPC that
               used to do it is gone. */
            let account=null;
            if(!error&&data?.user){
                const pr=await fetch(`${SB}/rest/v1/users?email=eq.${encodeURIComponent(data.user.email)}&select=id,name,email,role,is_mne`,{headers:H});
                const rows=pr.ok?await pr.json():[];
                account=Array.isArray(rows)&&rows.length?rows[0]:null;
            }

            if(account&&account.id&&account.role===role){
                let isSecurity=false;
                try{
                    const sr=await fetch(`${SB}/rest/v1/users?id=eq.${account.id}&select=is_security`,{headers:H});
                    if(sr.ok){const sd=await sr.json();isSecurity=Array.isArray(sd)&&sd.length?!!sd[0].is_security:false;}
                }catch(e){}
                const d={
                    email:account.email,name:account.name,role:account.role,id:account.id,is_mne:!!account.is_mne,is_security:isSecurity,
                    access_token:data.session.access_token,refresh_token:data.session.refresh_token,expires_at:data.session.expires_at,
                    issuedAt:Date.now()
                };
                setUser(d);
                localStorage.setItem('rahama_session',JSON.stringify(d));
                localStorage.setItem('pms_user',JSON.stringify(d));
                setView(role==='employee'?'dashboard':'supervisor');
                notify(`Welcome, ${account.name}!`);
                /* log success — silent fail */
                fetch(`${SB}/rest/v1/login_logs`,{method:'POST',headers:HJ,
                    body:JSON.stringify({user_id:account.id,email,name:account.name,role,...deviceInfo,...ipInfo,status:'success'})
                }).catch(()=>{});
            } else {
                // Auth succeeded but the role didn't match (or no profile
                // row exists) — don't leave a live Supabase session behind.
                if(data?.session) await supabaseClient.auth.signOut().catch(()=>{});
                const msg=(account&&account.role&&account.role!==role)
                    ?`This account is registered as ${account.role}. Please choose the correct sign-in option.`
                    :'Invalid credentials';
                notify(msg,'error');
                /* log failed attempt — silent fail */
                fetch(`${SB}/rest/v1/login_logs`,{method:'POST',headers:HJ,
                    body:JSON.stringify({user_id:account?account.id:null,email,name:account?account.name:'—',role,...deviceInfo,...ipInfo,status:'failed'})
                }).catch(()=>{});
            }
        }catch(e){notify('Login failed','error');}
    };

    const logout=()=>{
        if(supabaseClient) supabaseClient.auth.signOut().catch(()=>{});
        setUser(null);
        localStorage.removeItem('rahama_session');
        localStorage.removeItem('pms_user');
        setView('login');
    };

    return <>
        {toast&&<Toast {...toast} onClose={()=>setToast(null)}/>}
        {view==='login'&&<Login onLogin={login}/>}
        {view==='dashboard'&&(CLASSIC_VIEW?<Dashboard user={user} onLogout={logout} notify={notify}/>:<StaffPortal user={user} onLogout={logout} notify={notify}/>)}
        {view==='supervisor'&&(CLASSIC_VIEW?<SuperDash user={user} onLogout={logout} notify={notify}/>:<StaffPortal user={user} onLogout={logout} notify={notify}/>)}
    </>;
}

                <p className="text-sm font-medium text-gray-500 tracking-wide uppercase">Staff Portal</p>
            </div>
            <div className="mb-6">
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Sign in as</label>
                <div className="grid grid-cols-2 gap-3">
                    {[['employee','fa-user','Employee'],['supervisor','fa-user-tie','Supervisor']].map(([r,ic,lb])=>
                        <button key={r} onClick={()=>setRole(r)}
                            className={`py-3 rounded-xl font-semibold transition-all ${role===r?'btn-green text-white shadow-lg':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                            <i className={`fas ${ic} mr-2`}/>{lb}
                        </button>
                    )}
                </div>
            </div>
            <div className="mb-4">
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Email</label>
                <div className="relative">
                    <i className="fas fa-envelope absolute left-4 top-3.5 text-gray-400"/>
                    <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
                        className="w-full pl-11 pr-4 py-3 border-2 border-gray-200 rounded-xl transition"
                        placeholder="your.email@rgcweinigeria.org"/>
                </div>
            </div>
            <div className="mb-6">
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Password</label>
                <div className="relative">
                    <i className="fas fa-lock absolute left-4 top-3.5 text-gray-400"/>
                    <input type={show?"text":"password"} value={pw} onChange={e=>setPw(e.target.value)}
                        onKeyPress={e=>e.key==='Enter'&&go()}

                        placeholder="Enter password"/>
                    <button onClick={()=>setShow(!show)} className="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600">
                        <i className={`fas fa-eye${show?'-slash':''}`}/>
                    </button>
                </div>
            </div>
            <button onClick={go} disabled={busy||!email||!pw}
                className="w-full btn-green text-white py-3.5 rounded-xl font-bold disabled:opacity-50">
                {busy?<><i className="fas fa-spinner fa-spin mr-2"/>Signing in...</>:<><i className="fas fa-sign-in-alt mr-2"/>Sign In</>}
            </button>
            <p className="text-center text-xs text-gray-400 mt-6">© 2025 RAHAMA Initiative</p>
        </div>
    </div>;
}

function ChangePw({user,onClose,notify}) {
    const [cur,setCur]=useState('');const [nw,setNw]=useState('');const [cf,setCf]=useState('');const [busy,setBusy]=useState(false);
    const go=async()=>{
        if(nw!==cf){notify('Passwords do not match','error');return;}
        if(nw.length<8){notify('Minimum 8 characters','error');return;}
        if(cur===nw){notify('New password must be different','error');return;}
        setBusy(true);
        try{
            if(!supabaseClient){notify('Auth unavailable — please reload the page','error');setBusy(false);return;}
            // Supabase Auth's updateUser() will change the password for
            // whoever holds the live session without asking for the old
            // one, so we re-authenticate with the current password first —
            // that stands in for the old RPC's "current password must
            // match" guard. The browser never handles the stored hash.
            const {error:verr}=await supabaseClient.auth.signInWithPassword({email:user.email,password:cur});
            if(verr){notify('Current password is incorrect','error');setBusy(false);return;}
            const {error:uerr}=await supabaseClient.auth.updateUser({password:nw});
            if(uerr){
                notify(uerr.message&&/8/.test(uerr.message)?'Password must be at least 8 characters':'Failed to update password','error');
                setBusy(false);return;
            }
            // updateUser() rotates the session tokens — persist the fresh
            // ones so the FMS handoff (and this session) keep working.
            const {data:sd}=await supabaseClient.auth.getSession();
            if(sd?.session){
                const nu={...user,access_token:sd.session.access_token,refresh_token:sd.session.refresh_token,expires_at:sd.session.expires_at,issuedAt:Date.now()};
                localStorage.setItem('rahama_session',JSON.stringify(nu));
                localStorage.setItem('pms_user',JSON.stringify(nu));
            }
            notify('Password changed successfully!');onClose();
        }catch(e){notify('Error changing password','error');}
        setBusy(false);
    };
    return <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div className="bg-white rounded-2xl p-6 max-w-md w-full animate-in">
            <div className="flex justify-between items-center mb-6">

            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-5"><p className="text-xs text-amber-700"><i className="fas fa-info-circle mr-1"/>Password must be at least 8 characters.</p></div>

                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">New Password</label><input type="password" value={nw} onChange={e=>setNw(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl" placeholder="New password"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Confirm New Password</label><input type="password" value={cf} onChange={e=>setCf(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl" placeholder="Confirm password"/>
                    {cf&&nw!==cf&&<p className="text-red-500 text-xs mt-1"><i className="fas fa-exclamation-triangle mr-1"/>Passwords don't match</p>}</div>

            </div>
        </div>
    </div>;
}

/* ==================== MONITORING & EVALUATION ====================
   Tracks project activity DELIVERY against the approved work plan.
   Deliberately independent of finance — bulk procurements and multi-month
   activities make spend a poor proxy for delivery. Grading uses RAHAMA's
   existing scale: <0.70 Unacceptable · 0.70–0.94 Meets Standard · ≥0.95 Outstanding
================================================================= */
const WP_STATUSES=['Not Started','On-Hold','Incomplete','Ongoing (Routine)','Ongoing (One-Off Activity)','Completed','Completed For Period','Delayed'];
const wpStatusColour=s=>({'Completed':'#059669','Completed For Period':'#10b981','Ongoing (Routine)':'#0284c7','Ongoing (One-Off Activity)':'#0284c7','Delayed':'#dc2626','Incomplete':'#e65100','On-Hold':'#7b1fa2','Not Started':'#6b7280'}[s]||'#6b7280');
const wpGrade=score=>{
    if(score>=0.95) return {label:'Outstanding',   colour:'#059669', cls:'bg-green-100 text-green-800'};
    if(score>=0.70) return {label:'Meets Standard',colour:'#e65100', cls:'bg-amber-100 text-amber-800'};
    return               {label:'Unacceptable', colour:'#dc2626', cls:'bg-red-100 text-red-700'};
};

/* Parse the uploaded workbook: locate the sheet + header row, forward-fill
   merged hierarchy cells, and read month markers into a planned-months array. */
function parseWorkPlanWorkbook(wb){
    const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const norm=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
    let best={rows:[],sheetName:null};
    for(const sheetName of wb.SheetNames){
        const grid=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:null,raw:true});
        let headerIdx=-1;
        for(let i=0;i<Math.min(grid.length,25);i++){
            const joined=(grid[i]||[]).map(norm).join('|').toLowerCase();
            if(joined.includes('sub-activit')&&joined.includes('type of activity')){headerIdx=i;break;}
        }
        if(headerIdx===-1) continue;
        const hdr=(grid[headerIdx]||[]).map(norm);
        const findCol=(...needles)=>hdr.findIndex(h=>{const l=h.toLowerCase();return needles.some(n=>l.includes(n));});
        const H={stage:findCol('project stage'),milestone:findCol('milestone','deliverable'),keyAct:findCol('key activit'),
                 subAct:findCol('sub-activit','sub activit'),type:findCol('type of activity'),totalMon:findCol('total month'),
                 dri:findCol('dri'),budget:hdr.findIndex(h=>h.toLowerCase()==='budget'),year:findCol('year'),months:{}};
        hdr.forEach((h,i)=>{const u=h.toUpperCase();if(MONTHS.includes(u))H.months[u]=i;});
        const rows=[];let curStage='',curMile='',curKey='';
        for(let i=headerIdx+1;i<grid.length;i++){
            const r=grid[i]||[];
            const val=c=>(c!=null&&c>=0)?norm(r[c]):'';
            const stage=val(H.stage),mile=val(H.milestone),key=val(H.keyAct);
            if(stage)curStage=stage; if(mile)curMile=mile; if(key)curKey=key;
            const sub=val(H.subAct),typ=val(H.type);
            if(!sub&&!typ) continue;
            if(!sub&&!curKey) continue;
            const planned=Object.keys(H.months).filter(m=>{const v=r[H.months[m]];return v!=null&&String(v).trim()!=='';});
            const budgetRaw=H.budget>=0?r[H.budget]:null;
            rows.push({stage:curStage,milestone:curMile,keyActivity:curKey,subActivity:sub||curKey,
                activityType:typ||'One off',dri:val(H.dri),
                totalMonths:(()=>{const n=parseInt(val(H.totalMon));return isNaN(n)?(planned.length||1):n;})(),
                plannedMonths:planned,
                budgetRef:(typeof budgetRaw==='number')?budgetRaw:null,
                budgetNote:(typeof budgetRaw==='string')?norm(budgetRaw):'',
                year:val(H.year),include:true});
        }
        if(rows.length>best.rows.length) best={rows,sheetName};
    }
    return best;
}
function MandEDashboard({plans,counts,acts,notify,onOpenPlan}) {
    // acts = { [work_plan_id]: [activities] } — passed in from parent, fetched once
    const projectStats = plans.map(p=>{
        const list = acts[p.id]||[];
        const done = list.filter(a=>['Completed','Completed For Period'].includes(a.current_status)&&a.verification_status==='verified').length;
        const total = list.length||counts[p.id]||0;
        const score = total?done/total:0;
        return {...p, total, done, score, grade:wpGrade(score)};
    });

    const allActs = Object.values(acts).flat();
    const totalActs = allActs.length;
    const totalDone = allActs.filter(a=>['Completed','Completed For Period'].includes(a.current_status)&&a.verification_status==='verified').length;
    const overallScore = totalActs?totalDone/totalActs:0;
    const overallGrade = wpGrade(overallScore);
    const awaiting = allActs.filter(a=>a.verification_status==='submitted').length;

    // Status breakdown for donut
    const statusCounts = {};
    allActs.forEach(a=>{const s=a.current_status||'Not Started';statusCounts[s]=(statusCounts[s]||0)+1;});
    const statusEntries = WP_STATUSES.filter(s=>statusCounts[s]).map(s=>({status:s,count:statusCounts[s],color:wpStatusColour(s)}));

    // Build donut arc segments
    const R=70, C=2*Math.PI*R;
    let acc=0;
    const arcs = statusEntries.map(e=>{
        const frac = totalActs? e.count/totalActs : 0;
        const dash = frac*C;
        const arc = {...e, dashArray:`${dash} ${C-dash}`, dashOffset: -acc*C};
        acc += frac;
        return arc;
    });

    return <div className="space-y-6">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Projects</p><p className="text-3xl font-extrabold text-gray-800 mt-1">{plans.length}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Total Activities</p><p className="text-3xl font-extrabold text-gray-800 mt-1">{totalActs}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Awaiting Verification</p><p className="text-3xl font-extrabold text-amber-600 mt-1">{awaiting}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Overall Grade</p>
                <p className="text-lg font-extrabold mt-2" style={{color:overallGrade.colour}}>{overallGrade.label}</p>
                <p className="text-xs text-gray-400">{Math.round(overallScore*100)}% complete</p></div>
        </div>

        <div className="grid md:grid-cols-3 gap-6">
            {/* Donut chart */}
            <div className="glass rounded-2xl p-6 md:col-span-1 flex flex-col items-center">
                <h3 className="font-bold text-gray-800 mb-4 self-start"><i className="fas fa-chart-pie text-cyan-600 mr-2"/>Activity Status</h3>
                <svg viewBox="0 0 180 180" width="180" height="180">
                    <circle cx="90" cy="90" r={R} fill="none" stroke="#f3f4f6" strokeWidth="24"/>
                    {arcs.map((a,i)=><circle key={i} cx="90" cy="90" r={R} fill="none" stroke={a.color} strokeWidth="24"
                        strokeDasharray={a.dashArray} strokeDashoffset={a.dashOffset} transform="rotate(-90 90 90)"/>)}
                    <text x="90" y="85" textAnchor="middle" fontSize="24" fontWeight="800" fill="#1f2937">{Math.round(overallScore*100)}%</text>
                    <text x="90" y="105" textAnchor="middle" fontSize="10" fill="#9ca3af">VERIFIED</text>
                </svg>
                <div className="grid grid-cols-1 gap-1.5 mt-4 w-full">
                    {statusEntries.map((e,i)=><div key={i} className="flex items-center justify-between text-xs">
                        <span className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full" style={{background:e.color}}/>{e.status}</span>
                        <span className="font-bold text-gray-600">{e.count}</span>
                    </div>)}
                </div>
            </div>

            {/* Per-project completion bars */}
            <div className="glass rounded-2xl p-6 md:col-span-2">
                <h3 className="font-bold text-gray-800 mb-4"><i className="fas fa-chart-bar text-indigo-600 mr-2"/>Completion by Project</h3>
                <div className="space-y-4">
                   {projectStats.map(p=><div key={p.id}>
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-sm font-semibold text-gray-700 truncate cursor-pointer" onClick={()=>onOpenPlan(p)}>{p.plan_name}</span>
                            <span className="text-xs font-bold" style={{color:p.grade.colour}}>{Math.round(p.score*100)}% · {p.grade.label}</span>
                        </div>
                        <div className="cbar cursor-pointer" onClick={()=>onOpenPlan(p)}><div className="cbar-fill" style={{width:`${p.score*100}%`,background:p.grade.colour}}/></div>
                        <p className="text-xs text-gray-400 mt-1">{p.done}/{p.total} activities verified</p>
                    </div>)}
                    {projectStats.length===0&&<p className="text-center text-gray-400 py-6">No work plans yet</p>}
                </div>
            </div>
        </div>
    </div>;
}

/* ==================== M&E DATA — TOOLS, DATASETS, INDICATORS ====================
   A project can have several reporting tools (ECHO has more than one form;
   ASCENT has its own). Each tool holds its own uploaded datasets and its own
   indicator definitions.

   SPACE: only the columns M&E selects are stored, not all 149 in a Kobo export.
   Row data is kept as JSON per dataset with a row cap, and usage is shown so
   the 500MB database limit stays visible.
================================================================= */
const ME_AGGS=[{v:'sum',l:'Sum'},{v:'count',l:'Count of rows'},{v:'avg',l:'Average'},{v:'max',l:'Maximum'},{v:'nonblank',l:'Count where filled'}];
const ME_ROW_CAP=3000;
const meNum=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isNaN(n)?0:n;};

/* Profile an uploaded sheet: split columns into numeric (indicator candidates)
   and low-cardinality (disaggregation candidates). */
function profileColumns(rows){
    if(!rows.length) return [];
    const cols=Object.keys(rows[0]);
    return cols.map(name=>{
        const vals=rows.map(r=>r[name]).filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='');
        const numeric=vals.length?vals.filter(v=>!isNaN(parseFloat(String(v).replace(/,/g,'')))).length/vals.length>0.8:false;
        const uniq=new Set(vals.map(v=>String(v))).size;
        return {name,filled:vals.length,numeric,uniq,
            kind: numeric?'numeric' : (uniq>0&&uniq<=30?'category':'text')};
    });
}

function MEData({user,notify,onBack,readOnlyView}) {
    const [tools,setTools]=useState([]);
    const [plans,setPlans]=useState([]);
    const [loading,setLoading]=useState(true);
    const [err,setErr]=useState(null);
    const [sel,setSel]=useState(null);
    const [showNew,setShowNew]=useState(false);
    const [nName,setNName]=useState('');const [nProj,setNProj]=useState('');

    const load=async()=>{setLoading(true);setErr(null);
        try{
            const t=await fetch(`${SB}/rest/v1/me_tools?order=created_at.desc`,{headers:H});
            if(!t.ok) throw new Error('M&E data tables not found — run the SQL setup first.');
            setTools(await t.json()||[]);
            const p=await fetch(`${SB}/rest/v1/work_plans?select=id,plan_name,project_code`,{headers:H}).then(r=>r.json());
            setPlans(Array.isArray(p)?p:[]);
        }catch(e){setErr(e.message);}
        setLoading(false);};
    useEffect(()=>{load();},[]);

    if(sel) return <METool tool={sel} user={user} notify={notify} readOnlyView={readOnlyView} onBack={()=>{setSel(null);load();}}/>;

    const createTool=async()=>{
        if(!nName.trim()||!nProj.trim()){notify('Tool name and project code are required','error');return;}
        const r=await fetch(`${SB}/rest/v1/me_tools`,{method:'POST',headers:HJ,
            body:JSON.stringify({tool_name:nName.trim(),project_code:nProj.trim(),created_by:user.name})});
        if(r.ok){notify('Tool created');setShowNew(false);setNName('');setNProj('');load();}
        else notify('Could not create tool','error');
    };

    const byProject={};tools.forEach(t=>{(byProject[t.project_code]=byProject[t.project_code]||[]).push(t);});

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <div className="flex flex-wrap justify-between items-center gap-4">
                <div><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Data &amp; Indicators</h1>
                    <p className="text-gray-500 mt-1">Reporting tools, uploaded datasets and indicator dashboards</p></div>
                {!readOnlyView&&<button onClick={()=>setShowNew(true)} className="btn-green text-white px-5 py-3 rounded-xl font-bold text-sm"><i className="fas fa-plus mr-2"/>New Reporting Tool</button>}
            </div>
        </div>

function METool({tool,user,notify,onBack,readOnlyView}) {

    const load=async()=>{setLoading(true);
        try{
            // These three requests don't depend on each other — running them
            // concurrently instead of one after another cuts the wait roughly
            // to the slowest single round-trip instead of the sum of all three,
            // which matters most on a slow connection.
            const wpStatsPromise=(async()=>{
                try{
                    const wp=await fetch(`${SB}/rest/v1/work_plans?select=id&project_code=eq.${encodeURIComponent(tool.project_code)}`,{headers:H}).then(r=>r.json());

                        const acts=await fetch(`${SB}/rest/v1/work_plan_activities?select=current_status,verification_status&work_plan_id=in.(${ids})`,{headers:H}).then(r=>r.json());
                        const a=Array.isArray(acts)?acts:[];
                        return {total:a.length,
                            verified:a.filter(x=>['Completed','Completed For Period'].includes(x.current_status)&&x.verification_status==='verified').length,
                            awaiting:a.filter(x=>x.verification_status==='submitted').length};

            })();
            const datasetsPromise=fetch(`${SB}/rest/v1/me_datasets?tool_id=eq.${tool.id}&order=period_label.desc`,{headers:H}).then(r=>r.json()).catch(()=>[]);
            const indicatorsPromise=fetch(`${SB}/rest/v1/me_indicators?tool_id=eq.${tool.id}&order=sort_order.asc`,{headers:H}).then(r=>r.json()).catch(()=>[]);

            const [wpStatsResult,dRaw,indRaw]=await Promise.all([wpStatsPromise,datasetsPromise,indicatorsPromise]);
            if(wpStatsResult) setWpStats(wpStatsResult);
            const ds=Array.isArray(dRaw)?dRaw:[];
            setDatasets(ds);
            setIndicators(Array.isArray(indRaw)?indRaw:[]);
            const all=[];
            ds.forEach(x=>{try{const parsed=JSON.parse(x.rows_json||'[]');parsed.forEach(r=>all.push({...r,__period:x.period_label,__ds:x.id}));}catch(e){}});
            setRows(all);
        }catch(e){}
        setLoading(false);};
    useEffect(()=>{load();},[tool.id]);

    const tabs=[['dashboard','Dashboard','fa-chart-pie'],['quality','Data Quality','fa-shield-halved'],['data','Data','fa-table'],['indicators','Indicators','fa-bullseye'],['uploads','Uploads','fa-upload']];

            <p className="text-gray-500 mt-1">{tool.project_code} · {datasets.length} dataset{datasets.length!==1?'s':''} · {rows.length} rows · {indicators.length} indicator{indicators.length!==1?'s':''}</p>
            <div className="flex flex-wrap gap-2 mt-4">
                {tabs.map(([k,l,ic])=><button key={k} onClick={()=>setTab(k)}
                    className={`px-4 py-2 rounded-xl text-sm font-bold transition ${tab===k?'btn-green text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                    <i className={`fas ${ic} mr-2`}/>{l}</button>)}
            </div>
        </div>

        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>:<>

            {tab==='quality'    && <MEQuality rows={rows} indicators={indicators} datasets={datasets}/>}
            {tab==='data'       && <MEDataTable rows={rows} datasets={datasets} notify={notify} onSaved={load} readOnlyView={readOnlyView}/>}
            {tab==='indicators' && <MEIndicators tool={tool} indicators={indicators} rows={rows} user={user} notify={notify} onSaved={load} readOnlyView={readOnlyView}/>}

/* ---- Indicator computation ---- */
function computeIndicator(ind,rows){
    const src=ind.source_column;
    let vals=rows;
    if(ind.filter_column&&ind.filter_value) vals=vals.filter(r=>String(r[ind.filter_column]??'')===ind.filter_value);
    if(ind.aggregation==='count') return vals.length;
    if(ind.aggregation==='nonblank') return vals.filter(r=>String(r[src]??'').trim()!=='').length;
    const nums=vals.map(r=>meNum(r[src]));
    if(!nums.length) return 0;
    if(ind.aggregation==='avg') return Math.round((nums.reduce((a,b)=>a+b,0)/nums.length)*10)/10;
    if(ind.aggregation==='max') return Math.max(...nums);
    return nums.reduce((a,b)=>a+b,0);
}

function periodProgress(tool){

/* Automated data quality checks. These are the errors that quietly
   ruin an M&E report: columns that imported empty, indicators that
   compute to zero, duplicate submissions, and extreme outliers. */
function runQualityChecks(rows,indicators,datasets){
    const issues=[];
    if(!rows.length) return issues;
    const prof=profileColumns(rows);

    // Columns that are entirely empty
    prof.filter(col=>!col.name.startsWith('__')&&col.filled===0).forEach(col=>{
        issues.push({sev:'high',type:'Empty column',
            msg:`"${col.name}" has no values in any of the ${rows.length} rows.`,
            fix:'Either the export dropped it or the form field was never filled. Untick it on upload, or fix the form.'});
    });

    // Columns mostly empty
    prof.filter(col=>!col.name.startsWith('__')&&col.filled>0&&col.filled/rows.length<0.25).forEach(col=>{
        issues.push({sev:'low',type:'Sparse column',
            msg:`"${col.name}" is filled in only ${col.filled} of ${rows.length} rows (${Math.round(col.filled/rows.length*100)}%).`,
            fix:'Expected if the question is conditional. Otherwise field officers may be skipping it.'});
    });

    // Indicators computing to zero
    indicators.forEach(ind=>{
        const v=computeIndicator(ind,rows);
        if(v===0) issues.push({sev:'high',type:'Indicator reads zero',
            msg:`"${ind.indicator_name}" computes to 0 from column "${ind.source_column||'(rows)'}".`,
            fix:'Often a calculated field that exported blank. Check the source column in the Data tab and repoint the indicator if needed.'});
    });

    // Numeric outliers — more than 3 standard deviations from the mean
    prof.filter(col=>col.kind==='numeric'&&!col.name.startsWith('__')&&col.filled>8).forEach(col=>{
        const vals=rows.map(r=>meNum(r[col.name])).filter(v=>v!==0);
        if(vals.length<8) return;
        const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
        const sd=Math.sqrt(vals.reduce((a,b)=>a+Math.pow(b-mean,2),0)/vals.length);
        if(sd===0) return;
        const out=vals.filter(v=>Math.abs(v-mean)>3*sd);
        if(out.length) issues.push({sev:'medium',type:'Possible outlier',
            msg:`"${col.name}" has ${out.length} value${out.length!==1?'s':''} far outside the normal range (highest ${Math.max(...out).toLocaleString()}, typical ${Math.round(mean).toLocaleString()}).`,
            fix:'Usually a typo — an extra digit. Check those rows in the Data tab.'});
    });

    // Duplicate submissions
    const keys={};
    rows.forEach(r=>{
        const k=Object.keys(r).filter(x=>!x.startsWith('__')).map(x=>String(r[x]??'')).join('|');
        keys[k]=(keys[k]||0)+1;
    });
    const dupes=Object.values(keys).filter(n=>n>1).reduce((a,b)=>a+(b-1),0);
    if(dupes) issues.push({sev:'high',type:'Duplicate rows',
        msg:`${dupes} row${dupes!==1?'s appear':' appears'} to be an exact duplicate of another.`,
        fix:'Often a form submitted twice on a poor connection. Delete the copies in the Data tab.'});

    // Same period uploaded more than once
    const per={};
    (datasets||[]).forEach(d=>{per[d.period_label]=(per[d.period_label]||0)+1;});
    Object.entries(per).filter(([,n])=>n>1).forEach(([lbl,n])=>{
        issues.push({sev:'medium',type:'Period uploaded twice',
            msg:`${n} datasets are labelled "${lbl}", so its figures are counted more than once.`,
            fix:'Delete the older upload on the Uploads tab unless they are genuinely different forms.'});
    });

    return issues;
}

function scanQuality(rows,indicators,datasets){
    const issues=[];
    if(!rows.length) return issues;
    const cols=Object.keys(rows[0]).filter(k=>!k.startsWith('__'));

    // Empty / near-empty columns
    cols.forEach(cn=>{
        const filled=rows.filter(r=>String(r[cn]??'').trim()!=='').length;
        const pct=Math.round(filled/rows.length*100);
        if(filled===0) issues.push({sev:'high',type:'Empty column',detail:`"${cn}" has no values in any of the ${rows.length} rows`,fix:'Untick this column on future uploads, or check the form logic.'});
        else if(pct<10) issues.push({sev:'low',type:'Sparse column',detail:`"${cn}" is filled in only ${pct}% of rows (${filled}/${rows.length})`,fix:'Expected if conditional; otherwise check skip logic.'});
    });

    // Indicators computing to zero — usually a calculated column that didn't export
    indicators.forEach(i=>{
        const v=computeIndicator(i,rows);
        if(v===0) issues.push({sev:'high',type:'Indicator is zero',detail:`"${i.indicator_name}" computes to 0 from column "${i.source_column||'rows'}"`,fix:'Often a calculated field that exported blank. Check the source column in the Data tab.'});
    });

    // Duplicate submissions
    const seen={},dupes=[];
    rows.forEach((r,idx)=>{
        const key=cols.slice(0,8).map(cn=>String(r[cn]??'')).join('|');
        if(seen[key]!==undefined) dupes.push(idx+1); else seen[key]=idx;
    });
    if(dupes.length) issues.push({sev:'high',type:'Duplicate rows',detail:`${dupes.length} row${dupes.length!==1?'s appear':' appears'} to duplicate an earlier submission (rows ${dupes.slice(0,8).join(', ')}${dupes.length>8?'…':''})`,fix:'Check for double submission in the field, then delete duplicates in the Data tab.'});

    // Numeric outliers
    cols.forEach(cn=>{
        const nums=rows.map(r=>r[cn]).filter(v=>v!==null&&v!==''&&!isNaN(parseFloat(v))).map(v=>parseFloat(v));
        if(nums.length<8) return;
        const mean=nums.reduce((a,b)=>a+b,0)/nums.length;
        const sd=Math.sqrt(nums.reduce((s,n)=>s+Math.pow(n-mean,2),0)/nums.length);
        if(sd===0) return;
        const out=nums.filter(n=>Math.abs(n-mean)>3*sd);
        if(out.length) issues.push({sev:'medium',type:'Possible outlier',detail:`"${cn}" has ${out.length} value${out.length!==1?'s':''} far outside the normal range (${out.slice(0,4).map(n=>n.toLocaleString()).join(', ')}${out.length>4?'…':''}; typical is around ${Math.round(mean).toLocaleString()})`,fix:'Often a typing error — an extra digit. Verify against the paper record.'});
    });

    // Negative values where they make no sense
    cols.forEach(cn=>{
        const neg=rows.filter(r=>{const n=parseFloat(r[cn]);return !isNaN(n)&&n<0;}).length;
        if(neg) issues.push({sev:'high',type:'Negative value',detail:`"${cn}" contains ${neg} negative value${neg!==1?'s':''}`,fix:'Counts should never be negative. Correct in the Data tab.'});
    });

    // Datasets never cleaned
    (datasets||[]).forEach(d=>{
        if(!d.cleaned) issues.push({sev:'low',type:'Not yet reviewed',detail:`Dataset "${d.file_name}" (${d.period_label}) has not been through data cleaning`,fix:'Open the Data tab and review before reporting.'});
    });

    return issues;
}

function MEQuality({rows,indicators,datasets}) {
    const issues=useMemo(()=>scanQuality(rows,indicators,datasets),[rows,indicators,datasets]);
    const [filter,setFilter]=useState('all');
    if(!rows.length) return <div className="glass rounded-2xl p-12 text-center text-gray-400">
        <i className="fas fa-shield-halved text-4xl mb-3"/><p className="font-semibold">No data to check yet</p></div>;

    const counts={high:issues.filter(i=>i.sev==='high').length,medium:issues.filter(i=>i.sev==='medium').length,low:issues.filter(i=>i.sev==='low').length};
    const shown=filter==='all'?issues:issues.filter(i=>i.sev===filter);
    const sevStyle={high:{bg:'#FEF2F2',bd:'#FECACA',fg:'#B91C1C',ic:'fa-circle-exclamation',lbl:'Must fix'},
                    medium:{bg:'#FFFBEB',bd:'#FDE68A',fg:'#B45309',ic:'fa-triangle-exclamation',lbl:'Check'},
                    low:{bg:'#F8FAFC',bd:'#E2E8F0',fg:'#64748B',ic:'fa-circle-info',lbl:'Note'}};

    // A simple confidence score so M&E can see the direction of travel
    const score=Math.max(0,100-(counts.high*12+counts.medium*5+counts.low*2));

    return <div className="space-y-4">
        <div className="glass rounded-2xl p-5">
            <div className="flex flex-wrap items-center gap-5">
                <div>
                    <p className="text-xs font-bold text-gray-400 uppercase">Data confidence</p>
                    <p className="text-4xl font-extrabold mt-1" style={{color:score>=80?'#059669':score>=55?'#C9A227':'#B91C1C'}}>{score}<span className="text-lg text-gray-300">/100</span></p>
                </div>
                <div className="flex-1 min-w-0">
                    <div className="cbar"><div className="cbar-fill" style={{width:`${score}%`,background:score>=80?'#059669':score>=55?'#C9A227':'#B91C1C'}}/></div>
                    <p className="text-xs text-gray-400 mt-2">{issues.length} issue{issues.length!==1?'s':''} found across {rows.length} rows. Fix the red ones before reporting to a donor.</p>
                </div>
            </div>
        </div>

        <div className="flex flex-wrap gap-2">
            {[['all','All',issues.length],['high','Must fix',counts.high],['medium','Check',counts.medium],['low','Notes',counts.low]].map(([k,l,n])=>
                <button key={k} onClick={()=>setFilter(k)}
                    className={`px-4 py-2 rounded-xl text-sm font-bold ${filter===k?'btn-green text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>{l} ({n})</button>)}
        </div>

        {shown.length===0?<div className="glass rounded-2xl p-10 text-center">
            <i className="fas fa-circle-check text-4xl mb-3" style={{color:'#059669'}}/>
            <p className="font-bold text-gray-700">Nothing flagged here</p>
            <p className="text-sm text-gray-400 mt-1">These checks are mechanical — they can't catch every problem, so still read the data.</p></div>
        :<div className="space-y-2">{shown.map((iss,i)=>{const s=sevStyle[iss.sev];
            return <div key={i} style={{background:s.bg,border:`1px solid ${s.bd}`}} className="rounded-xl p-4">
                <div className="flex items-start gap-3">
                    <i className={`fas ${s.ic} mt-0.5`} style={{color:s.fg}}/>
                    <div className="min-w-0 flex-1">
                        <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs font-bold uppercase" style={{color:s.fg}}>{iss.type}</span>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{background:s.fg,color:'#fff'}}>{s.lbl}</span>
                        </div>
                        <p className="text-sm text-gray-700 mt-1">{iss.detail}</p>
                        <p className="text-xs text-gray-500 mt-1.5"><i className="fas fa-lightbulb mr-1"/>{iss.fix}</p>
                    </div>
                </div>
            </div>;})}</div>}
    </div>;
}

h2{font-size:13px;border-bottom:2px solid #C9A227;padding-bottom:5px;margin-top:26px;color:#285B3C;text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
th{background:#285B3C;color:#fff;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase}
td{padding:7px 10px;border-bottom:1px solid #e5e5e5}
tr:nth-child(even) td{background:#fafaf8}
.lbl{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.5px}</style></head><body>
<button class="no-print" onclick="window.print()" style="margin-bottom:18px;padding:10px 22px;background:#285B3C;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600">🖨 Print / Save as PDF</button>
<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #285B3C;padding-bottom:14px;margin-bottom:16px">
 <div style="display:flex;align-items:center;gap:14px">
  <img src="RAHAMA Empowerment Logo Design (3).png" style="width:58px;height:58px;object-fit:contain" onerror="this.style.display='none'">
  <div><h1>INDICATOR PERFORMANCE REPORT</h1>
  <div style="font-size:12px;color:#555;margin-top:3px">RAHAMA Girl Child &amp; Women Empowerment Initiative</div></div>
 </div>
 <div style="text-align:right;font-size:11px;color:#777"><div class="lbl">Generated</div>
  <b>${new Date().toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'})}</b></div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px">
 <div><div class="lbl">Tool</div><b>${esc(tool?tool.tool_name:'—')}</b></div>
 <div><div class="lbl">Project</div><b>${esc(tool?tool.project_code:'—')}</b></div>
 <div><div class="lbl">Period</div><b>${esc(periodFilter==='all'?'All periods':periodFilter)}</b></div>
 <div><div class="lbl">Submissions</div><b>${filtered.length}</b></div>
</div>
${elapsed!==null?`<p style="font-size:12px;color:#555;margin-top:10px">Reporting period is <b>${Math.round(elapsed*100)}%</b> elapsed (${esc(tool.period_start)} → ${esc(tool.period_end)}). Targets below are assessed against expected pace.</p>`:''}
<h2>Indicator Performance</h2>
<table><thead><tr><th>Indicator</th><th style="text-align:right">Achieved</th><th style="text-align:right">Target</th>
${elapsed!==null?'<th style="text-align:right">Expected by now</th>':''}<th style="text-align:right">% of target</th><th>Status</th></tr></thead><tbody>
${computed.map(i=>{
  const st=!i.target?'No target':(i.phased?(i.onTrackPct>=100?'On track':i.onTrackPct>=80?'Slightly behind':'Behind pace'):(i.pct>=95?'Achieved':i.pct>=70?'In progress':'Low'));
  const col=st==='On track'||st==='Achieved'?'#285B3C':st==='No target'?'#999':st.indexOf('Behind')>=0||st==='Low'?'#B45309':'#C9A227';
  return `<tr><td><b>${esc(i.indicator_name)}</b></td>
   <td style="text-align:right"><b>${i.value.toLocaleString()}</b></td>
   <td style="text-align:right">${i.target?Number(i.target).toLocaleString():'—'}</td>
   ${elapsed!==null?`<td style="text-align:right;color:#777">${i.expected!=null?i.expected.toLocaleString():'—'}</td>`:''}
   <td style="text-align:right">${i.pct!=null?i.pct+'%':'—'}</td>
   <td style="color:${col};font-weight:700">${st}</td></tr>`;}).join('')}
</tbody></table>
${disagg&&g1&&g1.length?`<h2>Breakdown by ${esc(disagg)}</h2>
<table><thead><tr><th>${esc(disagg)}</th><th style="text-align:right">Rows</th>
${computed.map(i=>`<th style="text-align:right">${esc(i.indicator_name)}</th>`).join('')}</tr></thead><tbody>
${g1.map(g=>{const gr=rowsFor(g);return `<tr><td><b>${esc(g)}</b></td><td style="text-align:right">${gr.length}</td>
 ${computed.map(i=>`<td style="text-align:right">${computeIndicator(i,gr).toLocaleString()}</td>`).join('')}</tr>`;}).join('')}
</tbody></table>`:''}
<h2>Notes</h2>
<div style="border:1px solid #ddd;border-radius:6px;min-height:90px;padding:12px;color:#999;font-size:12px">Space for M&amp;E commentary — key achievements, challenges and actions for the next period.</div>
<div style="margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:30px">
 <div><div class="lbl">Prepared by (M&amp;E)</div><div style="height:44px;border-bottom:1px solid #333;margin-top:6px"></div></div>
 <div><div class="lbl">Reviewed by</div><div style="height:44px;border-bottom:1px solid #333;margin-top:6px"></div></div>
</div>
<div style="margin-top:30px;border-top:1px solid #eee;padding-top:10px;font-size:10px;color:#999">RAHAMA M&amp;E — Indicator Performance Report — Confidential</div>
</body></html>`;
    const b=new Blob([html],{type:'text/html'});
    const u=URL.createObjectURL(b);
    const a=document.createElement('a');
    a.href=u;a.download=`Indicator_Report_${(tool?tool.tool_name:'tool').slice(0,30).replace(/[^a-z0-9]/gi,'_')}.html`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
}

/* ---- Data quality scanner ----
   Generic checks only — the system can't know clinical logic, but it can
   flag the mechanical faults that silently corrupt reporting: columns that
   never got filled, indicators that compute to zero, duplicate submissions,
   and values far outside the normal range. */
function MEDashboard({rows,indicators,datasets,tool,notify,wpStats}) {
    const [disagg,setDisagg]=useState('');
    const [disagg2,setDisagg2]=useState('');
    const [periodFilter,setPeriodFilter]=useState('all');
    const periods=[...new Set(datasets.map(d=>d.period_label))].sort().reverse();
    const filtered=periodFilter==='all'?rows:rows.filter(r=>r.__period===periodFilter);
    const elapsed=periodProgress(tool);

    if(!indicators.length) return <div className="glass rounded-2xl p-12 text-center text-gray-400">
        <i className="fas fa-bullseye text-4xl mb-3"/><p className="font-semibold">No indicators defined yet</p>
        <p className="text-sm mt-1">Go to the Indicators tab to map columns from your data to indicators.</p></div>;

    const catCols=filtered.length?profileColumns(filtered.slice(0,300)).filter(c=>c.kind==='category'&&!c.name.startsWith('__')).map(c=>c.name):[];

    const computed=indicators.map(ind=>{
        const value=computeIndicator(ind,filtered);
        const target=ind.target?Number(ind.target):null;
        const pct=target?Math.round(value/target*100):null;
        // Time-phased: what SHOULD have been achieved by now
        const phased=(target&&elapsed!==null&&ind.timephased!==false);
        const expected=phased?Math.round(target*elapsed):null;
        const onTrackPct=phased&&expected>0?Math.round(value/expected*100):null;
        return {...ind,value,target,pct,expected,onTrackPct,phased};
    });
    const grandTotal=computed.reduce((s,i)=>s+i.value,0);

    const groups={};
    computed.forEach(i=>{ if(i.chart_group){(groups[i.chart_group]=groups[i.chart_group]||[]).push(i);} });
    const donutGroups=Object.entries(groups).filter(([,v])=>v.length>1);

    const trend=periods.slice().reverse().map(p=>{
        const pr=rows.filter(r=>r.__period===p);
        return {period:p, values:indicators.map(i=>computeIndicator(i,pr))};
    });

    const g1=disagg?[...new Set(filtered.map(r=>String(r[disagg]??'—')))].sort():[];
    const g2=disagg2?[...new Set(filtered.map(r=>String(r[disagg2]??'—')))].sort():[];

    // Status colour driven by pace, not raw percentage
    const statusOf=i=>{
        if(!i.target) return {c:'#9CA3AF',l:'No target'};
        if(i.phased){
            if(i.onTrackPct>=100) return {c:ME_GREEN,l:'On track'};
            if(i.onTrackPct>=80)  return {c:ME_GOLD, l:'Slightly behind'};
            return {c:'#B45309',l:'Behind pace'};
        }
        if(i.pct>=95) return {c:ME_GREEN,l:'Achieved'};
        if(i.pct>=70) return {c:ME_GOLD, l:'In progress'};
        return {c:'#B45309',l:'Low'};
    };

    return <div className="space-y-5">
        <div style={{background:ME_GREEN}} className="rounded-2xl p-5 flex flex-wrap items-center gap-4">
            <img src="RAHAMA Empowerment Logo Design (3).png" alt="" style={{width:'46px',height:'46px',objectFit:'contain',background:'#fff',borderRadius:'10px',padding:'4px'}}
                 onError={e=>{e.target.style.display='none';}}/>
            <div className="flex-1 min-w-0">
                <p className="text-white font-bold">{tool?tool.tool_name:'Indicator dashboard'}</p>
                <p className="text-xs" style={{color:'#C8E0CE'}}>{tool?tool.project_code+' · ':''}{filtered.length} rows · {indicators.length} indicators
                    {elapsed!==null?` · ${Math.round(elapsed*100)}% through the period`:''}</p>
            </div>
            <div className="flex flex-wrap gap-2">
                <button onClick={()=>downloadIndicatorReport({tool,computed,filtered,disagg,g1,elapsed,periodFilter})}
                    className="px-4 py-2 rounded-xl text-sm font-bold" style={{background:ME_GOLD,color:'#3A2A00'}}>
                    <i className="fas fa-file-arrow-down mr-2"/>Report</button>
                <select value={periodFilter} onChange={e=>setPeriodFilter(e.target.value)}
                    className="px-3 py-2 rounded-xl text-sm font-semibold border-0" style={{background:'#ffffff22',color:'#fff'}}>
                    <option value="all" style={{color:'#111'}}>All periods</option>
                    {periods.map(p=><option key={p} value={p} style={{color:'#111'}}>{p}</option>)}
                </select>
            </div>
        </div>

        {elapsed===null&&computed.some(i=>i.target)&&
            <div className="bg-amber-50 border-2 border-amber-200 rounded-xl p-4">
                <p className="text-sm text-amber-800"><i className="fas fa-clock mr-2"/><strong>Targets aren't time-phased.</strong> Set a start and end date on the Settings tab and the dashboard will show whether you're on pace, not just the raw percentage.</p>
            </div>}

        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            {computed.map((ind,i)=>{const st=statusOf(ind);return <div key={ind.id} className="glass rounded-xl p-4 stat"
                style={{borderLeft:`3px solid ${st.c}`}}>
                <p className="text-xs text-gray-500 truncate" title={ind.indicator_name}>{ind.indicator_name}</p>
                <p className="text-2xl font-extrabold text-gray-800 mt-1">{ind.value.toLocaleString()}
                    {ind.unit&&<span className="text-xs text-gray-400 font-medium ml-1">{ind.unit}</span>}</p>
                {ind.target?<>
                    <div className="cbar mt-2" style={{position:'relative'}}>
                        <div className="cbar-fill" style={{width:`${Math.min(100,ind.pct)}%`,background:st.c}}/>
                        {ind.phased&&<div style={{position:'absolute',top:'-2px',bottom:'-2px',left:`${Math.min(100,Math.round(elapsed*100))}%`,width:'2px',background:'#374151'}} title="Expected pace"/>}
                    </div>
                    <p className="text-xs mt-1" style={{color:st.c,fontWeight:600}}>{st.l}</p>
                    <p className="text-xs text-gray-400">{ind.pct}% of {Number(ind.target).toLocaleString()}
                        {ind.phased?` · expected ${ind.expected.toLocaleString()} by now`:''}</p>
                </>:<p className="text-xs text-gray-300 mt-2">No target</p>}
            </div>;})}
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="glass rounded-2xl p-5">
                <p className="font-bold text-gray-800 text-sm mb-1">Indicator share</p>
                <p className="text-xs text-gray-400 mb-3">{grandTotal.toLocaleString()} across all indicators</p>
                <MEChart type="doughnut" labels={computed.map(i=>i.indicator_name)} data={computed.map(i=>i.value)} height={190}/>
                <MELegend labels={computed.map(i=>i.indicator_name)} values={computed.map(i=>i.value)} total={grandTotal}/>
            </div>

            <div className="glass rounded-2xl p-5">
                <p className="font-bold text-gray-800 text-sm mb-1">{elapsed!==null?'Achieved vs expected by now':'Progress against target'}</p>
                <p className="text-xs text-gray-400 mb-3">{elapsed!==null?'Grey bar is the pace you should be at':'Percent achieved per indicator'}</p>
                {computed.some(i=>i.target)?
                    (elapsed!==null
                    ? <MEChart type="bar"
                        labels={computed.filter(i=>i.target).map(i=>i.indicator_name)}
                        data={[
                            {label:'Achieved',data:computed.filter(i=>i.target).map(i=>i.value),backgroundColor:ME_GREEN,borderRadius:4,maxBarThickness:18},
                            {label:'Expected by now',data:computed.filter(i=>i.target).map(i=>i.expected??0),backgroundColor:'#D1D5DB',borderRadius:4,maxBarThickness:18}
                        ]}
                        height={Math.max(170,computed.filter(i=>i.target).length*44+40)} horizontal={true}/>
                    : <MEChart type="bar" horizontal={true}
                        labels={computed.filter(i=>i.target).map(i=>i.indicator_name)}
                        data={computed.filter(i=>i.target).map(i=>i.pct)}
                        colors={computed.filter(i=>i.target).map(i=>statusOf(i).c)}
                        height={Math.max(160,computed.filter(i=>i.target).length*38+40)}/>)
                :<p className="text-center text-gray-300 text-xs py-6">Set targets on your indicators to see this chart</p>}
            </div>
        </div>

        {donutGroups.map(([g,list])=>{
            const tot=list.reduce((s,i)=>s+i.value,0);
            const ctype=list[0].chart_type==='bar'?'bar':'donut';
            return <div key={g} className="glass rounded-2xl p-5">
                <p className="font-bold text-gray-800 text-sm mb-1">{g}</p>
                <p className="text-xs text-gray-400 mb-3">{tot.toLocaleString()} total</p>
                <div className="grid md:grid-cols-2 gap-4 items-center">
                    <GroupedChart title={g} type={ctype} items={list}/>
                    <div>
                        {list.map((i,ix)=><div key={i.id} className="flex justify-between items-center py-2 border-b border-gray-100">
                            <span className="flex items-center gap-2 text-sm text-gray-600">
                                <span style={{width:'10px',height:'10px',borderRadius:'2px',background:ME_SERIES[ix%8]}}/>{i.indicator_name}</span>
                            <span className="font-bold text-gray-800">{i.value.toLocaleString()} <span className="text-xs text-gray-400">({tot?Math.round(i.value/tot*100):0}%)</span></span>
                        </div>)}
                    </div>
                </div>
            </div>;})}

        <div className="glass rounded-2xl p-5">
            <div className="flex flex-wrap items-center gap-3 mb-4">
                <p className="font-bold text-gray-800 text-sm flex-1">Disaggregation</p>
                <select value={disagg} onChange={e=>{setDisagg(e.target.value);setDisagg2('');}}
                    className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-medium">
                    <option value="">Select a breakdown…</option>
                    {catCols.map(cn=><option key={cn} value={cn}>{cn.slice(0,34)}</option>)}
                </select>
                {disagg&&<><span className="text-xs text-gray-400 font-bold">×</span>
                <select value={disagg2} onChange={e=>setDisagg2(e.target.value)}
                    className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-medium">
                    <option value="">(no second dimension)</option>
                    {catCols.filter(x=>x!==disagg).map(cn=><option key={cn} value={cn}>{cn.slice(0,34)}</option>)}
                </select></>}
            </div>

            {!disagg?<p className="text-center text-gray-300 text-sm py-8">Choose a column to break the indicators down — add a second for a cross-tab.</p>
            :!disagg2?<>
                <MEChart type="bar"
                    labels={indicators.map(i=>i.indicator_name)}
                    data={g1.slice(0,8).map((g,gi)=>({label:g,
                        data:indicators.map(i=>computeIndicator(i,filtered.filter(r=>String(r[disagg]??'—')===g))),
                        backgroundColor:ME_SERIES[gi%8],borderRadius:4,maxBarThickness:22}))}
                    height={250}/>
                <MELegend labels={g1.slice(0,8)} values={g1.slice(0,8).map(()=>0)} total={0}/>
                <div className="overflow-auto mt-4">
                    <table className="w-full text-xs">
                        <thead><tr className="border-b-2 border-gray-100">
                            <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">{disagg.slice(0,24)}</th>
                            <th className="text-right py-2 px-2 font-bold text-gray-500 uppercase">Rows</th>
                            {indicators.map(i=><th key={i.id} className="text-right py-2 px-2 font-bold text-gray-500 uppercase">{i.indicator_name.slice(0,18)}</th>)}
                        </tr></thead>
                        <tbody>{g1.map(g=>{
                            const gr=filtered.filter(r=>String(r[disagg]??'—')===g);
                            return <tr key={g} className="border-b border-gray-50 hover:bg-gray-50">
                                <td className="py-2 px-2 font-semibold text-gray-800">{g}</td>
                                <td className="py-2 px-2 text-right text-gray-500">{gr.length}</td>
                                {indicators.map(i=><td key={i.id} className="py-2 px-2 text-right font-bold text-gray-700">{computeIndicator(i,gr).toLocaleString()}</td>)}
                            </tr>;})}</tbody>
                    </table>
                </div>
            </>:<>
                <p className="text-xs text-gray-400 mb-3">Cross-tab: {disagg} × {disagg2}. Showing <strong>{indicators[0].indicator_name}</strong>{indicators.length>1?' (first indicator)':''}.</p>
                <MEChart type="bar" stacked={true}
                    labels={g1}
                    data={g2.slice(0,8).map((b,bi)=>({label:b,
                        data:g1.map(a=>computeIndicator(indicators[0],filtered.filter(r=>String(r[disagg]??'—')===a&&String(r[disagg2]??'—')===b))),
                        backgroundColor:ME_SERIES[bi%8],borderRadius:3,maxBarThickness:34}))}
                    height={260}/>
                <MELegend labels={g2.slice(0,8)} values={g2.slice(0,8).map(()=>0)} total={0}/>
                <div className="overflow-auto mt-4">
                    <table className="w-full text-xs">
                        <thead><tr className="border-b-2 border-gray-100">
                            <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">{disagg.slice(0,20)} \ {disagg2.slice(0,20)}</th>
                            {g2.map(b=><th key={b} className="text-right py-2 px-2 font-bold text-gray-500 uppercase">{b.slice(0,16)}</th>)}
                            <th className="text-right py-2 px-2 font-bold text-gray-700 uppercase">Total</th>
                        </tr></thead>
                        <tbody>{g1.map(a=>{
                            const rowVals=g2.map(b=>computeIndicator(indicators[0],filtered.filter(r=>String(r[disagg]??'—')===a&&String(r[disagg2]??'—')===b)));
                            return <tr key={a} className="border-b border-gray-50 hover:bg-gray-50">
                                <td className="py-2 px-2 font-semibold text-gray-800">{a}</td>
                                {rowVals.map((v,i)=><td key={i} className="py-2 px-2 text-right text-gray-700">{v.toLocaleString()}</td>)}
                                <td className="py-2 px-2 text-right font-bold text-gray-900">{rowVals.reduce((x,y)=>x+y,0).toLocaleString()}</td>
                            </tr>;})}</tbody>
                    </table>
                </div>
            </>}
        </div>

        {wpStats&&wpStats.total>0&&<div className="glass rounded-2xl p-5">
            <p className="font-bold text-gray-800 text-sm mb-1">Delivery and reach together</p>
            <p className="text-xs text-gray-400 mb-4">Work plan activity for {tool?tool.project_code:'this project'} beside the numbers those activities produced. Delivery is counted only once M&amp;E has verified it.</p>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div className="p-3 rounded-xl" style={{background:'#F0F7F2'}}>
                    <p className="text-xs text-gray-500">Activities planned</p>
                    <p className="text-2xl font-extrabold" style={{color:ME_GREEN}}>{wpStats.total}</p></div>
                <div className="p-3 rounded-xl" style={{background:'#F0F7F2'}}>
                    <p className="text-xs text-gray-500">Verified delivered</p>
                    <p className="text-2xl font-extrabold" style={{color:ME_GREEN}}>{wpStats.verified}</p></div>
                <div className="p-3 rounded-xl" style={{background:'#FDF8E7'}}>
                    <p className="text-xs text-gray-500">Awaiting verification</p>
                    <p className="text-2xl font-extrabold" style={{color:ME_GOLD}}>{wpStats.awaiting}</p></div>
                <div className="p-3 rounded-xl" style={{background:'#F0F7F2'}}>
                    <p className="text-xs text-gray-500">Reach per verified activity</p>
                    <p className="text-2xl font-extrabold" style={{color:ME_GREEN}}>{wpStats.verified?Math.round(grandTotal/wpStats.verified).toLocaleString():'—'}</p></div>
            </div>
            {wpStats.awaiting>0&&<p className="text-xs mt-3" style={{color:'#B45309'}}>
                <i className="fas fa-triangle-exclamation mr-1"/>{wpStats.awaiting} submitted report{wpStats.awaiting!==1?'s are':' is'} still awaiting M&amp;E verification, so delivery is understated here.</p>}
        </div>}

        {trend.length>1&&<div className="glass rounded-2xl p-5">
            <p className="font-bold text-gray-800 text-sm mb-3">Trend across periods</p>
            <MEChart type="line"
                labels={trend.map(t=>t.period)}
                data={indicators.slice(0,5).map((ind,ii)=>({
                    label:ind.indicator_name,
                    data:trend.map(t=>t.values[ii]),
                    borderColor:ME_SERIES[ii%8],backgroundColor:ME_SERIES[ii%8],
                    borderWidth:2,tension:.3,pointRadius:4,fill:false
                }))}
                height={240}/>
            <MELegend labels={indicators.slice(0,5).map(i=>i.indicator_name)} values={indicators.slice(0,5).map(()=>0)} total={0}/>
        </div>}
    </div>;
}

/* Printable indicator report for donors */
function MEIndicators({tool,indicators,rows,user,notify,onSaved,readOnlyView}) {
    const [form,setForm]=useState(null);
    const cols=rows.length?profileColumns(rows.slice(0,300)).filter(c=>!c.name.startsWith('__')):[];
    const numCols=cols.filter(c=>c.kind==='numeric');
    const catCols=cols.filter(c=>c.kind==='category');

    const blank={indicator_name:'',source_columns:[],aggregation:'sum',target:'',unit:'',filter_column:'',filter_value:'',chart_type:'card',chart_group:''};

   const save=async()=>{
        const cols=form.source_columns||[];
        const isMulti=!form.id && form.aggregation!=='count' && cols.length>1;

        if(form.aggregation!=='count'&&cols.length===0){notify('Choose at least one source column','error');return;}
        if(!isMulti&&!form.indicator_name.trim()){notify('Give the indicator a name','error');return;}
        if(isMulti&&!form.indicator_name.trim()){notify('Give the comparison a group name','error');return;}

        const base={tool_id:tool.id,aggregation:form.aggregation,target:form.target?Number(form.target):null,unit:form.unit||null,
            filter_column:form.filter_column||null,filter_value:form.filter_value||null,
            chart_type:isMulti?(form.chart_type==='card'?'bar':form.chart_type):(form.chart_type||'card'),
            updated_by:user.name};

        if(isMulti){
            // One indicator per selected column, all sharing a chart group so they render together
            const groupName=form.indicator_name.trim();
            const payloads=cols.map((c,idx)=>({...base,indicator_name:c,source_column:c,
                chart_group:groupName,sort_order:indicators.length+idx}));
            let okCount=0;
            for(const p of payloads){
                const r=await fetch(`${SB}/rest/v1/me_indicators`,{method:'POST',headers:HJ,body:JSON.stringify(p)});
                if(r.ok) okCount++;
            }
            if(okCount===payloads.length){notify(`${okCount} indicators created for comparison`);setForm(null);onSaved();}
            else notify(`Only ${okCount} of ${payloads.length} saved — check for issues`,'error');
            return;
        }

        const payload={...base,indicator_name:form.indicator_name.trim(),
            source_column:cols[0]||null,chart_group:form.chart_group?.trim()||null,
            sort_order:form.sort_order??indicators.length};
        const r=form.id
            ? await fetch(`${SB}/rest/v1/me_indicators?id=eq.${form.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(payload)})
            : await fetch(`${SB}/rest/v1/me_indicators`,{method:'POST',headers:HJ,body:JSON.stringify(payload)});
        if(r.ok){notify('Indicator saved');setForm(null);onSaved();}else notify('Save failed','error');
    };
    const del=async(i)=>{
        if(!confirm(`Delete indicator "${i.indicator_name}"?`))return;
        const r=await fetch(`${SB}/rest/v1/me_indicators?id=eq.${i.id}`,{method:'DELETE',headers:H});
        if(r.ok){notify('Deleted');onSaved();}else notify('Delete failed','error');
    };

    return <div className="space-y-4">
        {!rows.length&&<div className="glass rounded-2xl p-6 text-center text-gray-400">
            <p className="font-semibold">Upload a dataset first</p>
            <p className="text-sm mt-1">Indicators are mapped to columns from your uploaded data.</p></div>}

        {!readOnlyView&&rows.length>0&&!form&&<button onClick={()=>setForm({...blank})} className="btn-green text-white px-5 py-3 rounded-xl font-bold text-sm"><i className="fas fa-plus mr-2"/>Add Indicator</button>}

        {form&&<div className="glass rounded-2xl p-6">
            <h3 className="font-bold text-gray-800 mb-4">{form.id?'Edit':'New'} Indicator</h3>
            <div className="grid md:grid-cols-2 gap-4 mb-4">
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">
                        {!form.id&&(form.source_columns||[]).length>1?'Comparison Group Name *':'Indicator Name *'}</label>
                    <input value={form.indicator_name} onChange={e=>setForm({...form,indicator_name:e.target.value})}
                        placeholder={!form.id&&(form.source_columns||[]).length>1?'e.g. Malnutrition Referrals':'e.g. Women Reached'}
                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
                    {!form.id&&(form.source_columns||[]).length>1&&<p className="text-xs text-gray-400 mt-1">Each selected column becomes its own indicator, named after the column, grouped under this name.</p>}</div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Aggregation *</label>
                    <select value={form.aggregation} onChange={e=>setForm({...form,aggregation:e.target.value})} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl">
                        {ME_AGGS.map(a=><option key={a.v} value={a.v}>{a.l}</option>)}</select></div>
                <div className="md:col-span-2">
                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Source Column{form.aggregation!=='count'&&' *'}</label>
                    <p className="text-xs text-gray-400 mb-2">Select one column for a single indicator, or several to compare them (e.g. SAM vs MAM) — each becomes its own indicator, grouped into one chart.</p>
                    <div className="border-2 border-gray-200 rounded-xl p-3 max-h-48 overflow-auto space-y-1">
                        {cols.map(c=><label key={c.name} className="flex items-center gap-2 py-1 px-2 hover:bg-gray-50 rounded cursor-pointer">
                            <input type="checkbox" disabled={!!form.id} checked={(form.source_columns||[]).includes(c.name)}
                                onChange={e=>{
                                    const cur=form.source_columns||[];
                                    setForm({...form,source_columns:e.target.checked?[...cur,c.name]:cur.filter(x=>x!==c.name)});

                            <span className="flex-1 text-sm text-gray-700">{c.name}</span>

                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Unit (optional)</label>

                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Chart Type</label>
                    <select value={form.chart_type||'card'} onChange={e=>setForm({...form,chart_type:e.target.value})} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl">
                        <option value="card">Number card (default)</option>
