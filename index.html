function StaffPortal({user,onLogout,notify}) {
    const isSup=user.role==='supervisor';const isEmp=user.role==='employee';
    const [flags,setFlags]=useState({is_hr:false,is_ed:false,is_security:false,is_mne:false});
    const [section,setSection]=useState('home');const [screen,setScreen]=useState(null);const [showPw,setShowPw]=useState(false);
    const [attn,setAttn]=useState([]);const [counts,setCounts]=useState({});const [content,setContent]=useState({});const [notices,setNotices]=useState([]);
    const hrAccess=isSup?'supervisor':flags.is_hr?'hr':flags.is_ed?'ed':null;
    const isSec=!!user.is_security||flags.is_security;const isMne=!!user.is_mne||flags.is_mne;
    const secAccess=isSup||isSec;const meAccess=isSup||isMne;

    /* Access flags are read here, after login — the login flow itself is untouched.
       Each is fetched on its own so a missing column can't break the others. */
    const flag=async col=>{try{const r=await fetch(`${SB}/rest/v1/users?id=eq.${user.id}&select=${col}`,{headers:H});if(!r.ok)return undefined;const d=await r.json();return Array.isArray(d)&&d.length?d[0][col]:undefined;}catch(e){return undefined;}};
    useEffect(()=>{(async()=>{
        const active=await flag('is_active');
        if(active===false){notify('This account has been deactivated. Please contact HR.','error');onLogout();return;}
        const [hr,ed,sec,mne]=await Promise.all([flag('is_hr'),flag('is_ed'),flag('is_security'),flag('is_mne')]);setFlags({is_hr:!!hr,is_ed:!!ed,is_security:!!sec,is_mne:!!mne});
    })();},[]);
    useEffect(()=>{(async()=>{try{const [c,n]=await Promise.all([
        fetch(`${SB}/rest/v1/portal_content?select=key,body`,{headers:H}).then(r=>r.ok?r.json():[]),
        fetch(`${SB}/rest/v1/portal_notices?active=eq.true&select=id,title,body,pinned,expires_on,posted_by,posted_at&order=pinned.desc,posted_at.desc`,{headers:H}).then(r=>r.ok?r.json():[])]);
        const m={};(Array.isArray(c)?c:[]).forEach(x=>{if(x.body)m[x.key]=x.body;});setContent(m);
        setNotices((Array.isArray(n)?n:[]).filter(x=>!x.expires_on||x.expires_on>=portalToday()));}catch(e){}})();},[]);

    /* "Needs your attention" — every query is independent and fails quietly */
    const loadAttn=async()=>{
        const items=[];const c={};const safe=async(fn)=>{try{return await fn();}catch(e){return null;}};
        const j=url=>fetch(url,{headers:H}).then(r=>r.ok?r.json():[]);
        const pol=await safe(async()=>(await loadMyPolicyItems(user.id)).filter(x=>x.status!=='signed'));
        if(pol&&pol.length){const od=pol.filter(x=>x.status==='overdue').length;c.policies=pol.length;items.push({icon:'fa-file-signature',tone:od?'red':'amber',text:`${pol.length} ${pol.length===1?'policy':'policies'} to read and sign${od?` (${od} overdue)`:''}`,go:()=>setScreen('mypolicies')});}
        const msgs=await safe(()=>j(`${SB}/rest/v1/trip_messages?to_user_id=eq.${user.id}&acknowledged_at=is.null&select=id`));
        if(Array.isArray(msgs)&&msgs.length) items.push({icon:'fa-shield-halved',tone:'red',text:`${msgs.length} message${msgs.length>1?'s':''} from Security on your trip`,go:()=>setScreen('myfieldtrip')});
        if(isEmp){const ap=await safe(()=>j(`${SB}/rest/v1/appraisals?employee_id=eq.${user.id}&status=eq.completed&select=id,withdrawn,employee_review_status`));
            const nr=(Array.isArray(ap)?ap:[]).filter(a=>!a.withdrawn&&(!a.employee_review_status||a.employee_review_status==='pending')).length;
            if(nr){c.appraisals=nr;items.push({icon:'fa-bell',tone:'blue',text:`Your supervisor's review is ready — ${nr} to respond to`,go:()=>setScreen('myappraisals')});}}
        if(isSup){const pa=await safe(()=>j(`${SB}/rest/v1/appraisals?status=eq.pending&select=id,withdrawn`));const np=(Array.isArray(pa)?pa:[]).filter(a=>!a.withdrawn).length;
            if(np){c.queue=np;items.push({icon:'fa-clipboard-check',tone:'amber',text:`${np} self-assessment${np>1?'s':''} waiting for your review`,go:()=>{setSection('hr');setScreen('appraisalqueue');}});}
            const lv=await safe(()=>j(`${SB}/rest/v1/leave_requests?select=id,status`));const nl=(Array.isArray(lv)?lv:[]).filter(l=>!l.status||l.status==='pending').length;
            if(nl){c.leave=nl;items.push({icon:'fa-plane',tone:'amber',text:`${nl} leave request${nl>1?'s':''} waiting for a decision`,go:()=>{setSection('hr');setScreen('leaveadmin');}});}}
        if(hrAccess){const rec=await safe(()=>j(`${SB}/rest/v1/hr_recommendations?decision=eq.pending&select=id`));const nrec=Array.isArray(rec)?rec.length:0;
            if(nrec){c.recs=nrec;items.push({icon:'fa-user-check',tone:'blue',text:hrAccess==='hr'?`${nrec} of your recommendation${nrec>1?'s are':'s is'} awaiting a Supervisor/ED decision`:`${nrec} HR recommendation${nrec>1?'s':''} waiting for your decision`,go:()=>{setSection('hr');setScreen('hrdash');}});}}
        if(secAccess){const tr=await safe(()=>j(`${SB}/rest/v1/field_trips?status=eq.active&select=id`));const nt=Array.isArray(tr)?tr.length:0;
            if(nt){c.trips=nt;items.push({icon:'fa-route',tone:'green',text:`${nt} staff on an active field trip now`,go:()=>{setSection('security');setScreen('tripmon');}});}}
        setAttn(items);setCounts(c);};
    useEffect(()=>{loadAttn();},[hrAccess,secAccess]);
    const back=()=>{setScreen(null);loadAttn();};

    const openFms=()=>{if(isEmp){const u=localStorage.getItem('pms_user');if(!u){alert('Session expired. Please login again.');return;}window.open('https://rahamaorg.github.io/rahamafms/?session='+encodeURIComponent(u),'_blank');}
        else window.open('https://rahamaorg.github.io/rahamafms/','_blank');};

    /* ---------- screens: every one is an existing component ---------- */
    if(screen){
        const toHr=()=>{setScreen(null);setSection('hr');loadAttn();};const toSec=()=>{setScreen(null);setSection('security');loadAttn();};
        switch(screen){
            case 'myappraisals': return <MyAppraisals user={user} notify={notify} onBack={back}/>;
            case 'attendance': return <Attendance user={user} notify={notify} onBack={back}/>;
            case 'myleave': return <MyLeave user={user} notify={notify} onBack={back}/>;
            case 'myacts': return <MyActivities user={user} notify={notify} onBack={back}/>;
            case 'myfieldtrip': return <FieldTrip user={user} notify={notify} onBack={back}/>;
            case 'mypolicies': return <MyPolicies user={user} notify={notify} onBack={back}/>;
            case 'directory': return <Directory user={user} notify={notify} onBack={back}/>;
            case 'myemergency': return <MyEmergencyContact user={user} notify={notify} onBack={back}/>;
            case 'mande': return <MandE user={user} notify={notify} readOnlyView={!isMne} onBack={back}/>;
        }
        if(hrAccess) switch(screen){
            case 'hrdash': return <HRDashboard user={user} notify={notify} access={hrAccess} onBack={toHr}/>;
            case 'quarterly': return <QuarterlyOverview notify={notify} onBack={toHr}/>;
            case 'teamattendance': return <AttendanceAdmin notify={notify} onBack={toHr}/>;
            case 'leaveadmin': return <LeaveAdmin notify={notify} readOnly={!isSup} onBack={toHr}/>;
            case 'profiles': return <HRAdmin notify={notify} onBack={toHr}/>;
            case 'policies': return <PolicyAdmin user={user} notify={notify} readOnly={hrAccess!=='hr'} onBack={toHr}/>;
        }
        if(isSup) switch(screen){
            case 'appraisalqueue': return <AppraisalQueue user={user} notify={notify} onBack={toHr}/>;
            case 'deadline': return <DeadlineSettings user={user} notify={notify} onBack={toHr}/>;
        }
        if(hrAccess==='hr'||isSup) if(screen==='portalcontent') return <PortalContentAdmin user={user} notify={notify} onBack={toHr}/>;
        if(secAccess) switch(screen){
            case 'tripmon': return <FieldTripAdmin user={user} notify={notify} onBack={toSec}/>;
            case 'loginlogs': return <LoginLogs notify={notify} onBack={toSec}/>;
        }
    }

    const G={green:'linear-gradient(135deg,#16a34a,#166534)',blue:'linear-gradient(135deg,#3b82f6,#1d4ed8)',purple:'linear-gradient(135deg,#8b5cf6,#6d28d9)',cyan:'linear-gradient(135deg,#0891b2,#0e7490)',
        amber:'linear-gradient(135deg,#f59e0b,#b45309)',rose:'linear-gradient(135deg,#e11d48,#9f1239)',sky:'linear-gradient(135deg,#0ea5e9,#0369a1)',red:'linear-gradient(135deg,#dc2626,#991b1b)',
        violet:'linear-gradient(135deg,#7c3aed,#4c1d95)',orange:'linear-gradient(135deg,#ea580c,#9a3412)',emerald:'linear-gradient(135deg,#059669,#065f46)',teal:'linear-gradient(135deg,#0d9488,#0f766e)',slate:'linear-gradient(135deg,#475569,#1e293b)'};
    const workspace=[
        isEmp&&{k:'myappraisals',icon:'fa-clipboard-list',g:G.green,t:'My Appraisals',s:'Self-assessment, reviews & responses',b:counts.appraisals},
        isEmp&&{k:'attendance',icon:'fa-clock',g:G.blue,t:'My Attendance',s:'Clock in, clock out & history'},
        isEmp&&{k:'myleave',icon:'fa-plane-departure',g:G.purple,t:'My Leave',s:'Balance, requests & decisions'},
        {k:'myacts',icon:'fa-list-check',g:G.cyan,t:'My Work Plan Activities',s:'Report on activities assigned to you'},
        {k:'myfieldtrip',icon:'fa-route',g:G.amber,t:'My Field Trips',s:'Start a tracked trip & see Security messages'},
        {k:'mypolicies',icon:'fa-file-signature',g:G.rose,t:'My Policies',s:'Read and sign RAHAMA policies',b:counts.policies},
        {k:'directory',icon:'fa-address-book',g:G.sky,t:'Staff Directory',s:'Find and contact colleagues'},
        {k:'myemergency',icon:'fa-user-shield',g:G.red,t:'My Emergency Contact',s:'Next of kin for duty of care'}].filter(Boolean);
    const hrTiles=[
        {k:'hrdash',icon:'fa-people-group',g:G.violet,t:'Performance & Promotions',s:'Appraisal findings, flags & HR recommendations',b:counts.recs},
        isSup&&{k:'appraisalqueue',icon:'fa-clipboard-check',g:G.green,t:'Appraisal Reviews',s:'Review and score staff self-assessments',b:counts.queue},
        {k:'quarterly',icon:'fa-calendar-check',g:G.emerald,t:'Submissions by Quarter',s:'Who has submitted, who is pending'},
        isSup&&{k:'deadline',icon:'fa-hourglass-half',g:G.orange,t:'Self-Assessment Deadline',s:'Set or reopen the submission deadline'},
        {k:'teamattendance',icon:'fa-users-viewfinder',g:G.blue,t:'Team Attendance',s:'Daily and monthly records'},
        {k:'leaveadmin',icon:'fa-plane',g:G.purple,t:'Leave Management',s:isSup?'Approve or reject leave applications':'View leave applications and decisions',b:counts.leave},
        {k:'profiles',icon:'fa-id-badge',g:G.sky,t:'Staff Profiles',s:'Personnel details & emergency contacts'},
        {k:'policies',icon:'fa-file-shield',g:G.rose,t:'Policies',s:hrAccess==='hr'?'Publish, assign & track sign-off':'Policy sign-off compliance'},
        (hrAccess==='hr'||isSup)&&{k:'portalcontent',icon:'fa-bullhorn',g:G.slate,t:'Portal Content & Notices',s:'About RAHAMA text and the notice board'}].filter(Boolean);
    const secTiles=[{k:'tripmon',icon:'fa-map-location-dot',g:G.red,t:'Field Trip Monitoring',s:'Live map, messages, call & stale-location alerts',b:counts.trips},
        {k:'loginlogs',icon:'fa-shield-halved',g:G.slate,t:'Login Activity Logs',s:'Login history, devices & failed attempts'}];

    const Header=({sub})=><div className="glass rounded-2xl p-6 mb-6 animate-in"><div className="flex flex-wrap justify-between items-center gap-4">
        <div><p className="text-xs font-bold text-green-700 uppercase tracking-widest">RAHAMA Staff Portal</p><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800 mt-1">{sub}</h1>
            <p className="text-gray-500 font-medium mt-1"><i className={`fas ${isSup?'fa-user-tie':'fa-user'} text-green-600 mr-2`}/>{user.name}{hrAccess==='hr'?' · HR Officer':hrAccess==='ed'?' · Executive Director':isSup?' · Supervisor':''}{isSec?' · Security':''}{isMne?' · M&E':''}</p></div>
        <div className="flex gap-2"><button onClick={()=>setShowPw(true)} className="px-4 py-2 bg-green-50 text-green-700 hover:bg-green-100 rounded-xl font-medium text-sm"><i className="fas fa-key mr-2"/>Password</button>
            <button onClick={onLogout} className="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-xl text-sm"><i className="fas fa-sign-out-alt mr-2"/>Logout</button></div></div></div>;
    const Grid=({tiles})=><div className="grid md:grid-cols-2 gap-4">{tiles.map(x=><PortalTile key={x.k} icon={x.icon} grad={x.g} title={x.t} sub={x.s} badge={x.b} onClick={()=>setScreen(x.k)}/>)}</div>;

    if(section==='hr'&&hrAccess) return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <button onClick={()=>setSection('home')} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Staff Portal home</button>
        <Header sub="HR Portal"/>{hrAccess!=='supervisor'&&<p className="text-xs text-gray-500 mb-4 px-1">{hrAccess==='hr'?'Appraisal scoring and leave approval stay with the supervisor; you see the findings and records.':'Leave approval stays with the supervisor; you see the records.'}</p>}
        <Grid tiles={hrTiles}/>{showPw&&<ChangePw user={user} onClose={()=>setShowPw(false)} notify={notify}/>}</div></div>;
    if(section==='security'&&secAccess) return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <button onClick={()=>setSection('home')} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Staff Portal home</button>
        <Header sub="Security Portal"/><Grid tiles={secTiles}/>{showPw&&<ChangePw user={user} onClose={()=>setShowPw(false)} notify={notify}/>}</div></div>;

    const tone={red:'bg-red-50 border-red-200 text-red-800',amber:'bg-amber-50 border-amber-200 text-amber-800',blue:'bg-blue-50 border-blue-200 text-blue-800',green:'bg-green-50 border-green-200 text-green-800'};
    const hour=new Date().getHours();const greet=hour<12?'Good morning':hour<16?'Good afternoon':'Good evening';
    const lines=k=>(content[k]||'').split('\n').map(x=>x.trim()).filter(Boolean);
    const portals=[hrAccess&&{t:'HR Portal',s:'Performance, attendance, leave, profiles & policies',icon:'fa-people-group',g:G.violet,go:()=>setSection('hr'),b:(counts.queue||0)+(counts.leave||0)+(hrAccess!=='hr'?(counts.recs||0):0)},
        meAccess&&{t:'M&E Portal',s:isMne?'Work plans, data, indicators & completion rates':'View work plans, data and indicator dashboards',icon:'fa-chart-pie',g:G.cyan,go:()=>setScreen('mande')},
        secAccess&&{t:'Security Portal',s:'Field trip monitoring & login activity',icon:'fa-shield-halved',g:G.red,go:()=>setSection('security'),b:counts.trips},
        {t:'Financial Management System',s:'Budgets, payments & approvals (opens in a new tab)',icon:'fa-coins',g:G.green,go:openFms}].filter(Boolean);
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <Header sub={`${greet}, ${(user.name||'').split(' ')[0]}`}/>
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="text-lg font-bold mb-3"><i className="fas fa-bell text-amber-500 mr-2"/>Needs your attention</h2>
            {attn.length===0?<p className="text-sm text-gray-500"><i className="fas fa-check-circle text-green-500 mr-2"/>You're all caught up.</p>
            :<div className="space-y-2">{attn.map((a,i)=><button key={i} onClick={a.go} className={`w-full text-left border-2 rounded-xl px-4 py-3 text-sm font-semibold flex items-center gap-3 hover:shadow ${tone[a.tone]}`}><i className={`fas ${a.icon}`}/><span className="flex-1">{a.text}</span><i className="fas fa-arrow-right opacity-50"/></button>)}</div>}</div>
        <h2 className="text-sm font-bold text-gray-700 uppercase tracking-widest mb-3 inline-block px-4 py-1.5 rounded-full shadow" style={{background:'rgba(255,255,255,0.92)'}}>My Workspace</h2>
        <div className="mb-8"><Grid tiles={workspace}/></div>
        <h2 className="text-sm font-bold text-gray-700 uppercase tracking-widest mb-3 inline-block px-4 py-1.5 rounded-full shadow" style={{background:'rgba(255,255,255,0.92)'}}>{portals.length>1?'Portals':'Systems'}</h2>
        <div className="grid md:grid-cols-2 gap-4 mb-8">{portals.map((p,i)=><PortalTile key={i} icon={p.icon} grad={p.g} title={p.t} sub={p.s} badge={p.b} onClick={p.go}/>)}</div>
        {notices.length>0&&<div className="glass rounded-2xl p-6 mb-6"><h2 className="text-lg font-bold mb-3"><i className="fas fa-bullhorn text-green-600 mr-2"/>Notice board</h2>
            <div className="space-y-3">{notices.slice(0,6).map(x=><div key={x.id} className={`rounded-xl p-4 ${x.pinned?'bg-green-50 border-2 border-green-200':'bg-gray-50'}`}>
                <p className="font-bold text-gray-800">{x.pinned&&<i className="fas fa-thumbtack text-green-600 mr-2"/>}{x.title}</p>{x.body&&<p className="text-sm text-gray-600 mt-1 whitespace-pre-wrap">{x.body}</p>}
                <p className="text-xs text-gray-400 mt-1">{x.posted_by||'HR'} · {new Date(x.posted_at).toLocaleDateString()}</p></div>)}</div></div>}
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="text-lg font-bold mb-4"><i className="fas fa-heart text-rose-500 mr-2"/>About RAHAMA</h2>
            {content.story&&<div className="mb-5 border-l-4 border-rose-300 pl-4"><p className="text-xs font-bold text-rose-700 uppercase tracking-wider mb-2">Our Story</p><p className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">{content.story}</p></div>}
            {(content.mission||content.vision)&&<div className="grid md:grid-cols-2 gap-4 mb-5">
                {content.mission&&<div className="bg-green-50 rounded-xl p-4"><p className="text-xs font-bold text-green-700 uppercase tracking-wider mb-1">Our Mission</p><p className="text-sm text-gray-700 whitespace-pre-wrap">{content.mission}</p></div>}
                {content.vision&&<div className="bg-indigo-50 rounded-xl p-4"><p className="text-xs font-bold text-indigo-700 uppercase tracking-wider mb-1">Our Vision</p><p className="text-sm text-gray-700 whitespace-pre-wrap">{content.vision}</p></div>}</div>}
            {lines('values').length>0&&<div className="mb-5"><p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Core Values</p><div className="flex flex-wrap gap-2">{lines('values').map((v,i)=><span key={i} className="px-3 py-1.5 rounded-full text-sm font-semibold bg-amber-50 text-amber-800">{v}</span>)}</div></div>}
            <div className="grid md:grid-cols-2 gap-4">{[['where_we_work','Where We Work','fa-location-dot'],['contacts','Who To Contact','fa-phone']].filter(([k])=>lines(k).length).map(([k,l,ic])=>
                <div key={k} className="bg-gray-50 rounded-xl p-4"><p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2"><i className={`fas ${ic} mr-1`}/>{l}</p><ul className="space-y-1">{lines(k).map((x,i)=><li key={i} className="text-sm text-gray-700">{x}</li>)}</ul></div>)}</div>
            {!content.story&&!content.mission&&!content.vision&&!lines('values').length&&!lines('where_we_work').length&&<p className="text-sm text-gray-400">HR has not added this section yet.</p>}
        </div>
        <div className="rounded-2xl p-6 mb-6 border-2 border-red-200 bg-red-50"><h2 className="text-lg font-bold text-red-800 mb-2"><i className="fas fa-hand-holding-heart mr-2"/>Report a safeguarding or PSEAH concern</h2>
            {content.safeguarding?<p className="text-sm text-red-900 whitespace-pre-wrap">{content.safeguarding}</p>
            :<p className="text-sm text-red-900">If you see or suspect sexual exploitation, abuse or harassment, or any harm to a child or vulnerable adult, report it. Send an email to psea@rgcweinigeria.org IMMEDIATELY or report directly to HR.</p>}</div>
        {showPw&&<ChangePw user={user} onClose={()=>setShowPw(false)} notify={notify}/>}
    </div></div>;
}


/* ==================== HR DASHBOARD ====================
   Access: HR (users.is_hr), ED (users.is_ed) and the supervisor.
   Reads completed appraisals (read-only), flags promotion candidates
   using the existing grade bands, and runs the HR recommendation →
   Supervisor/ED decision step. Staff Profiles and Policies live here. */
const HR_BANDS=[{k:'BEACON',min:90,c:'#1A3A5C'},{k:'BLAZE',min:80,c:'#C9980A'},{k:'FLAME',min:75,c:'#E8851A'},{k:'GLOW',min:70,c:'#D4651A'},{k:'SPARK',min:60,c:'#C1440E'},{k:'PIP',min:-1,c:'#CC2200'}];
const hrBandOf=s=>HR_BANDS.find(b=>s>=b.min).k;
const hrPeriodKey=p=>{const m=/^Q([1-4])\s+(\d{4})$/.exec((p||'').trim());return m?Number(m[2])*10+Number(m[1]):0;};
const HR_FLAG={promotion:{l:'Promotion candidate',c:'bg-indigo-100 text-indigo-800',i:'fa-arrow-trend-up'},ontrack:{l:'On track',c:'bg-green-100 text-green-700',i:'fa-check'},
    support:{l:'Needs support',c:'bg-amber-100 text-amber-800',i:'fa-hands-holding'},pip:{l:'PIP',c:'bg-red-100 text-red-700',i:'fa-triangle-exclamation'},none:{l:'Not appraised',c:'bg-gray-100 text-gray-500',i:'fa-minus'}};
const HR_REC={promotion:'Recommend for promotion',not_yet:'Not yet — keep developing',support:'Needs support / training',pip:'Place on PIP'};
const HR_DEC={pending:'bg-amber-100 text-amber-700',approved:'bg-green-100 text-green-700',rejected:'bg-red-100 text-red-700'};
/* Flag rules (as agreed): PIP <60; Needs support <70 in the latest
   quarter; Promotion candidate = 80+ in the two most recent appraised
   quarters with no disputed appraisal among them. */
const hrFlagFor=hist=>{
    if(!hist.length) return 'none';
    const last=hist[hist.length-1];
    if(last.score<60) return 'pip';
    if(last.score<70) return 'support';
    const two=hist.slice(-2);
    if(two.length===2&&two.every(h=>h.score>=80&&!h.disputed)) return 'promotion';
    return 'ontrack';
};

function HRDashboard({user,notify,onBack,access}) {
    const canRecommend=access==='hr';const canDecide=access==='ed'||access==='supervisor';
    const [tab,setTab]=useState('performance');const [loading,setLoading]=useState(true);
    const [apps,setApps]=useState([]);const [staff,setStaff]=useState([]);const [profiles,setProfiles]=useState({});const [recs,setRecs]=useState([]);
    const [period,setPeriod]=useState('');const [flagF,setFlagF]=useState('all');const [dept,setDept]=useState('all');const [selStaff,setSelStaff]=useState(null);
    const load=async()=>{setLoading(true);
        try{
            const [a,u,p,r]=await Promise.all([
                fetch(`${SB}/rest/v1/appraisals?status=eq.completed&select=id,employee_id,withdrawn,final_score,grade_band,review_period,supervisor_ratings,supervisor_overall_comments,employee_review_status,completed_at,attendance_deduction`,{headers:H}).then(x=>x.ok?x.json():[]),
                fetch(`${SB}/rest/v1/users?select=id,name,email,role,is_active&order=name.asc`,{headers:H}).then(x=>x.ok?x.json():[]),
                fetch(`${SB}/rest/v1/staff_profiles?select=user_id,position,department`,{headers:H}).then(x=>x.ok?x.json():[]),
                fetch(`${SB}/rest/v1/hr_recommendations?select=*&order=recommended_at.desc`,{headers:H}).then(x=>x.ok?x.json():[])]);
            const good=(Array.isArray(a)?a:[]).filter(x=>!x.withdrawn&&x.review_period&&x.final_score!=null);
            setApps(good);setStaff(Array.isArray(u)?u:[]);
            const pm={};(Array.isArray(p)?p:[]).forEach(x=>pm[x.user_id]=x);setProfiles(pm);setRecs(Array.isArray(r)?r:[]);
            const ps=[...new Set(good.map(x=>x.review_period))].sort((x,y)=>hrPeriodKey(y)-hrPeriodKey(x));
            setPeriod(cur=>cur&&ps.includes(cur)?cur:(ps[0]||''));
        }catch(e){notify('Could not load HR data','error');}
        setLoading(false);};
    useEffect(()=>{load();},[]);

    if(tab==='profiles') return <HRAdmin notify={notify} onBack={()=>setTab('performance')}/>;
    if(tab==='policies') return <PolicyAdmin user={user} notify={notify} readOnly={access!=='hr'} onBack={()=>setTab('performance')}/>;

    const periods=[...new Set(apps.map(x=>x.review_period))].sort((x,y)=>hrPeriodKey(x)-hrPeriodKey(y));
    const pk=hrPeriodKey(period);
    /* One entry per person per quarter (latest completed review wins) */
    const histFor=uid=>{const m={};apps.filter(a=>a.employee_id===uid&&hrPeriodKey(a.review_period)<=pk).forEach(a=>{const cur=m[a.review_period];if(!cur||new Date(a.completed_at)>new Date(cur.completed_at))m[a.review_period]=a;});
        return Object.values(m).sort((x,y)=>hrPeriodKey(x.review_period)-hrPeriodKey(y.review_period)).map(a=>({period:a.review_period,score:Number(a.final_score),disputed:a.employee_review_status==='rejected',app:a}));};
    const latestRec=uid=>recs.find(r=>r.user_id===uid);
    const appraisedIds=new Set(apps.map(a=>a.employee_id));
    const rows=staff.filter(s=>appraisedIds.has(s.id)||(s.is_active!==false&&s.role==='employee')).map(s=>{
        const hist=histFor(s.id);const cur=hist.find(h=>h.period===period);const prev=hist.filter(h=>h.period!==period).slice(-1)[0];
        return {s,prof:profiles[s.id]||{},hist,cur,prev,flag:cur?hrFlagFor(hist):'none',rec:latestRec(s.id)};});
    const depts=[...new Set(rows.map(r=>r.prof.department).filter(Boolean))].sort();
    const inDept=rows.filter(r=>dept==='all'||r.prof.department===dept);
    const shown=inDept.filter(r=>flagF==='all'||r.flag===flagF).sort((a,b)=>(b.cur?b.cur.score:-1)-(a.cur?a.cur.score:-1));
    const qApps=inDept.filter(r=>r.cur);
    const avgScore=qApps.length?(qApps.reduce((t,r)=>t+r.cur.score,0)/qApps.length).toFixed(1):'—';
    const count=f=>inDept.filter(r=>r.flag===f).length;
    const bandCounts=HR_BANDS.map(b=>qApps.filter(r=>hrBandOf(r.cur.score)===b.k).length);
    const trend=periods.map(p=>{const v=apps.filter(a=>a.review_period===p&&(dept==='all'||(profiles[a.employee_id]||{}).department===dept)).map(a=>Number(a.final_score));return v.length?Number((v.reduce((x,y)=>x+y,0)/v.length).toFixed(1)):0;});
    const compAvg=comps.map(c=>{const v=qApps.map(r=>Number((r.cur.app.supervisor_ratings||{})[c.name])).filter(x=>x>0);return v.length?Number((v.reduce((x,y)=>x+y,0)/v.length).toFixed(2)):0;});
    const pendingRecs=recs.filter(r=>r.decision==='pending').length;
    const nameOf={};staff.forEach(s=>nameOf[s.id]=s.name);

    if(selStaff){const r=rows.find(x=>x.s.id===selStaff);if(r) return <HRStaffDetail row={r} allHist={histFor} recs={recs.filter(x=>x.user_id===r.s.id)} period={period} user={user} canRecommend={canRecommend} canDecide={canDecide} notify={notify} onBack={()=>{setSelStaff(null);load();}}/>;}

    const exportXlsx=()=>{const data=shown.map(r=>({'Staff':r.s.name,'Position':r.prof.position||'','Department':r.prof.department||'',[`Score ${period}`]:r.cur?r.cur.score:'',
        'Previous score':r.prev?r.prev.score:'','Band':r.cur?hrBandOf(r.cur.score):'','Flag':HR_FLAG[r.flag].l,'Latest HR recommendation':r.rec?HR_REC[r.rec.recommendation]:'','Decision':r.rec?r.rec.decision:''}));
        const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'HR summary');XLSX.writeFile(wb,`RAHAMA HR summary ${period||''}.xlsx`);};

    const tabs=[['performance','Performance','fa-chart-line'],['promotions',`Recommendations${pendingRecs?` (${pendingRecs})`:''}`,'fa-user-check'],['profiles','Staff Profiles','fa-id-badge'],['policies','Policies','fa-file-shield']];
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <div className="flex flex-wrap justify-between items-center gap-3"><div><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">HR Dashboard</h1>
                <p className="text-gray-500 text-sm mt-1">Appraisal findings, promotion candidates and staff support · {access==='hr'?'HR Officer':access==='ed'?'Executive Director':'Supervisor'} view</p></div>
            {tab==='performance'&&<div className="flex flex-wrap gap-2">
                <select value={period} onChange={e=>setPeriod(e.target.value)} className="border-2 border-gray-200 rounded-xl px-3 py-2 text-sm font-semibold">{[...periods].reverse().map(p=><option key={p}>{p}</option>)}{!periods.length&&<option value="">No reviewed quarters yet</option>}</select>
                <select value={dept} onChange={e=>setDept(e.target.value)} className="border-2 border-gray-200 rounded-xl px-3 py-2 text-sm font-semibold"><option value="all">All departments</option>{depts.map(d=><option key={d}>{d}</option>)}</select>
                <button onClick={exportXlsx} className="px-4 py-2 rounded-xl font-semibold text-sm bg-green-50 text-green-700 hover:bg-green-100"><i className="fas fa-file-excel mr-2"/>Export</button></div>}</div>
            <div className="flex flex-wrap gap-2 mt-5 border-t pt-4">{tabs.map(([k,l,i])=><button key={k} onClick={()=>setTab(k)} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab===k?'btn-green text-white':'text-gray-500 hover:bg-gray-100'}`}><i className={`fas ${i} mr-2`}/>{l}</button>)}</div></div>

        {loading?<div className="text-center py-16"><i className="fas fa-spinner fa-spin text-2xl text-gray-400"/></div>
        :tab==='promotions'?<HRRecommendations recs={recs} nameOf={nameOf} user={user} canDecide={canDecide} canRecommend={canRecommend} candidates={rows.filter(r=>r.flag==='promotion'&&!(r.rec&&r.rec.review_period===period))} period={period} notify={notify} onOpen={id=>setSelStaff(id)} onChanged={load}/>
        :<>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">{[
            {l:`Appraised ${period}`,v:qApps.length,c:'text-gray-800',f:'all'},{l:'Average score',v:avgScore,c:'text-gray-800',f:'all'},
            {l:'Promotion candidates',v:count('promotion'),c:'text-indigo-700',f:'promotion'},{l:'Needs support',v:count('support'),c:'text-amber-600',f:'support'},{l:'PIP',v:count('pip'),c:'text-red-600',f:'pip'}]
            .map((t,i)=><button key={i} onClick={()=>setFlagF(t.f)} className="glass rounded-xl p-5 text-left hover:shadow-lg"><p className="text-xs font-bold text-gray-400 uppercase tracking-wider">{t.l}</p><p className={`text-3xl font-extrabold mt-1 ${t.c}`}>{t.v}</p></button>)}</div>
        {qApps.length>0&&<div className="grid md:grid-cols-2 gap-6 mb-6">
            <div className="glass rounded-2xl p-6"><h2 className="font-bold mb-3"><i className="fas fa-layer-group text-green-600 mr-2"/>Staff by grade band — {period}</h2>
                <MEChart type="bar" labels={HR_BANDS.map(b=>b.k)} data={bandCounts} colors={HR_BANDS.map(b=>b.c)} height={210}/></div>
            <div className="glass rounded-2xl p-6"><h2 className="font-bold mb-3"><i className="fas fa-chart-line text-green-600 mr-2"/>Average score by quarter</h2>
                <MEChart type="line" labels={periods} data={[{label:'Average',data:trend,borderColor:'#285B3C',backgroundColor:'#285B3C',tension:0.3}]} height={210}/></div>
            <div className="glass rounded-2xl p-6 md:col-span-2"><h2 className="font-bold mb-1"><i className="fas fa-brain text-green-600 mr-2"/>Competency averages — {period} (out of 5)</h2>
                <p className="text-xs text-gray-400 mb-3">Lowest bars show where training is most needed across the team</p>
                <MEChart type="bar" horizontal labels={comps.map(c=>c.name)} data={compAvg} colors={compAvg.map(v=>v<3?'#CC2200':v<3.5?'#E8851A':'#285B3C')} height={300}/></div>
        </div>}
        <div className="glass rounded-2xl p-6">
            <div className="flex flex-wrap gap-2 mb-4">{['all','promotion','ontrack','support','pip','none'].map(f=><button key={f} onClick={()=>setFlagF(f)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${flagF===f?'btn-green text-white':'text-gray-500 hover:bg-gray-100'}`}>{f==='all'?'All staff':HR_FLAG[f].l} ({f==='all'?inDept.length:count(f)})</button>)}</div>
            {shown.length===0?<p className="text-center py-10 text-gray-400 font-semibold">No staff in this view</p>
            :<div className="space-y-2">{shown.map(r=>{const d=r.cur&&r.prev?r.cur.score-r.prev.score:null;
                return <div key={r.s.id} onClick={()=>setSelStaff(r.s.id)} className="border-2 border-gray-100 rounded-xl p-4 flex flex-wrap items-center gap-3 cursor-pointer hover:border-green-200">
                    <div className="flex-1 min-w-[180px]"><p className="font-bold text-gray-800">{r.s.name}</p><p className="text-xs text-gray-500">{[r.prof.position,r.prof.department].filter(Boolean).join(' · ')||'No HR profile yet'}</p></div>
                    <div className="text-right w-24">{r.cur?<><p className="text-xl font-extrabold" style={{color:HR_BANDS.find(b=>b.k===hrBandOf(r.cur.score)).c}}>{r.cur.score}</p><p className="text-xs text-gray-400">{hrBandOf(r.cur.score)}</p></>:<p className="text-sm text-gray-400">—</p>}</div>
                    <div className="w-20 text-center text-sm font-bold">{d===null?<span className="text-gray-300">—</span>:d>0?<span className="text-green-600"><i className="fas fa-arrow-up mr-1"/>{d.toFixed(1)}</span>:d<0?<span className="text-red-600"><i className="fas fa-arrow-down mr-1"/>{Math.abs(d).toFixed(1)}</span>:<span className="text-gray-400">0</span>}</div>
                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${HR_FLAG[r.flag].c}`}><i className={`fas ${HR_FLAG[r.flag].i} mr-1`}/>{HR_FLAG[r.flag].l}</span>
                    {r.rec&&<span className={`px-3 py-1 rounded-full text-xs font-bold ${HR_DEC[r.rec.decision]}`} title={HR_REC[r.rec.recommendation]}>HR: {r.rec.recommendation.replace('_',' ')} · {r.rec.decision}</span>}
                </div>;})}</div>}
        </div></>}
    </div></div>;
}

function HRStaffDetail({row,recs,period,user,canRecommend,canDecide,notify,onBack}) {
    const {s,prof,hist,cur,flag}=row;
    const [rec,setRec]=useState(flag==='promotion'?'promotion':flag==='pip'?'pip':flag==='support'?'support':'not_yet');const [note,setNote]=useState('');const [busy,setBusy]=useState(false);
    const show=cur||hist[hist.length-1];const app=show?show.app:null;
    const submit=async()=>{if(note.trim().length<10){notify('Add a short justification (at least 10 characters)','error');return;}
        setBusy(true);const r=await fetch(`${SB}/rest/v1/hr_recommendations`,{method:'POST',headers:HJ,body:JSON.stringify({user_id:s.id,review_period:period||null,recommendation:rec,note:note.trim(),score_snapshot:cur?cur.score:null,recommended_by:user.name})});
        setBusy(false);if(r.ok){notify('Recommendation sent to Supervisor / ED');onBack();}else notify('Could not save','error');};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <div className="flex flex-wrap justify-between items-center gap-3"><div><h1 className="text-2xl font-extrabold">{s.name}</h1><p className="text-gray-500 text-sm">{[prof.position,prof.department].filter(Boolean).join(' · ')||'No HR profile yet'}</p></div>
            <span className={`px-3 py-1.5 rounded-full text-sm font-bold ${HR_FLAG[flag].c}`}><i className={`fas ${HR_FLAG[flag].i} mr-1`}/>{HR_FLAG[flag].l}</span></div></div>
        <div className="grid md:grid-cols-2 gap-6 mb-6">
            <div className="glass rounded-2xl p-6"><h2 className="font-bold mb-3">Score history</h2>
                {hist.length?<><MEChart type="line" labels={hist.map(h=>h.period)} data={[{label:'Score',data:hist.map(h=>h.score),borderColor:'#285B3C',backgroundColor:'#285B3C',tension:0.3}]} height={180}/>
                <div className="mt-3 space-y-1">{[...hist].reverse().map(h=><div key={h.period} className="flex justify-between text-sm"><span className="text-gray-600">{h.period}</span><span className="font-bold">{h.score} · {hrBandOf(h.score)}{h.disputed&&<span className="ml-2 text-xs text-red-600">disputed</span>}</span></div>)}</div></>
                :<p className="text-gray-400 text-sm">No completed appraisals yet</p>}</div>
            <div className="glass rounded-2xl p-6"><h2 className="font-bold mb-3">Competencies {show?`— ${show.period}`:''}</h2>
                {app?<div className="space-y-2">{comps.map(c=>{const v=Number((app.supervisor_ratings||{})[c.name])||0;return <div key={c.name}><div className="flex justify-between text-xs"><span className="text-gray-600">{c.name}</span><span className="font-bold">{v||'—'}/5</span></div>
                    <div className="w-full bg-gray-100 rounded-full h-2"><div className="h-2 rounded-full" style={{width:(v*20)+'%',background:v<3?'#CC2200':v<3.5?'#E8851A':'#285B3C'}}/></div></div>;})}
                    {app.attendance_deduction>0&&<p className="text-xs text-red-500 mt-2"><i className="fas fa-clock mr-1"/>−{app.attendance_deduction} pts attendance deduction</p>}</div>
                :<p className="text-gray-400 text-sm">—</p>}</div>
        </div>
        {app&&app.supervisor_overall_comments&&<div className="glass rounded-2xl p-6 mb-6"><h2 className="font-bold mb-2">Supervisor's overall comments ({show.period})</h2><p className="text-sm text-gray-700 whitespace-pre-wrap">{app.supervisor_overall_comments}</p></div>}
        {canRecommend&&<div className="glass rounded-2xl p-6 mb-6"><h2 className="font-bold mb-3"><i className="fas fa-user-check text-indigo-600 mr-2"/>HR recommendation {period?`for ${period}`:''}</h2>
            <div className="grid md:grid-cols-2 gap-2 mb-3">{Object.entries(HR_REC).map(([k,l])=><label key={k} className={`border-2 rounded-xl p-3 cursor-pointer text-sm font-semibold ${rec===k?'border-green-500 bg-green-50':'border-gray-200'}`}><input type="radio" checked={rec===k} onChange={()=>setRec(k)} className="mr-2"/>{l}</label>)}</div>
            <textarea rows={3} value={note} onChange={e=>setNote(e.target.value)} placeholder="Justification based on the appraisal findings" className="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm"/>
            <button onClick={submit} disabled={busy} className="btn-green text-white px-5 py-2.5 rounded-xl font-semibold text-sm mt-3 disabled:opacity-60">{busy?'Sending…':'Send to Supervisor / ED'}</button></div>}
        <div className="glass rounded-2xl p-6"><h2 className="font-bold mb-3">Recommendation history</h2>
            {recs.length===0?<p className="text-gray-400 text-sm">None yet</p>:<HRRecList recs={recs} nameOf={{[s.id]:s.name}} user={user} canDecide={canDecide} notify={notify} onChanged={onBack} hideName/>}</div>
    </div></div>;
}

function HRRecList({recs,nameOf,user,canDecide,notify,onChanged,onOpen,hideName}) {
    const [noteFor,setNoteFor]=useState({});
    const decide=async(r,decision)=>{if(!confirm(`${decision==='approved'?'Approve':'Reject'} this recommendation? It cannot be changed afterwards.`))return;
        const res=await fetch(`${SB}/rest/v1/hr_recommendations?id=eq.${r.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({decision,decided_by:user.name,decision_note:(noteFor[r.id]||'').trim()||null})});
        if(res.ok){notify(`Recommendation ${decision}`);onChanged();}else notify('Could not save — it may already have been decided','error');};
    return <div className="space-y-3">{recs.map(r=><div key={r.id} className="border-2 border-gray-100 rounded-xl p-4">
        <div className="flex flex-wrap justify-between items-start gap-2"><div>
            {!hideName&&<p className="font-bold text-gray-800 cursor-pointer hover:underline" onClick={()=>onOpen&&onOpen(r.user_id)}>{nameOf[r.user_id]||'Staff'}</p>}
            <p className="text-sm font-semibold text-gray-700">{HR_REC[r.recommendation]}{r.review_period?` · ${r.review_period}`:''}{r.score_snapshot!=null?` · score ${r.score_snapshot}`:''}</p>
            <p className="text-xs text-gray-500 mt-1">By {r.recommended_by||'HR'} on {polFmt(r.recommended_at)}</p></div>
            <span className={`px-3 py-1 rounded-full text-xs font-bold ${HR_DEC[r.decision]}`}>{r.decision}</span></div>
        {r.note&&<p className="text-sm text-gray-600 mt-2 bg-gray-50 rounded-lg p-3 whitespace-pre-wrap">{r.note}</p>}
        {r.decision!=='pending'&&<p className="text-xs text-gray-500 mt-2">{r.decision==='approved'?'Approved':'Rejected'} by {r.decided_by||'—'} on {polFmt(r.decided_at)}{r.decision_note?` — "${r.decision_note}"`:''}</p>}
        {r.decision==='pending'&&canDecide&&<div className="flex flex-wrap gap-2 mt-3">
            <input value={noteFor[r.id]||''} onChange={e=>setNoteFor({...noteFor,[r.id]:e.target.value})} placeholder="Decision note (optional)" className="flex-1 min-w-[200px] border-2 border-gray-200 rounded-xl px-3 py-2 text-sm"/>
            <button onClick={()=>decide(r,'approved')} className="btn-green text-white px-4 py-2 rounded-xl font-semibold text-sm"><i className="fas fa-check mr-1"/>Approve</button>
            <button onClick={()=>decide(r,'rejected')} className="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-xl font-semibold text-sm"><i className="fas fa-xmark mr-1"/>Reject</button></div>}
    </div>)}</div>;
}

function HRRecommendations({recs,nameOf,user,canDecide,canRecommend,candidates,period,notify,onOpen,onChanged}) {
    const pending=recs.filter(r=>r.decision==='pending');const decided=recs.filter(r=>r.decision!=='pending');
    return <>
        {canRecommend&&candidates.length>0&&<div className="glass rounded-2xl p-6 mb-6"><h2 className="font-bold mb-1"><i className="fas fa-arrow-trend-up text-indigo-600 mr-2"/>Promotion candidates without a recommendation for {period}</h2>
            <p className="text-xs text-gray-400 mb-3">80+ in the last two appraised quarters, no disputes. Open each to record your recommendation.</p>
            <div className="flex flex-wrap gap-2">{candidates.map(c=><button key={c.s.id} onClick={()=>onOpen(c.s.id)} className="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100">{c.s.name} · {c.cur.score}</button>)}</div></div>}
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="font-bold mb-3"><i className="fas fa-hourglass-half text-amber-500 mr-2"/>Awaiting decision ({pending.length}){canDecide?'':' — Supervisor or ED decides'}</h2>
            {pending.length===0?<p className="text-gray-400 text-sm">Nothing pending</p>:<HRRecList recs={pending} nameOf={nameOf} user={user} canDecide={canDecide} notify={notify} onChanged={onChanged} onOpen={onOpen}/>}</div>
        <div className="glass rounded-2xl p-6"><h2 className="font-bold mb-3"><i className="fas fa-clock-rotate-left text-gray-500 mr-2"/>Decided ({decided.length})</h2>
            {decided.length===0?<p className="text-gray-400 text-sm">None yet</p>:<HRRecList recs={decided} nameOf={nameOf} user={user} canDecide={false} notify={notify} onChanged={onChanged} onOpen={onOpen}/>}</div>
    </>;
}

function LeaveRequest({user,notify,onBack}) {
    const [type,setType]=useState('');const [start,setStart]=useState('');const [end,setEnd]=useState('');const [reason,setReason]=useState('');const [busy,setBusy]=useState(false);
    const submit=async()=>{if(!type||!start||!end||!reason.trim()){notify('Complete all fields','error');return;}setBusy(true);
        try{const r=await fetch(`${SB}/rest/v1/leave_requests`,{method:'POST',headers:HJ,body:JSON.stringify({employee_id:user.id,leave_type:type,start_date:start,end_date:end,reason})});if(r.ok){notify('Leave request submitted!');onBack();}else notify('Failed to submit','error');}catch(e){notify('Error','error');}setBusy(false);};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-purple-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold text-gray-800">Request Leave / Permission</h1><p className="text-gray-500 mt-1">{user.name}</p></div>
        <div className="glass rounded-2xl p-6 space-y-4">
            <select value={type} onChange={e=>setType(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"><option value="">Select type</option><option>Annual Leave</option><option>Sick Leave</option><option>Official Duty</option><option>Late Arrival</option><option>Early Closing</option></select>
            <input type="date" value={start} onChange={e=>setStart(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <input type="date" value={end} onChange={e=>setEnd(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <textarea value={reason} onChange={e=>setReason(e.target.value)} rows="4" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl" placeholder="Explain your request..."/>
            <button onClick={submit} disabled={busy} className="w-full py-4 rounded-xl font-bold text-white disabled:opacity-50" style={{background:'linear-gradient(135deg,#8b5cf6,#6d28d9)'}}>{busy?'Submitting...':'Submit Request'}</button>
        </div>
    </div></div>;
}

function LeaveAdmin({notify,onBack,readOnly}) {
    const [list,setList]=useState([]);const [names,setNames]=useState({});const [selected,setSelected]=useState(null);
    const load=()=>{fetch(`${SB}/rest/v1/leave_requests?order=created_at.desc`,{headers:H}).then(r=>r.json()).then(d=>{setList(d||[]);const ids=[...new Set(d.map(a=>a.employee_id))];if(ids.length>0)fetch(`${SB}/rest/v1/users?select=id,name&id=in.(${ids.join(',')})`,{headers:H}).then(r=>r.json()).then(us=>{const n={};us.forEach(u=>n[u.id]=u.name);setNames(n);});});};
    useEffect(()=>{load();},[]);
    if(selected) return <LeaveReview req={selected} name={names[selected.employee_id]} notify={notify} onDone={()=>{setSelected(null);load();}}/>;
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">Leave Requests</h1>{readOnly&&<p className="text-sm text-gray-500 mt-1">View only. Decisions are made by the supervisor.</p>}</div>
        {list.length===0?<div className="glass p-10 text-center text-gray-400">No leave requests</div>
        :<div className="space-y-3">{list.map(l=><div key={l.id} className="glass p-4 rounded-xl flex justify-between items-center cursor-pointer hover:shadow" onClick={()=>{if(!readOnly)setSelected(l);}}>
            <div><p className="font-bold">{names[l.employee_id]||'Employee'}</p><p className="text-sm text-gray-500">{l.leave_type?`${l.leave_type} · `:''}{new Date(l.start_date).toLocaleDateString()} → {new Date(l.end_date).toLocaleDateString()}</p>{readOnly&&l.reason&&<p className="text-xs text-gray-500 mt-1">{l.reason}</p>}{readOnly&&l.supervisor_comment&&<p className="text-xs text-gray-400 mt-1">Supervisor: {l.supervisor_comment}</p>}</div>
            <span className={`px-3 py-1 rounded-full text-xs font-bold ${l.status==='approved'?'bg-green-100 text-green-700':l.status==='rejected'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700'}`}>{l.status||'pending'}</span>
        </div>)}</div>}
    </div></div>;
}

function LeaveReview({req,name,notify,onDone}) {
    const [decision,setDecision]=useState(req.status||'');const [comment,setComment]=useState(req.supervisor_comment||'');const [busy,setBusy]=useState(false);
    const save=async()=>{if(!decision){notify('Choose approve or reject','error');return;}setBusy(true);const r=await fetch(`${SB}/rest/v1/leave_requests?id=eq.${req.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({status:decision,supervisor_comment:comment})});if(r.ok){notify('Decision saved');onDone();}else notify('Failed','error');setBusy(false);};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onDone} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">{name}</h1><p className="text-gray-500">{new Date(req.start_date).toLocaleDateString()} → {new Date(req.end_date).toLocaleDateString()}</p>{req.reason&&<p className="mt-2 text-sm">{req.reason}</p>}</div>
        <div className="glass rounded-2xl p-6 mb-6"><h3 className="font-bold mb-3">Decision</h3>
            <div className="flex gap-3 mb-4"><button onClick={()=>setDecision('approved')} className={`px-4 py-2 rounded-xl ${decision==='approved'?'bg-green-600 text-white':'bg-gray-100'}`}>Approve</button><button onClick={()=>setDecision('rejected')} className={`px-4 py-2 rounded-xl ${decision==='rejected'?'bg-red-600 text-white':'bg-gray-100'}`}>Reject</button></div>
            <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="Supervisor comment..." className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm"/>
        </div>
        <button onClick={save} disabled={busy} className="w-full btn-green text-white py-4 rounded-xl font-bold disabled:opacity-50">{busy?'Saving...':'Save Decision'}</button>
    </div></div>;
}

function Directory({user,notify,onBack}) {
    const [staff,setStaff]=useState([]);const [loading,setLoading]=useState(true);const [search,setSearch]=useState('');
    const load=async()=>{setLoading(true);try{const u=await fetch(`${SB}/rest/v1/users?select=id,name,email,role,is_mne`,{headers:H}).then(r=>r.json());const p=await fetch(`${SB}/rest/v1/staff_profiles`,{headers:H}).then(r=>r.json());setStaff(u.map(x=>({...x,...(p.find(pp=>pp.user_id===x.id)||{})})));}catch(e){}setLoading(false);};
    useEffect(()=>{load();},[]);
    const list=staff.filter(s=>[(s.name||''),(s.department||''),(s.position||'')].some(v=>v.toLowerCase().includes(search.toLowerCase())));
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">Staff Directory</h1><p className="text-gray-500">Contact information for RAHAMA staff</p></div>
        <div className="glass rounded-xl p-4 mb-6"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, department, position..." className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
        {loading?<div className="text-center py-10 text-gray-400"><i className="fas fa-spinner fa-spin"/></div>
        :<div className="space-y-3">{list.map(s=><div key={s.id} className="glass rounded-xl p-4"><h3 className="font-bold text-gray-800">{s.name}</h3><p className="text-sm text-gray-500">{s.position||'—'} · {s.department||'—'}</p>{s.phone&&<a href={`tel:${s.phone}`} className="text-indigo-600 text-sm font-semibold"><i className="fas fa-phone mr-1"/>Call</a>}<div><a href={`mailto:${s.email}`} className="text-blue-600 text-sm"><i className="fas fa-envelope mr-1"/>Email</a></div></div>)}{list.length===0&&<p className="text-center text-gray-400 py-6">No staff found</p>}</div>}
    </div></div>;
}

function HRAdmin({notify,onBack}) {
    const [staff,setStaff]=useState([]);const [profiles,setProfiles]=useState({});const [selected,setSelected]=useState(null);const [loading,setLoading]=useState(true);
    const load=async()=>{setLoading(true);try{const u=await fetch(`${SB}/rest/v1/users?select=id,name,email,role&role=eq.employee`,{headers:H}).then(r=>r.json());setStaff(u||[]);const ids=u.map(x=>x.id);if(ids.length>0){const pd=await fetch(`${SB}/rest/v1/staff_profiles?user_id=in.(${ids.join(',')})`,{headers:H}).then(r=>r.json());const map={};pd.forEach(p=>map[p.user_id]=p);setProfiles(map);}}catch(e){}setLoading(false);};
    useEffect(()=>{load();},[]);
    if(selected) return <HRProfileEdit staff={selected} profile={profiles[selected.id]} notify={notify} onDone={()=>{setSelected(null);load();}}/>;
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">HR Staff Profiles</h1></div>
        {loading?<div className="text-center py-10"><i className="fas fa-spinner fa-spin"/></div>
        :<div className="space-y-3">{staff.map(s=><div key={s.id} className="glass rounded-xl p-4 flex justify-between items-center cursor-pointer hover:shadow" onClick={()=>setSelected(s)}><div><p className="font-bold">{s.name}</p><p className="text-xs text-gray-500">{profiles[s.id]?.position||'No profile yet'}</p></div><i className="fas fa-pen text-blue-600"/></div>)}</div>}
    </div></div>;
}

function HRProfileEdit({staff,profile,notify,onDone}) {
    const [position,setPosition]=useState(profile?.position||'');const [department,setDepartment]=useState(profile?.department||'');const [phone,setPhone]=useState(profile?.phone||'');const [supervisor,setSupervisor]=useState(profile?.supervisor_name||'');const [busy,setBusy]=useState(false);
    const save=async()=>{setBusy(true);try{const payload={user_id:staff.id,position,department,phone,supervisor_name:supervisor};let r;if(profile){r=await fetch(`${SB}/rest/v1/staff_profiles?user_id=eq.${staff.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(payload)});}else{r=await fetch(`${SB}/rest/v1/staff_profiles`,{method:'POST',headers:HJ,body:JSON.stringify(payload)});}if(r.ok){notify('Profile saved');onDone();}else notify('Failed','error');}catch(e){notify('Error','error');}setBusy(false);};
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onDone} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">{staff.name}</h1></div>
        <div className="glass rounded-2xl p-6 space-y-4">
            <input value={position} onChange={e=>setPosition(e.target.value)} placeholder="Position" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <input value={department} onChange={e=>setDepartment(e.target.value)} placeholder="Department" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Phone number" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
            <input value={supervisor} onChange={e=>setSupervisor(e.target.value)} placeholder="Supervisor" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/>
        </div>
        <button onClick={save} disabled={busy} className="w-full btn-green text-white py-4 rounded-xl font-bold mt-4 disabled:opacity-50">{busy?'Saving...':'Save Profile'}</button>
        <EmergencyContactCard userId={staff.id} editorName="HR" notify={notify} note="Staff can fill this in themselves under My Emergency Contact. Visible to HR, Security and the supervisor only."/>
    </div></div>;
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
