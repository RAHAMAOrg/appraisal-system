/* ==================== POLICY SIGN-OFF (HR) ====================
   HR (users.is_hr) publishes a policy and assigns it to staff, like
   work plan activities. Staff open it, tick the declaration and sign
   under "My Policies". Signed records are insert-only in the database.
   The PDF is fetched only when someone opens it, never in list loads. */
const POLICY_DECLARATION='I confirm that I have read and understood this policy, and I agree to comply with it in my work with RAHAMA Girl Child and Women Empowerment Initiative.';
const POLICY_CATEGORIES=['Safeguarding & PSEAH','Human Resources','Finance','Procurement','Security & Safety','Compliance (AML/CFT)','Programme','Other'];
const HRep={...H,'Content-Type':'application/json','Prefer':'return=representation'};
const polToday=()=>new Date().toISOString().slice(0,10);
const polFmt=d=>d?new Date(d).toLocaleDateString():'—';
const polStatusOf=(pol,ack)=>ack?'signed':(pol&&pol.deadline&&pol.deadline<polToday()?'overdue':'pending');
const POL_BADGE={signed:'bg-green-100 text-green-700',pending:'bg-amber-100 text-amber-700',overdue:'bg-red-100 text-red-700'};
const POL_LABEL={signed:'✓ Signed',pending:'⏳ Pending',overdue:'⚠ Overdue'};
const polSafeLink=l=>typeof l==='string'&&/^https:\/\//i.test(l.trim());

/* Open the policy document. The new tab is opened immediately (before
   any await) so phone browsers don't block it as a popup. */
async function openPolicyDoc(pol,notify){
    if(pol.file_link){
        if(!polSafeLink(pol.file_link)){notify('This policy link is not a valid https:// link','error');return false;}
        window.open(pol.file_link.trim(),'_blank','noopener');return true;
    }
    const w=window.open('','_blank');
    try{
        const r=await fetch(`${SB}/rest/v1/policy_files?policy_id=eq.${pol.id}&select=file_data`,{headers:H});
        const d=r.ok?await r.json():[];
        if(!Array.isArray(d)||!d.length||!d[0].file_data) throw new Error('missing');
        const blob=await (await fetch(d[0].file_data)).blob();
        const url=URL.createObjectURL(blob);
        if(w) w.location.href=url; else window.open(url,'_blank');
        return true;
    }catch(e){if(w)w.close();notify('Could not open the policy document','error');return false;}
}

/* Everything assigned to one person, with status. Used by My Policies
   and by the dashboard counter. Unsigned items on retired policies are
   dropped (nobody needs to sign a retired version). */
async function loadMyPolicyItems(userId){
    const a=await fetch(`${SB}/rest/v1/policy_assignments?user_id=eq.${userId}&select=id,policy_id,assigned_at,opened_at`,{headers:H}).then(r=>r.ok?r.json():[]);
    const asg=Array.isArray(a)?a:[];
    if(!asg.length) return [];
    const ids=[...new Set(asg.map(x=>x.policy_id))];
    const p=await fetch(`${SB}/rest/v1/policies?id=in.(${ids.join(',')})&select=id,title,version,category,description,file_name,file_link,effective_date,deadline,status`,{headers:H}).then(r=>r.ok?r.json():[]);
    const k=await fetch(`${SB}/rest/v1/policy_acknowledgements?user_id=eq.${userId}&select=id,assignment_id,signed_at`,{headers:H}).then(r=>r.ok?r.json():[]);
    const pm={};(Array.isArray(p)?p:[]).forEach(x=>pm[x.id]=x);
    const km={};(Array.isArray(k)?k:[]).forEach(x=>km[x.assignment_id]=x);
    const order={overdue:0,pending:1,signed:2};
    return asg.map(x=>{const pol=pm[x.policy_id];const ack=km[x.id];return {asg:x,pol,ack,status:polStatusOf(pol,ack)};})
        .filter(it=>it.pol&&(it.ack||it.pol.status==='active'))
        .sort((a,b)=>order[a.status]-order[b.status]);
}

function SignaturePad({onChange}) {
    const ref=useRef(null);const drawing=useRef(false);const has=useRef(false);
    const setup=()=>{const c=ref.current;if(!c)return;const ratio=window.devicePixelRatio||1;const w=c.offsetWidth||300;const h=160;
        c.width=w*ratio;c.height=h*ratio;const ctx=c.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);
        ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';};
    useEffect(()=>{setup();},[]);
    const pos=e=>{const r=ref.current.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
    /* Small white-background JPEG (~10 KB) so signatures stay light */
    const exportSig=()=>{const c=ref.current;const out=document.createElement('canvas');const W=400;const SH=Math.round(W*c.height/c.width);
        out.width=W;out.height=SH;const o=out.getContext('2d');o.fillStyle='#ffffff';o.fillRect(0,0,W,SH);o.drawImage(c,0,0,W,SH);return out.toDataURL('image/jpeg',0.7);};
    const down=e=>{e.preventDefault();try{ref.current.setPointerCapture(e.pointerId);}catch(_){}drawing.current=true;const p=pos(e);const ctx=ref.current.getContext('2d');ctx.beginPath();ctx.moveTo(p.x,p.y);};
    const move=e=>{if(!drawing.current)return;e.preventDefault();const p=pos(e);const ctx=ref.current.getContext('2d');ctx.lineTo(p.x,p.y);ctx.stroke();has.current=true;};
    const up=()=>{if(!drawing.current)return;drawing.current=false;if(has.current)onChange(exportSig());};
    const clear=()=>{setup();has.current=false;onChange(null);};
    return <div>
        <canvas ref={ref} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerLeave={up}
            className="w-full bg-white border-2 border-dashed border-gray-300 rounded-xl" style={{height:160,touchAction:'none',cursor:'crosshair'}}/>
        <div className="flex justify-between items-center mt-2"><p className="text-xs text-gray-400">Sign inside the box with your finger or mouse</p>
            <button type="button" onClick={clear} className="text-sm text-red-500 font-semibold hover:underline"><i className="fas fa-eraser mr-1"/>Clear</button></div>
    </div>;
}

function MyPolicies({user,notify,onBack}) {
    const [items,setItems]=useState([]);const [loading,setLoading]=useState(true);const [sel,setSel]=useState(null);
    const load=async()=>{setLoading(true);try{setItems(await loadMyPolicyItems(user.id));}catch(e){setItems([]);}setLoading(false);};
    useEffect(()=>{load();},[]);
    if(sel) return <PolicySign item={sel} user={user} notify={notify} onDone={()=>{setSel(null);load();}}/>;
    const open=items.filter(i=>i.status!=='signed');const signed=items.filter(i=>i.status==='signed');
    const card=it=><div key={it.asg.id} className="border-2 border-gray-100 rounded-xl p-4 flex flex-wrap justify-between items-center gap-3 hover:border-green-200">
        <div><p className="font-bold text-gray-800">{it.pol.title} <span className="text-xs font-semibold text-gray-400">v{it.pol.version}</span></p>
            <p className="text-xs text-gray-500 mt-1">{it.pol.category||'Policy'}{it.status==='signed'?` · Signed ${polFmt(it.ack.signed_at)}`:` · Sign by ${polFmt(it.pol.deadline)}`}</p></div>
        <div className="flex items-center gap-2"><span className={`px-3 py-1 rounded-full text-xs font-bold ${POL_BADGE[it.status]}`}>{POL_LABEL[it.status]}</span>
            <button onClick={()=>setSel(it)} className={`${it.status==='signed'?'bg-gray-100 text-gray-600 hover:bg-gray-200':'btn-green text-white'} px-4 py-2 rounded-xl font-semibold text-sm`}>
                <i className={`fas ${it.status==='signed'?'fa-eye':'fa-file-signature'} mr-2`}/>{it.status==='signed'?'View':'Read & Sign'}</button></div>
    </div>;
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-4xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <h1 className="text-2xl font-extrabold">My Policies</h1><p className="text-gray-500 text-sm mt-1">Policies HR has asked you to read and sign</p></div>
        {loading?<div className="text-center py-10"><i className="fas fa-spinner fa-spin"/></div>:<>
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="text-lg font-bold mb-4"><i className="fas fa-hourglass-half text-amber-500 mr-2"/>To sign ({open.length})</h2>
            {open.length===0?<div className="text-center py-6 text-gray-400"><i className="fas fa-check-double text-3xl mb-2 text-green-400"/><p className="font-semibold">Nothing waiting for you</p></div>
            :<div className="space-y-3">{open.map(card)}</div>}</div>
        <div className="glass rounded-2xl p-6"><h2 className="text-lg font-bold mb-4"><i className="fas fa-circle-check text-green-600 mr-2"/>Signed ({signed.length})</h2>
            {signed.length===0?<p className="text-center py-6 text-gray-400 font-semibold">No signed policies yet</p>:<div className="space-y-3">{signed.map(card)}</div>}</div></>}
    </div></div>;
}

function PolicySign({item,user,notify,onDone}) {
    const {asg,pol,ack}=item;const done=!!ack;
    const [opened,setOpened]=useState(!!asg.opened_at);const [agreed,setAgreed]=useState(false);const [sig,setSig]=useState(null);const [busy,setBusy]=useState(false);
    const openDoc=async()=>{const ok=await openPolicyDoc(pol,notify);
        if(ok&&!opened){setOpened(true);fetch(`${SB}/rest/v1/policy_assignments?id=eq.${asg.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({opened_at:new Date().toISOString()})}).catch(()=>{});}};
    const sign=async()=>{
        if(!opened){notify('Please open and read the policy first','error');return;}
        if(!agreed){notify('Please tick the declaration','error');return;}
        if(!sig){notify('Please add your signature','error');return;}
        setBusy(true);
        try{
            const r=await fetch(`${SB}/rest/v1/policy_acknowledgements`,{method:'POST',headers:HJ,body:JSON.stringify({
                policy_id:pol.id,assignment_id:asg.id,user_id:user.id,declaration:POLICY_DECLARATION,signature_data:sig,user_agent:navigator.userAgent.slice(0,300)})});
            if(r.ok){notify('Policy signed. Thank you.');onDone();}
            else if(r.status===409){notify('You have already signed this policy');onDone();}
            else notify('Signing failed — please try again','error');
        }catch(e){notify('Signing failed — check your connection','error');}
        setBusy(false);
    };
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onDone} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <h1 className="text-2xl font-extrabold">{pol.title}</h1>
            <p className="text-gray-500 text-sm mt-1">Version {pol.version} · {pol.category||'Policy'} · Effective {polFmt(pol.effective_date)}</p>
            {pol.description&&<p className="text-sm text-gray-600 mt-3">{pol.description}</p>}</div>
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="font-bold mb-3"><span className="w-7 h-7 inline-flex items-center justify-center rounded-full bg-green-100 text-green-700 text-sm mr-2">1</span>Read the policy</h2>
            <button onClick={openDoc} className="btn-green text-white px-5 py-2.5 rounded-xl font-semibold text-sm"><i className="fas fa-file-pdf mr-2"/>Open policy document</button>
            {opened&&<span className="ml-3 text-sm text-green-700 font-semibold"><i className="fas fa-check mr-1"/>Opened</span>}</div>
        {done?<div className="glass rounded-2xl p-6"><div className="bg-green-50 border-2 border-green-200 rounded-xl p-4">
                <p className="font-bold text-green-800"><i className="fas fa-circle-check mr-2"/>You signed this policy on {new Date(ack.signed_at).toLocaleString()}</p>
                <p className="text-sm text-green-700 mt-1">Your signed record is kept by HR and cannot be changed.</p></div></div>
        :<div className={`glass rounded-2xl p-6 ${opened?'':'opacity-50 pointer-events-none'}`}>
            <h2 className="font-bold mb-3"><span className="w-7 h-7 inline-flex items-center justify-center rounded-full bg-green-100 text-green-700 text-sm mr-2">2</span>Confirm and sign</h2>
            {!opened&&<p className="text-sm text-amber-600 mb-3">Open the policy document first to unlock this step.</p>}
            <label className="flex items-start gap-3 bg-gray-50 rounded-xl p-4 mb-4 cursor-pointer"><input type="checkbox" checked={agreed} onChange={e=>setAgreed(e.target.checked)} className="mt-1 w-5 h-5"/>
                <span className="text-sm text-gray-700">{POLICY_DECLARATION}</span></label>
            <SignaturePad onChange={setSig}/>
            <p className="text-xs text-gray-400 mt-3">Signing as <b>{user.name}</b> ({user.email}). The date and time are recorded by the system.</p>
            <button onClick={sign} disabled={busy} className="btn-green text-white px-6 py-3 rounded-xl font-bold mt-4 w-full disabled:opacity-60">
                {busy?<><i className="fas fa-spinner fa-spin mr-2"/>Signing…</>:<><i className="fas fa-file-signature mr-2"/>Sign policy</>}</button>
        </div>}
    </div></div>;
}

/* HR management (is_hr) — or read-only compliance view for the supervisor */
function PolicyAdmin({user,notify,onBack,readOnly}) {
    const [pols,setPols]=useState([]);const [asg,setAsg]=useState([]);const [acks,setAcks]=useState([]);const [staff,setStaff]=useState([]);
    const [loading,setLoading]=useState(true);const [view,setView]=useState('list');const [selId,setSelId]=useState(null);const [tab,setTab]=useState('active');
    const load=async()=>{setLoading(true);
        try{
            const [p,a,k,u]=await Promise.all([
                fetch(`${SB}/rest/v1/policies?select=id,title,version,category,description,file_name,file_link,effective_date,deadline,status,supersedes_id,created_by,created_at&order=created_at.desc`,{headers:H}).then(r=>r.ok?r.json():[]),
                fetch(`${SB}/rest/v1/policy_assignments?select=id,policy_id,user_id,assigned_at,opened_at`,{headers:H}).then(r=>r.ok?r.json():[]),
                fetch(`${SB}/rest/v1/policy_acknowledgements?select=id,policy_id,assignment_id,user_id,signed_at`,{headers:H}).then(r=>r.ok?r.json():[]),
                fetch(`${SB}/rest/v1/users?select=id,name,email,role,is_active&order=name.asc`,{headers:H}).then(r=>r.ok?r.json():[])]);
            setPols(Array.isArray(p)?p:[]);setAsg(Array.isArray(a)?a:[]);setAcks(Array.isArray(k)?k:[]);setStaff(Array.isArray(u)?u:[]);
        }catch(e){notify('Could not load policies','error');}
        setLoading(false);};
    useEffect(()=>{load();},[]);
    const ackByAsg={};acks.forEach(k=>ackByAsg[k.assignment_id]=k);
    const statsFor=pol=>{const rows=asg.filter(a=>a.policy_id===pol.id);let s=0,p=0,o=0;rows.forEach(a=>{const st=polStatusOf(pol,ackByAsg[a.id]);if(st==='signed')s++;else if(st==='overdue')o++;else p++;});return {total:rows.length,signed:s,pending:p,overdue:o};};
    if(view==='publish') return <PolicyPublish user={user} staff={staff} pols={pols} notify={notify} onDone={()=>{setView('list');load();}}/>;
    if(view==='detail'){const pol=pols.find(x=>x.id===selId);if(pol) return <PolicyDetail pol={pol} asg={asg.filter(a=>a.policy_id===pol.id)} ackByAsg={ackByAsg} staff={staff} user={user} readOnly={readOnly} notify={notify} onBack={()=>{setView('list');load();}}/>;}
    const list=pols.filter(p=>tab==='active'?p.status==='active':p.status!=='active');
    const allActive=pols.filter(p=>p.status==='active').map(statsFor);
    const tot=allActive.reduce((t,s)=>({total:t.total+s.total,signed:t.signed+s.signed,overdue:t.overdue+s.overdue}),{total:0,signed:0,overdue:0});
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onBack} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <div className="flex flex-wrap justify-between items-center gap-3"><div><h1 className="text-2xl font-extrabold">{readOnly?'Policy Compliance':'HR — Policy Management'}</h1>
                <p className="text-gray-500 text-sm mt-1">{readOnly?'Who has read and signed each RAHAMA policy':'Publish policies, assign staff and track sign-off'}</p></div>
            {!readOnly&&<button onClick={()=>setView('publish')} className="btn-green text-white px-5 py-2.5 rounded-xl font-semibold text-sm"><i className="fas fa-plus mr-2"/>Publish policy</button>}</div></div>
        <div className="grid grid-cols-3 gap-4 mb-6">{[{l:'Active policies',v:allActive.length,c:'text-gray-800'},{l:'Sign-off rate',v:tot.total?Math.round(100*tot.signed/tot.total)+'%':'—',c:'text-green-600'},{l:'Overdue signatures',v:tot.overdue,c:'text-red-600'}]
            .map((s,i)=><div key={i} className="glass rounded-xl p-5"><p className="text-xs font-bold text-gray-400 uppercase tracking-wider">{s.l}</p><p className={`text-3xl font-extrabold mt-1 ${s.c}`}>{s.v}</p></div>)}</div>
        <div className="glass rounded-2xl p-6">
            <div className="flex gap-2 mb-5 border-b pb-4">{[['active','Active'],['archive','Retired / Drafts']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab===k?'btn-green text-white':'text-gray-500 hover:bg-gray-100'}`}>{l}</button>)}</div>
            {loading?<div className="text-center py-10"><i className="fas fa-spinner fa-spin"/></div>
            :list.length===0?<div className="text-center py-10 text-gray-400"><i className="fas fa-file-shield text-4xl mb-3"/><p className="font-semibold">No policies here yet</p></div>
            :<div className="space-y-3">{list.map(pol=>{const s=statsFor(pol);const pct=s.total?Math.round(100*s.signed/s.total):0;
                return <div key={pol.id} onClick={()=>{setSelId(pol.id);setView('detail');}} className="border-2 border-gray-100 rounded-xl p-5 cursor-pointer hover:border-green-200">
                    <div className="flex flex-wrap justify-between items-start gap-3"><div>
                        <p className="font-bold text-gray-800">{pol.title} <span className="text-xs font-semibold text-gray-400">v{pol.version}</span>
                            {pol.status!=='active'&&<span className="ml-2 px-2 py-0.5 rounded-full text-xs font-bold bg-gray-200 text-gray-600">{pol.status==='draft'?'Incomplete draft':'Retired'}</span>}</p>
                        <p className="text-xs text-gray-500 mt-1">{pol.category||'Policy'} · Deadline {polFmt(pol.deadline)}</p></div>
                        <div className="text-right text-sm"><span className="font-bold text-green-700">{s.signed}</span><span className="text-gray-400">/{s.total} signed</span>
                            {s.overdue>0&&<span className="ml-2 px-2 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-700">{s.overdue} overdue</span>}</div></div>
                    <div className="w-full bg-gray-100 rounded-full h-2 mt-3"><div className="h-2 rounded-full bg-green-500" style={{width:pct+'%'}}/></div>
                </div>;})}</div>}
        </div>
    </div></div>;
}

function StaffPicker({staff,selected,setSelected,exclude}) {
    const avail=staff.filter(s=>s.is_active!==false&&!(exclude||[]).includes(s.id));
    const toggle=id=>setSelected(selected.includes(id)?selected.filter(x=>x!==id):[...selected,id]);
    return <div>
        <div className="flex gap-3 mb-2 text-sm"><button type="button" onClick={()=>setSelected(avail.map(s=>s.id))} className="text-blue-600 font-semibold hover:underline">Select all</button>
            <button type="button" onClick={()=>setSelected([])} className="text-gray-500 font-semibold hover:underline">Clear</button><span className="text-gray-400 ml-auto">{selected.length} selected</span></div>
        <div className="max-h-72 overflow-y-auto border-2 border-gray-100 rounded-xl divide-y">{avail.length===0?<p className="p-4 text-sm text-gray-400">Everyone is already assigned.</p>
            :avail.map(s=><label key={s.id} className="flex items-center gap-3 p-3 cursor-pointer hover:bg-gray-50"><input type="checkbox" checked={selected.includes(s.id)} onChange={()=>toggle(s.id)} className="w-4 h-4"/>

}

function PolicyPublish({user,staff,pols,notify,onDone}) {
    const [f,setF]=useState({title:'',version:'1.0',category:POLICY_CATEGORIES[0],description:'',effective_date:polToday(),deadline:'',file_link:'',supersedes_id:''});
    const [file,setFile]=useState(null);const [mode,setMode]=useState('upload');const [who,setWho]=useState('all');const [sel,setSel]=useState([]);const [busy,setBusy]=useState(false);
    const fileRef=useRef(null);
    const set=(k,v)=>setF(x=>({...x,[k]:v}));
    const activeStaff=staff.filter(s=>s.is_active!==false);
    const toB64=fl=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(fl);});
    const publish=async()=>{
        if(!f.title.trim()||!f.version.trim()){notify('Title and version are required','error');return;}
        if(!f.deadline){notify('Set a deadline for signing','error');return;}
        if(mode==='upload'){if(!file){notify('Upload the policy PDF','error');return;}if(file.size>5*1024*1024){notify('File too large (max 5MB)','error');return;}}
        else if(!polSafeLink(f.file_link)){notify('Paste a full link starting with https://','error');return;}
        const ids=who==='all'?activeStaff.map(s=>s.id):sel;
        if(!ids.length){notify('Choose at least one staff member','error');return;}
        if(!confirm(`Publish "${f.title}" v${f.version} and assign it to ${ids.length} staff?`))return;
        setBusy(true);
        try{
            const pr=await fetch(`${SB}/rest/v1/policies`,{method:'POST',headers:HRep,body:JSON.stringify({
                title:f.title.trim(),version:f.version.trim(),category:f.category,description:f.description.trim()||null,
                file_name:mode==='upload'?file.name:null,file_link:mode==='link'?f.file_link.trim():null,
                effective_date:f.effective_date||null,deadline:f.deadline,status:'draft',
                supersedes_id:f.supersedes_id?Number(f.supersedes_id):null,created_by:user.name})});
            const pd=pr.ok?await pr.json():null;const pol=Array.isArray(pd)?pd[0]:null;
            if(!pol){throw new Error('policy');}
            if(mode==='upload'){
                const fr=await fetch(`${SB}/rest/v1/policy_files`,{method:'POST',headers:HJ,body:JSON.stringify({policy_id:pol.id,file_name:file.name,file_type:file.type,file_data:await toB64(file)})});
                if(!fr.ok) throw new Error('file');
            }
            const ar=await fetch(`${SB}/rest/v1/policy_assignments`,{method:'POST',headers:HJ,body:JSON.stringify(ids.map(id=>({policy_id:pol.id,user_id:id,assigned_by:user.name})))});
            if(!ar.ok) throw new Error('assign');
            if(f.supersedes_id) await fetch(`${SB}/rest/v1/policies?id=eq.${Number(f.supersedes_id)}`,{method:'PATCH',headers:HJ,body:JSON.stringify({status:'retired'})});
            const act=await fetch(`${SB}/rest/v1/policies?id=eq.${pol.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({status:'active'})});
            if(!act.ok) throw new Error('activate');
            notify(`Published and assigned to ${ids.length} staff`);onDone();
        }catch(e){notify('Publishing did not finish. Nothing was sent to staff — check "Retired / Drafts" and publish again.','error');}
        setBusy(false);
    };
    const inp="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:border-green-400 outline-none";
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6"><button onClick={onDone} className="text-blue-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button><h1 className="text-2xl font-extrabold">Publish a policy</h1></div>
        <div className="glass rounded-2xl p-6 mb-6 space-y-4">
            <h2 className="font-bold">Policy details</h2>
            <div className="grid md:grid-cols-3 gap-3"><div className="md:col-span-2"><label className="text-xs font-bold text-gray-500">Title *</label><input className={inp} value={f.title} onChange={e=>set('title',e.target.value)} placeholder="e.g. PSEAH Policy"/></div>
                <div><label className="text-xs font-bold text-gray-500">Version *</label><input className={inp} value={f.version} onChange={e=>set('version',e.target.value)}/></div></div>
            <div className="grid md:grid-cols-3 gap-3"><div><label className="text-xs font-bold text-gray-500">Category</label><select className={inp} value={f.category} onChange={e=>set('category',e.target.value)}>{POLICY_CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></div>
                <div><label className="text-xs font-bold text-gray-500">Effective date</label><input type="date" className={inp} value={f.effective_date} onChange={e=>set('effective_date',e.target.value)}/></div>
                <div><label className="text-xs font-bold text-gray-500">Sign by (deadline) *</label><input type="date" className={inp} value={f.deadline} onChange={e=>set('deadline',e.target.value)}/></div></div>
            <div><label className="text-xs font-bold text-gray-500">Short note to staff (optional)</label><textarea rows={2} className={inp} value={f.description} onChange={e=>set('description',e.target.value)} placeholder="What changed, or why this matters"/></div>
            <div><label className="text-xs font-bold text-gray-500">Does this replace an existing policy?</label><select className={inp} value={f.supersedes_id} onChange={e=>set('supersedes_id',e.target.value)}>
                <option value="">No — this is a new policy</option>{pols.filter(p=>p.status==='active').map(p=><option key={p.id} value={p.id}>Replaces: {p.title} v{p.version} (old version will be retired)</option>)}</select></div>
        </div>
        <div className="glass rounded-2xl p-6 mb-6">
            <h2 className="font-bold mb-3">Policy document</h2>
            <div className="flex gap-2 mb-3">{[['upload','Upload PDF'],['link','Paste a link']].map(([k,l])=><button key={k} type="button" onClick={()=>setMode(k)} className={`px-4 py-2 rounded-xl text-sm font-bold ${mode===k?'btn-green text-white':'bg-gray-100 text-gray-600'}`}>{l}</button>)}</div>
            {mode==='upload'?<div className={`border-2 border-dashed rounded-xl p-5 text-center cursor-pointer hover:border-green-400 ${file?'border-green-400 bg-green-50':'border-gray-300'}`} onClick={()=>fileRef.current&&fileRef.current.click()}>
                    {file?<span className="text-sm font-semibold text-green-700"><i className="fas fa-file-circle-check mr-2"/>{file.name} ({(file.size/1024).toFixed(0)} KB)</span>
                    :<span className="text-sm text-gray-500"><i className="fas fa-cloud-arrow-up mr-2"/>Click to choose the PDF (max 5 MB)</span>}
                    <input ref={fileRef} type="file" accept="application/pdf" className="hidden" onChange={e=>setFile(e.target.files[0]||null)}/></div>
            :<input className={inp} value={f.file_link} onChange={e=>set('file_link',e.target.value)} placeholder="https://drive.google.com/… (make sure staff can open it)"/>}
        </div>
        <div className="glass rounded-2xl p-6 mb-6">
            <h2 className="font-bold mb-3">Who must sign?</h2>
            <div className="flex gap-2 mb-3">{[['all',`All active staff (${activeStaff.length})`],['some','Selected staff']].map(([k,l])=><button key={k} type="button" onClick={()=>setWho(k)} className={`px-4 py-2 rounded-xl text-sm font-bold ${who===k?'btn-green text-white':'bg-gray-100 text-gray-600'}`}>{l}</button>)}</div>
            {who==='some'&&<StaffPicker staff={staff} selected={sel} setSelected={setSel}/>}
        </div>
        <button onClick={publish} disabled={busy} className="btn-green text-white px-6 py-3 rounded-xl font-bold w-full disabled:opacity-60">{busy?<><i className="fas fa-spinner fa-spin mr-2"/>Publishing…</>:<><i className="fas fa-paper-plane mr-2"/>Publish and assign</>}</button>
    </div></div>;
}

function PolicyDetail({pol,asg,ackByAsg,staff,user,readOnly,notify,onBack}) {
    const [adding,setAdding]=useState(false);const [sel,setSel]=useState([]);const [busy,setBusy]=useState(false);const [sigView,setSigView]=useState(null);const [filter,setFilter]=useState('all');
    const byId={};staff.forEach(s=>byId[s.id]=s);
    const rows=asg.map(a=>{const ack=ackByAsg[a.id];return {a,ack,s:byId[a.user_id]||{name:'Unknown',email:''},status:polStatusOf(pol,ack)};})
        .sort((x,y)=>({overdue:0,pending:1,signed:2}[x.status]-{overdue:0,pending:1,signed:2}[y.status])||x.s.name.localeCompare(y.s.name));
    const shown=filter==='all'?rows:rows.filter(r=>filter==='open'?r.status!=='signed':r.status===filter);
    const unsigned=rows.filter(r=>r.status!=='signed'&&r.s.email);
    const pmsUrl=window.location.origin+window.location.pathname;
    const notifyStaff=()=>{
        if(!unsigned.length){notify('Everyone has signed');return;}
        const subject=`Action required: please read and sign the ${pol.title} (v${pol.version})`;
        const body=`Dear colleague,\n\nHR has published the ${pol.title} (version ${pol.version}). Please log in to the RAHAMA Staff Portal, open "My Policies", read the policy and sign it by ${polFmt(pol.deadline)}.\n\nStaff Portal: ${pmsUrl}\n\nThank you,\nHR, RAHAMA Girl Child and Women Empowerment Initiative`;
        const url=`mailto:?bcc=${unsigned.map(r=>r.s.email).join(',')}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        if(url.length>1900) notify('The list is long — if your email app cuts it off, use "Copy emails" instead','error');
        window.location.href=url;
    };
    const copyEmails=async()=>{try{await navigator.clipboard.writeText(unsigned.map(r=>r.s.email).join(', '));notify(`Copied ${unsigned.length} email(s)`);}catch(e){notify('Could not copy','error');}};
    const exportXlsx=()=>{
        const data=rows.map(r=>({'Staff':r.s.name,'Email':r.s.email,'Status':r.status==='signed'?'Signed':r.status==='overdue'?'Overdue':'Pending',
            'Assigned':polFmt(r.a.assigned_at),'Opened document':r.a.opened_at?new Date(r.a.opened_at).toLocaleString():'','Signed at':r.ack?new Date(r.ack.signed_at).toLocaleString():''}));
        const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sign-off');
        XLSX.writeFile(wb,`${pol.title.replace(/[^\w\- ]+/g,'').trim()} v${pol.version} - sign-off.xlsx`);
    };
    const showSig=async r=>{try{const d=await fetch(`${SB}/rest/v1/policy_acknowledgements?id=eq.${r.ack.id}&select=signer_name,signed_at,declaration,signature_data,policy_title,policy_version`,{headers:H}).then(x=>x.json());if(Array.isArray(d)&&d.length)setSigView(d[0]);}catch(e){notify('Could not load signature','error');}};
    const assignMore=async()=>{if(!sel.length){notify('Choose staff to add','error');return;}setBusy(true);
        const r=await fetch(`${SB}/rest/v1/policy_assignments`,{method:'POST',headers:HJ,body:JSON.stringify(sel.map(id=>({policy_id:pol.id,user_id:id,assigned_by:user.name})))});
        setBusy(false);if(r.ok){notify(`Assigned to ${sel.length} more staff`);setAdding(false);setSel([]);onBack();}else notify('Could not assign','error');};
    const retire=async()=>{if(!confirm(`Retire "${pol.title}" v${pol.version}? Staff who haven't signed will no longer be asked to. Signed records are kept.`))return;
        const r=await fetch(`${SB}/rest/v1/policies?id=eq.${pol.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({status:'retired'})});if(r.ok){notify('Policy retired');onBack();}else notify('Failed','error');};
    const reactivate=async()=>{const r=await fetch(`${SB}/rest/v1/policies?id=eq.${pol.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({status:'active'})});if(r.ok){notify('Policy is active again');onBack();}else notify('Failed','error');};

/* ==================== STAFF PORTAL ====================
   New home for everyone. Reuses every existing screen unchanged —
   this only regroups them into My Workspace + HR / M&E / Security
   portals + FMS. The old dashboards are kept and can be opened with
   ?classic=1 in the address as a fallback. */
const LEAVE_ENTITLEMENT=22, LATES_PER_LEAVE_DAY=5;
const PORTAL_KEYS=[['story','Our Story: why RAHAMA was founded'],['mission','Our Mission'],['vision','Our Vision'],['values','Core Values (one per line)'],['where_we_work','Where We Work (one per line)'],['contacts','Who To Contact (one per line)'],['safeguarding','How to Report a Safeguarding / PSEAH Concern']];
const portalToday=()=>new Date().toISOString().slice(0,10);
const weekdaysInYear=(a,b,yr)=>{if(!a)return 0;let s=new Date(String(a).slice(0,10)+'T12:00:00'),e=new Date(String(b||a).slice(0,10)+'T12:00:00');
    const ys=new Date(yr+'-01-01T12:00:00'),ye=new Date(yr+'-12-31T12:00:00');if(s<ys)s=ys;if(e>ye)e=ye;let n=0;
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){const w=d.getDay();if(w!==0&&w!==6)n++;}return n;};
const datesInRange=(a,b)=>{const out=[];if(!a)return out;let d=new Date(String(a).slice(0,10)+'T12:00:00');const e=new Date(String(b||a).slice(0,10)+'T12:00:00');
    while(d<=e){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}return out;};
const PortalBack=({onBack,label})=><button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>{label||'Back to Staff Portal'}</button>;

function MyLeave({user,notify,onBack}) {
    const [view,setView]=useState('list');const [leaves,setLeaves]=useState([]);const [lates,setLates]=useState([]);const [loading,setLoading]=useState(true);
    const yr=new Date().getFullYear();
    const load=async()=>{setLoading(true);
        try{const [l,a]=await Promise.all([
            fetch(`${SB}/rest/v1/leave_requests?employee_id=eq.${user.id}&order=created_at.desc`,{headers:H}).then(r=>r.ok?r.json():[]),
            fetch(`${SB}/rest/v1/attendance?employee_id=eq.${user.id}&status=eq.late&date=gte.${yr}-01-01&select=date`,{headers:H}).then(r=>r.ok?r.json():[])]);
            setLeaves(Array.isArray(l)?l:[]);setLates(Array.isArray(a)?a:[]);}catch(e){}
        setLoading(false);};
    useEffect(()=>{load();},[]);
    if(view==='request') return <LeaveRequest user={user} notify={notify} onBack={()=>{setView('list');load();}}/>;
    const inYr=l=>String(l.start_date||'').slice(0,4)<=String(yr)&&String(l.end_date||l.start_date||'').slice(0,4)>=String(yr);
    const annual=leaves.filter(l=>l.leave_type==='Annual Leave'&&inYr(l));
    const taken=annual.filter(l=>l.status==='approved').reduce((t,l)=>t+weekdaysInYear(l.start_date,l.end_date,yr),0);
    const pendingDays=annual.filter(l=>!l.status||l.status==='pending').reduce((t,l)=>t+weekdaysInYear(l.start_date,l.end_date,yr),0);
    const excused=new Set();leaves.filter(l=>l.leave_type==='Late Arrival'&&l.status==='approved').forEach(l=>datesInRange(l.start_date,l.end_date).forEach(d=>excused.add(d)));
    const lateCount=lates.filter(x=>!excused.has(String(x.date).slice(0,10))).length;
    const lateDed=Math.floor(lateCount/LATES_PER_LEAVE_DAY);
    const remaining=LEAVE_ENTITLEMENT-taken-lateDed;
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><PortalBack onBack={onBack}/>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">My Leave</h1><p className="text-gray-500 mt-1">Your {yr} balance, requests and decisions</p></div>
        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>:<>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-3">{[
            {l:'Annual entitlement',v:LEAVE_ENTITLEMENT,c:'text-gray-800'},{l:'Annual leave taken',v:taken,c:'text-blue-600'},
            {l:`Late deduction (${lateCount} late${lateCount!==1?'s':''})`,v:lateDed,c:'text-amber-600'},{l:'Days remaining',v:remaining,c:remaining<0?'text-red-600':'text-green-600'}]
            .map((t,i)=><div key={i} className="glass rounded-xl p-5"><p className="text-xs font-bold text-gray-400 uppercase tracking-wider">{t.l}</p><p className={`text-3xl font-extrabold mt-1 ${t.c}`}>{t.v}</p></div>)}</div>
        <p className="text-xs text-gray-500 mb-6 px-1">{pendingDays>0?`${pendingDays} more day${pendingDays!==1?'s':''} of annual leave awaiting approval. `:''}Every {LATES_PER_LEAVE_DAY} late clock-ins this year count as 1 day of annual leave (lates covered by an approved "Late Arrival" permission are not counted). Days are counted Monday–Friday; public holidays and part-year entitlement for new staff are not adjusted here, so HR's records are final.</p>
        <button onClick={()=>setView('request')} className="w-full glass rounded-2xl p-5 mb-6 hover:shadow-xl stat group">
            <div className="flex items-center gap-4">
                <div className="w-14 h-14 rounded-xl flex items-center justify-center shadow-lg" style={{background:'linear-gradient(135deg,#8b5cf6,#6d28d9)'}}><i className="fas fa-plane-departure text-white text-xl"/></div>
                <div className="text-left"><p className="text-lg font-bold text-gray-800">Request Leave / Permission</p><p className="text-sm text-gray-500">Submit absence or time-off requests</p></div>
                <i className="fas fa-arrow-right text-gray-300 ml-auto group-hover:text-purple-600 transition"/>
            </div>
        </button>
        <div className="glass rounded-2xl p-6 mt-6">
            <h2 className="text-lg font-bold mb-4"><i className="fas fa-plane-departure text-blue-600 mr-2"/>My Leave Requests</h2>
            {leaves.length===0?<div className="text-center py-8 text-gray-400"><i className="fas fa-calendar-xmark text-3xl mb-2"/><p className="font-semibold">No leave applications yet</p></div>
            :<div className="space-y-3">{leaves.map(l=><div key={l.id} className="border-2 border-gray-100 rounded-xl p-4 flex justify-between items-center">
                <div><p className="font-semibold text-gray-800">{l.leave_type}</p><p className="text-sm text-gray-500">{new Date(l.start_date).toLocaleDateString()} → {new Date(l.end_date).toLocaleDateString()}</p>{l.reason&&<p className="text-xs text-gray-400 mt-1">{l.reason}</p>}</div>
                <span className={`px-3 py-1 rounded-full text-xs font-bold ${l.status==='approved'?'bg-green-100 text-green-700':l.status==='rejected'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700'}`}>{l.status||'pending'}</span>
            </div>)}</div>}
        </div>
        </>}
    </div></div>;
}

function EmergencyContactCard({userId,editorName,notify,title,note}) {
    const [f,setF]=useState({contact_name:'',relationship:'',phone:'',alt_phone:'',address:'',medical_note:''});const [loaded,setLoaded]=useState(false);const [busy,setBusy]=useState(false);const [upd,setUpd]=useState(null);
    useEffect(()=>{(async()=>{try{const r=await fetch(`${SB}/rest/v1/staff_emergency_contacts?user_id=eq.${userId}`,{headers:H});const d=r.ok?await r.json():[];
        if(Array.isArray(d)&&d.length){const x=d[0];setF({contact_name:x.contact_name||'',relationship:x.relationship||'',phone:x.phone||'',alt_phone:x.alt_phone||'',address:x.address||'',medical_note:x.medical_note||''});setUpd(x);}}catch(e){}setLoaded(true);})();},[userId]);
    const set=(k,v)=>setF(x=>({...x,[k]:v}));
    const save=async()=>{if(!f.contact_name.trim()||!f.phone.trim()){notify('Name and phone number are required','error');return;}setBusy(true);
        try{const r=await fetch(`${SB}/rest/v1/staff_emergency_contacts`,{method:'POST',headers:{...HJ,'Prefer':'resolution=merge-duplicates,return=minimal'},
            body:JSON.stringify({user_id:userId,...Object.fromEntries(Object.entries(f).map(([k,v])=>[k,v.trim()||null])),updated_by:editorName||null,updated_at:new Date().toISOString()})});
            if(r.ok){notify('Emergency contact saved');setUpd({updated_by:editorName,updated_at:new Date().toISOString()});}else notify('Could not save','error');}catch(e){notify('Could not save','error');}
        setBusy(false);};
    const inp="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm";
    return <div className="glass rounded-2xl p-6 mt-6"><h2 className="text-lg font-bold mb-1"><i className="fas fa-user-shield text-red-500 mr-2"/>{title||'Emergency contact / next of kin'}</h2>
        <p className="text-xs text-gray-500 mb-4">{note||'Visible only to HR, Security and the supervisor — never shown in the Staff Directory.'}</p>
        {!loaded?<div className="text-center py-4 text-gray-400"><i className="fas fa-spinner fa-spin"/></div>:<div className="space-y-3">
            <div className="grid md:grid-cols-2 gap-3"><input className={inp} value={f.contact_name} onChange={e=>set('contact_name',e.target.value)} placeholder="Full name *"/>
                <input className={inp} value={f.relationship} onChange={e=>set('relationship',e.target.value)} placeholder="Relationship (e.g. spouse, brother)"/></div>
            <div className="grid md:grid-cols-2 gap-3"><input className={inp} value={f.phone} onChange={e=>set('phone',e.target.value)} placeholder="Phone number *"/>
                <input className={inp} value={f.alt_phone} onChange={e=>set('alt_phone',e.target.value)} placeholder="Alternative phone (optional)"/></div>
            <input className={inp} value={f.address} onChange={e=>set('address',e.target.value)} placeholder="Address (optional)"/>
            <input className={inp} value={f.medical_note} onChange={e=>set('medical_note',e.target.value)} placeholder="Anything responders must know, e.g. a serious allergy (optional)"/>
            {upd&&upd.updated_at&&<p className="text-xs text-gray-400">Last updated {new Date(upd.updated_at).toLocaleDateString()}{upd.updated_by?` by ${upd.updated_by}`:''}</p>}
            <button onClick={save} disabled={busy} className="btn-green text-white px-6 py-3 rounded-xl font-bold disabled:opacity-60">{busy?'Saving…':'Save emergency contact'}</button>
        </div>}
    </div>;
}

    const activeApps=allApps.filter(a=>!a.withdrawn);
    const withdrawnApps=allApps.filter(a=>a.withdrawn);
    const pending=activeApps.filter(a=>a.status==='pending'),completed=activeApps.filter(a=>a.status==='completed'),disputed=activeApps.filter(a=>a.employee_review_status==='rejected');const list=tab==='pending'?pending:tab==='completed'?completed:tab==='withdrawn'?withdrawnApps:disputed;
    const restore=async(a)=>{
        if(!confirm(`Restore this appraisal for ${names[a.employee_id]||'this employee'}? It will return to the active queues.`))return;
        const r=await fetch(`${SB}/rest/v1/appraisals?id=eq.${a.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({withdrawn:false,withdrawn_by:null,withdrawn_at:null,withdrawal_reason:null})});
        if(r.ok){notify('Appraisal restored');load();}else notify('Failed','error');
    };
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><PortalBack onBack={onBack} label="Back to HR Portal"/>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Appraisal Reviews</h1><p className="text-gray-500 mt-1">Review staff self-assessments and score them</p></div>
        <div className="grid grid-cols-3 gap-4 mb-6">
            {[{label:'Pending',val:pending.length,icon:'fa-clock',bg:'bg-amber-50',color:'text-amber-600'},{label:'Completed',val:completed.length,icon:'fa-check-circle',bg:'bg-green-50',color:'text-green-600'},{label:'Disputed',val:disputed.length,icon:'fa-flag',bg:'bg-red-50',color:'text-red-600'}
            ].map((s,i)=><div key={i} className="glass rounded-xl p-5 stat"><div className="flex justify-between items-start"><div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider">{s.label}</p><p className="text-3xl font-extrabold text-gray-800 mt-1">{s.val}</p></div><div className={`w-10 h-10 ${s.bg} rounded-lg flex items-center justify-center`}><i className={`fas ${s.icon} ${s.color}`}/></div></div></div>)}
        </div>
        <div className="glass rounded-2xl p-6">
            <div className="flex gap-2 mb-6 border-b pb-4 flex-wrap">{[['pending','Pending',pending.length],['completed','Completed',completed.length],['disputed','Disputed',disputed.length],['withdrawn','Withdrawn',withdrawnApps.length]].map(([k,l,c])=><button key={k} onClick={()=>setTab(k)} className={`px-4 py-2 rounded-xl text-sm font-bold transition ${tab===k?'btn-green text-white':'text-gray-500 hover:bg-gray-100'}`}>{l} ({c})</button>)}</div>
            {list.length===0?<div className="text-center py-12 text-gray-400"><i className="fas fa-check-double text-4xl mb-3 text-green-400"/><p className="font-semibold">No items</p></div>
            :<div className="space-y-3">{list.map(a=><div key={a.id} className={`border-2 border-gray-100 rounded-xl p-5 transition ${tab==='withdrawn'?'':'hover:border-green-200 cursor-pointer'}`} onClick={()=>{if(tab!=='withdrawn')setSelected(a);}}>
                <div className="flex flex-wrap justify-between items-center gap-3">
                    <div><h3 className="font-bold text-gray-800"><i className="fas fa-user-circle text-green-600 mr-2"/>{names[a.employee_id]||'Employee'}</h3>
                        <div className="flex items-center gap-2 mt-1"><p className="text-sm text-gray-500">{new Date(a.created_at).toLocaleDateString()}</p>{a.employee_review_status==='rejected'&&<span className="px-2 py-0.5 bg-red-100 text-red-700 text-xs font-bold rounded-full">Disputed</span>}{a.employee_review_status==='accepted'&&<span className="px-2 py-0.5 bg-green-100 text-green-700 text-xs font-bold rounded-full">Accepted</span>}</div>
                        {tab==='withdrawn'&&<p className="text-xs text-gray-400 mt-1">Withdrawn by {a.withdrawn_by||'—'} on {a.withdrawn_at?new Date(a.withdrawn_at).toLocaleDateString():'—'}{a.withdrawal_reason?` — "${a.withdrawal_reason}"`:''}</p>}</div>
                    {tab==='withdrawn'
                        ?<button onClick={(e)=>{e.stopPropagation();restore(a);}} className="px-5 py-2.5 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-xl font-semibold text-sm"><i className="fas fa-rotate-left mr-2"/>Restore</button>
                        :<button className="btn-green text-white px-5 py-2.5 rounded-xl font-semibold text-sm"><i className="fas fa-eye mr-2"/>{a.status==='pending'?'Review':'View'}</button>}
                </div>
            </div>)}</div>}
        </div>
    </div></div>;
}

function PortalContentAdmin({user,notify,onBack}) {
    const [content,setContent]=useState({});const [notices,setNotices]=useState([]);const [loading,setLoading]=useState(true);const [savingKey,setSavingKey]=useState(null);
    const [n,setN]=useState({title:'',body:'',pinned:false,expires_on:''});const [posting,setPosting]=useState(false);
    const load=async()=>{setLoading(true);
        try{const [c,nt]=await Promise.all([fetch(`${SB}/rest/v1/portal_content?select=key,body,updated_by,updated_at`,{headers:H}).then(r=>r.ok?r.json():[]),
            fetch(`${SB}/rest/v1/portal_notices?select=*&order=posted_at.desc`,{headers:H}).then(r=>r.ok?r.json():[])]);
            const m={};(Array.isArray(c)?c:[]).forEach(x=>m[x.key]=x);setContent(m);setNotices(Array.isArray(nt)?nt:[]);}catch(e){notify('Could not load portal content','error');}
        setLoading(false);};
    useEffect(()=>{load();},[]);
    const setBody=(k,v)=>setContent(c=>({...c,[k]:{...(c[k]||{key:k}),body:v}}));
    const saveKey=async k=>{setSavingKey(k);
        try{const r=await fetch(`${SB}/rest/v1/portal_content`,{method:'POST',headers:{...HJ,'Prefer':'resolution=merge-duplicates,return=minimal'},
            body:JSON.stringify({key:k,body:((content[k]||{}).body||'').trim()||null,updated_by:user.name,updated_at:new Date().toISOString()})});
            if(r.ok){notify('Saved');load();}else notify('Could not save','error');}catch(e){notify('Could not save','error');}
        setSavingKey(null);};
    const post=async()=>{if(!n.title.trim()){notify('Give the notice a title','error');return;}setPosting(true);
        try{const r=await fetch(`${SB}/rest/v1/portal_notices`,{method:'POST',headers:HJ,body:JSON.stringify({title:n.title.trim().slice(0,150),body:n.body.trim().slice(0,3000)||null,pinned:n.pinned,expires_on:n.expires_on||null,posted_by:user.name})});
            if(r.ok){notify('Notice posted');setN({title:'',body:'',pinned:false,expires_on:''});load();}else notify('Could not post','error');}catch(e){notify('Could not post','error');}
        setPosting(false);};
    const toggle=async(x,patch)=>{const r=await fetch(`${SB}/rest/v1/portal_notices?id=eq.${x.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(patch)});if(r.ok)load();else notify('Failed','error');};
    const inp="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm";
    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-4xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in"><PortalBack onBack={onBack} label="Back to HR Portal"/>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Portal Content & Notices</h1><p className="text-gray-500 mt-1">What every staff member sees on the Staff Portal home page</p></div>
        {loading?<div className="text-center py-10"><i className="fas fa-spinner fa-spin"/></div>:<>
        <div className="glass rounded-2xl p-6 mb-6"><h2 className="text-lg font-bold mb-4"><i className="fas fa-bullhorn text-green-600 mr-2"/>Notice board</h2>
            <input className={inp+' mb-3'} value={n.title} onChange={e=>setN({...n,title:e.target.value})} maxLength={150} placeholder="Title, e.g. Office closed for Eid on Monday"/>
            <textarea rows={3} className={inp+' mb-3'} value={n.body} onChange={e=>setN({...n,body:e.target.value})} maxLength={3000} placeholder="Details (optional)"/>
            <div className="flex flex-wrap items-center gap-4 mb-3"><label className="flex items-center gap-2 text-sm font-semibold text-gray-600"><input type="checkbox" checked={n.pinned} onChange={e=>setN({...n,pinned:e.target.checked})} className="w-4 h-4"/>Pin to top</label>
                <label className="flex items-center gap-2 text-sm font-semibold text-gray-600">Hide after<input type="date" value={n.expires_on} onChange={e=>setN({...n,expires_on:e.target.value})} className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm"/></label></div>
            <button onClick={post} disabled={posting} className="btn-green text-white px-5 py-2.5 rounded-xl font-semibold text-sm disabled:opacity-60">{posting?'Posting…':'Post notice'}</button>
            <div className="space-y-2 mt-5">{notices.length===0?<p className="text-sm text-gray-400">No notices yet</p>:notices.map(x=><div key={x.id} className={`border-2 rounded-xl p-3 flex flex-wrap justify-between gap-2 ${x.active?'border-gray-100':'border-gray-100 opacity-50'}`}>
                <div><p className="font-semibold text-gray-800">{x.pinned&&<i className="fas fa-thumbtack text-green-600 mr-1"/>}{x.title}</p><p className="text-xs text-gray-400">{x.posted_by||'—'} · {new Date(x.posted_at).toLocaleDateString()}{x.expires_on?` · hides after ${new Date(x.expires_on+'T12:00:00').toLocaleDateString()}`:''}{!x.active?' · hidden':''}</p></div>
                <div className="flex gap-2"><button onClick={()=>toggle(x,{pinned:!x.pinned})} className="text-xs font-semibold text-gray-600 hover:underline">{x.pinned?'Unpin':'Pin'}</button>
                    <button onClick={()=>toggle(x,{active:!x.active})} className={`text-xs font-semibold hover:underline ${x.active?'text-red-600':'text-green-700'}`}>{x.active?'Hide':'Show again'}</button></div>
            </div>)}</div></div>
        <div className="glass rounded-2xl p-6"><h2 className="text-lg font-bold mb-1"><i className="fas fa-circle-info text-green-600 mr-2"/>About RAHAMA</h2>
            <p className="text-xs text-gray-500 mb-4">Our Story appears first on the home page. Copy mission, vision, values and the safeguarding reporting channel from RAHAMA's official documents. Empty sections are hidden from staff, except safeguarding, which tells staff to contact HR until it is filled in.</p>
            <div className="space-y-5">{PORTAL_KEYS.map(([k,label])=><div key={k}><label className="text-sm font-bold text-gray-700">{label}</label>
                <textarea rows={k==='story'?10:k==='mission'||k==='vision'?3:5} className={inp+' mt-1'} value={(content[k]||{}).body||''} onChange={e=>setBody(k,e.target.value)}/>
                <div className="flex items-center gap-3 mt-1"><button onClick={()=>saveKey(k)} disabled={savingKey===k} className="px-4 py-1.5 rounded-xl text-xs font-bold bg-green-50 text-green-700 hover:bg-green-100 disabled:opacity-60">{savingKey===k?'Saving…':'Save'}</button>
                    {content[k]&&content[k].updated_at&&<span className="text-xs text-gray-400">Last saved {new Date(content[k].updated_at).toLocaleDateString()} by {content[k].updated_by||'—'}</span>}</div></div>)}</div></div>
        </>}
    </div></div>;
}
