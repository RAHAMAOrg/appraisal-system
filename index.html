function MEDataTable({rows,datasets,notify,onSaved,readOnlyView}) {
    const [dsFilter,setDsFilter]=useState('all');
    const [edited,setEdited]=useState({});
    const [busy,setBusy]=useState(false);
    const [search,setSearch]=useState('');

    const view=dsFilter==='all'?rows:rows.filter(r=>String(r.__ds)===dsFilter);
    const cols=view.length?Object.keys(view[0]).filter(k=>!k.startsWith('__')):[];
    const shown=search?view.filter(r=>cols.some(c=>String(r[c]??'').toLowerCase().includes(search.toLowerCase()))):view;

    const setCell=(ds,idx,col,val)=>{
        setEdited(p=>({...p,[`${ds}|${idx}|${col}`]:val}));
    };
    const cellVal=(r,i,col)=>{
        const k=`${r.__ds}|${i}|${col}`;
        return k in edited?edited[k]:(r[col]??'');
    };

    const saveEdits=async()=>{
        const changes=Object.keys(edited);
        if(!changes.length){notify('No changes to save','info');return;}
        setBusy(true);
        try{
            // rebuild each affected dataset's rows_json
            const byDs={};
            changes.forEach(k=>{const [ds,idx,col]=k.split('|');(byDs[ds]=byDs[ds]||[]).push({idx:Number(idx),col,val:edited[k]});});
            for(const [dsId,list] of Object.entries(byDs)){
                const ds=datasets.find(d=>String(d.id)===dsId);
                if(!ds) continue;
                const parsed=JSON.parse(ds.rows_json||'[]');
                // index within the dataset — recompute using global order
                const globalRows=rows.filter(r=>String(r.__ds)===dsId);
                list.forEach(ch=>{
                    const target=globalRows[ch.idx];
                    if(!target) return;
                    const pos=parsed.findIndex(p=>JSON.stringify(p)===JSON.stringify(Object.fromEntries(Object.entries(target).filter(([k])=>!k.startsWith('__')))));
                    if(pos>=0) parsed[pos][ch.col]=ch.val;
                });
                const r=await fetch(`${SB}/rest/v1/me_datasets?id=eq.${dsId}`,{method:'PATCH',headers:HJ,
                    body:JSON.stringify({rows_json:JSON.stringify(parsed),cleaned:true,cleaned_at:new Date().toISOString()})});
                if(!r.ok) throw new Error('save failed');
            }
            notify(`${changes.length} cell${changes.length!==1?'s':''} updated`);
            setEdited({});onSaved();
        }catch(e){notify('Could not save changes','error');}
        setBusy(false);
    };

    if(!rows.length) return <div className="glass rounded-2xl p-12 text-center text-gray-400">
        <i className="fas fa-table text-4xl mb-3"/><p className="font-semibold">No data uploaded yet</p></div>;

    return <div className="space-y-4">
        <div className="glass rounded-xl p-4 flex flex-wrap items-center gap-3">
            <select value={dsFilter} onChange={e=>setDsFilter(e.target.value)} className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-medium">
                <option value="all">All datasets</option>
                {datasets.map(d=><option key={d.id} value={String(d.id)}>{d.period_label} — {d.file_name}</option>)}
            </select>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search rows…" className="flex-1 min-w-0 px-4 py-2 border-2 border-gray-200 rounded-xl text-sm"/>
            <span className="text-sm text-gray-500 font-semibold">{shown.length} rows</span>
            {!readOnlyView&&Object.keys(edited).length>0&&
                <button onClick={saveEdits} disabled={busy} className="btn-green text-white px-4 py-2 rounded-xl font-bold text-sm disabled:opacity-50">
                    {busy?'Saving…':`Save ${Object.keys(edited).length} change${Object.keys(edited).length!==1?'s':''}`}</button>}
        </div>
        {!readOnlyView&&<p className="text-xs text-gray-400 px-2"><i className="fas fa-circle-info mr-1"/>Click any cell to correct it. Changes are saved back to the dataset for cleaning.</p>}

        <div className="glass rounded-2xl p-3 overflow-auto" style={{maxHeight:'620px'}}>
            <table className="text-xs" style={{minWidth:'100%'}}>
                <thead><tr className="border-b-2 border-gray-100">
                    <th className="text-left py-2 px-2 font-bold text-gray-400 sticky left-0 bg-white">#</th>
                    {cols.map(cn=><th key={cn} className="text-left py-2 px-2 font-bold text-gray-500 whitespace-nowrap" style={{minWidth:'120px'}}>{cn.slice(0,40)}</th>)}
                </tr></thead>
                <tbody>{shown.slice(0,400).map((r,i)=><tr key={i} className="border-b border-gray-50 hover:bg-gray-50">
                    <td className="py-1 px-2 text-gray-300 sticky left-0 bg-white">{i+1}</td>
                    {cols.map(cn=><td key={cn} className="py-1 px-1">
                        {readOnlyView
                            ? <span className="px-2 text-gray-700">{String(r[cn]??'')}</span>
                            : <input value={cellVal(r,i,cn)} onChange={e=>setCell(r.__ds,i,cn,e.target.value)}
                                className={`w-full px-2 py-1 rounded border text-xs ${`${r.__ds}|${i}|${cn}` in edited?'border-amber-400 bg-amber-50':'border-transparent hover:border-gray-200'}`}/>}
                    </td>)}
                </tr>)}</tbody>
            </table>
            {shown.length>400&&<p className="text-center text-gray-400 text-xs py-3">Showing first 400 of {shown.length} rows</p>}
        </div>
    </div>;
}

function MEUploads({tool,datasets,user,notify,onSaved,readOnlyView}) {
    const [parsed,setParsed]=useState(null);
    const [fileName,setFileName]=useState('');
    const [period,setPeriod]=useState('');
    const [keep,setKeep]=useState({});
    const [busy,setBusy]=useState(false);
    const fileRef=useRef(null);

    const onFile=async(e)=>{
        const f=e.target.files[0]; if(!f) return;
        setFileName(f.name);
        try{
            const buf=await f.arrayBuffer();
            const wb=XLSX.read(buf,{type:'array'});
            const ws=wb.Sheets[wb.SheetNames[0]];
            const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
            if(!rows.length){notify('No rows found in the file','error');return;}
            if(rows.length>ME_ROW_CAP){notify(`File has ${rows.length} rows — only the first ${ME_ROW_CAP} will be stored`,'info');}
            const trimmed=rows.slice(0,ME_ROW_CAP);
            const prof=profileColumns(trimmed);
            const k={};prof.forEach(c=>{k[c.name]=(c.kind==='numeric'||c.kind==='category');});
            setKeep(k);
            setParsed({rows:trimmed,profile:prof,total:rows.length,sheet:wb.SheetNames[0]});
            notify(`${trimmed.length} rows · ${prof.length} columns found`,'info');
        }catch(ex){notify('Could not read file: '+ex.message,'error');}
    };

    const save=async()=>{
        if(!period.trim()){notify('Enter the reporting period (e.g. 2026-07)','error');return;}
        const cols=Object.keys(keep).filter(k=>keep[k]);
        if(!cols.length){notify('Select at least one column to keep','error');return;}
        setBusy(true);
        try{
            const slim=parsed.rows.map(r=>{const o={};cols.forEach(c=>{o[c]=r[c];});return o;});
            const json=JSON.stringify(slim);
            const sizeKB=Math.round(json.length/1024);
            const r=await fetch(`${SB}/rest/v1/me_datasets`,{method:'POST',headers:HJ,
                body:JSON.stringify({tool_id:tool.id,period_label:period.trim(),file_name:fileName,
                    row_count:slim.length,col_count:cols.length,size_kb:sizeKB,
                    rows_json:json,uploaded_by:user.name})});
            if(!r.ok) throw new Error(await r.text());
            await fetch(`${SB}/rest/v1/me_tools?id=eq.${tool.id}`,{method:'PATCH',headers:HJ,
                body:JSON.stringify({last_upload_at:new Date().toISOString()})});
            notify(`Dataset saved — ${slim.length} rows, ${cols.length} columns (${sizeKB} KB)`);
            setParsed(null);setFileName('');setPeriod('');onSaved();
        }catch(e){notify('Upload failed: '+String(e.message).slice(0,100),'error');}
        setBusy(false);
    };

    const del=async(d)=>{
        if(!confirm(`Delete dataset "${d.file_name}" (${d.period_label})?\n\nThis removes ${d.row_count} rows and frees ${d.size_kb} KB.`))return;
        const r=await fetch(`${SB}/rest/v1/me_datasets?id=eq.${d.id}`,{method:'DELETE',headers:H});
        if(r.ok){notify('Dataset deleted');onSaved();}else notify('Delete failed','error');
    };

    const totalKB=datasets.reduce((s,d)=>s+(d.size_kb||0),0);
    const keptCount=Object.values(keep).filter(Boolean).length;

    return <div className="space-y-4">
        {!readOnlyView&&<div className="glass rounded-2xl p-6">
            <h3 className="font-bold text-gray-800 mb-1">Upload Data Export</h3>
            <p className="text-sm text-gray-500 mb-4">Export from your data collection tool as CSV or XLSX, then upload here. Only the columns you keep are stored.</p>
            <div className="grid md:grid-cols-2 gap-4 mb-4">
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Reporting Period *</label>
                    <input value={period} onChange={e=>setPeriod(e.target.value)} placeholder="e.g. 2026-07 or Q3 2026" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">File *</label>
                    <div onClick={()=>fileRef.current&&fileRef.current.click()}
                        className={`border-2 border-dashed rounded-xl p-3 text-center cursor-pointer ${fileName?'border-green-400 bg-green-50':'border-gray-300 hover:border-green-400'}`}>
                        <p className="text-sm text-gray-600">{fileName||'Click to select CSV / XLSX'}</p></div>
                    <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={onFile}/></div>
            </div>

            {parsed&&<>
                <div className="bg-cyan-50 border border-cyan-200 rounded-xl p-4 mb-4">
                    <p className="text-sm text-cyan-800 font-semibold mb-2">{parsed.rows.length} rows from "{parsed.sheet}"{parsed.total>parsed.rows.length?` (capped from ${parsed.total})`:''}</p>
                    <p className="text-xs text-cyan-700">Keeping <strong>{keptCount}</strong> of {parsed.profile.length} columns. Numeric and category columns are pre-selected — untick anything you don't need to save space.</p>
                </div>
                <div className="border-2 border-gray-100 rounded-xl p-3 mb-4 overflow-auto" style={{maxHeight:'320px'}}>
                    {parsed.profile.map(c=><label key={c.name} className="flex items-center gap-3 py-1.5 px-2 hover:bg-gray-50 rounded cursor-pointer">
                        <input type="checkbox" checked={!!keep[c.name]} onChange={e=>setKeep({...keep,[c.name]:e.target.checked})}/>
                        <span className="flex-1 text-xs text-gray-700 truncate">{c.name}</span>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${c.kind==='numeric'?'bg-cyan-100 text-cyan-700':c.kind==='category'?'bg-indigo-100 text-indigo-700':'bg-gray-100 text-gray-500'}`}>{c.kind}</span>
                        <span className="text-[10px] text-gray-400 w-16 text-right">{c.filled} filled</span>
                    </label>)}
                </div>
                <button onClick={save} disabled={busy} className="w-full btn-green text-white py-3 rounded-xl font-bold disabled:opacity-50">
                    {busy?'Saving…':`Save Dataset (${parsed.rows.length} rows × ${keptCount} cols)`}</button>
            </>}
        </div>}

        <div className="glass rounded-2xl p-6">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-4">
                <h3 className="font-bold text-gray-800">Uploaded Datasets</h3>
                <span className="text-xs font-bold text-gray-500">Storage used: {totalKB>1024?(totalKB/1024).toFixed(1)+' MB':totalKB+' KB'}</span>
            </div>
            {datasets.length===0?<p className="text-center text-gray-400 py-8 font-semibold">No datasets uploaded yet</p>
            :<div className="space-y-2">{datasets.map(d=><div key={d.id} className="border-2 border-gray-100 rounded-xl p-4 flex flex-wrap justify-between items-center gap-3">
                <div className="min-w-0">
                    <p className="font-semibold text-gray-800 text-sm">{d.period_label} {d.cleaned&&<span className="ml-2 text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">cleaned</span>}</p>
                    <p className="text-xs text-gray-400 mt-0.5 truncate">{d.file_name} · {d.row_count} rows × {d.col_count} cols · {d.size_kb} KB · {d.uploaded_by}</p>
                </div>
                {!readOnlyView&&<button onClick={()=>del(d)} className="px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg text-xs font-bold"><i className="fas fa-trash"/></button>}
            </div>)}</div>}
        </div>
    </div>;
}

function MandE({user,notify,onBack,readOnlyView}) {
    const [view,setView]=useState('register');
    const [plans,setPlans]=useState([]);
    const [loading,setLoading]=useState(true);
    const [err,setErr]=useState(null);
    const [counts,setCounts]=useState({});
    const [selPlan,setSelPlan]=useState(null);
    const [actsByPlan,setActsByPlan]=useState({});

    const load=async()=>{setLoading(true);setErr(null);
        try{
            // These two fetches don't depend on each other, so run them
            // concurrently rather than one after another.
            const [r,allActRows]=await Promise.all([
                fetch(`${SB}/rest/v1/work_plans?order=created_at.desc`,{headers:H}),
                fetch(`${SB}/rest/v1/work_plan_activities?select=work_plan_id,current_status,verification_status`,{headers:H}).then(r=>r.json()).catch(()=>[])
            ]);
            if(!r.ok) throw new Error('Work plan tables not found — run the SQL setup first.');
            const d=await r.json();
            if(!Array.isArray(d)) throw new Error('Unexpected response from database.');
            setPlans(d);
            // Single trimmed fetch instead of two full-table pulls: the dashboard
            // below only ever reads work_plan_id, current_status and
            // verification_status, so that's all we ask the DB for. Counts are
            // derived from this same result instead of a separate query.
            const rows=Array.isArray(allActRows)?allActRows:[];
            const c={};rows.forEach(x=>{c[x.work_plan_id]=(c[x.work_plan_id]||0)+1;});
            setCounts(c);
            const grouped={};rows.forEach(x=>{(grouped[x.work_plan_id]=grouped[x.work_plan_id]||[]).push(x);});
            setActsByPlan(grouped);
        }catch(e){setErr(e.message);}
        setLoading(false);};
    useEffect(()=>{load();},[]);

  if(view==='import')   return <WorkPlanImport user={user} notify={notify} onDone={()=>{setView('register');load();}}/>;
   if(view==='activities')return <WorkPlanActivities plan={selPlan} user={user} notify={notify} readOnlyView={readOnlyView} onBack={()=>{setView('register');load();}}/>;
    if(view==='assign')   return <WorkPlanAssign plan={selPlan} user={user} notify={notify} onDone={()=>{setView('register');load();}}/>;
    if(view==='medata')   return <MEData user={user} notify={notify} readOnlyView={readOnlyView} onBack={()=>setView('register')}/>;
    const publish=async(p)=>{
        if(!confirm('Publish this work plan?\n\nIt becomes the approved baseline that delivery is measured against.')) return;
        const r=await fetch(`${SB}/rest/v1/work_plans?id=eq.${p.id}`,{method:'PATCH',headers:HJ,
            body:JSON.stringify({status:'active',approved_by:user.name,approved_at:new Date().toISOString()})});
        if(r.ok){notify('Work plan published');load();}else notify('Failed to publish','error');
    };

    const deletePlan=async(p)=>{
        if(!confirm(`Delete "${p.plan_name}"?\n\nThis removes the draft and its ${counts[p.id]||0} imported activities. This cannot be undone. Only draft work plans can be deleted — published ones are locked.`)) return;
        // Activities reference the plan, so clear those out first, then the plan itself.
        const ar=await fetch(`${SB}/rest/v1/work_plan_activities?work_plan_id=eq.${p.id}`,{method:'DELETE',headers:H});
        if(!ar.ok){notify('Failed to delete work plan activities','error');return;}
        const r=await fetch(`${SB}/rest/v1/work_plans?id=eq.${p.id}`,{method:'DELETE',headers:H});
        if(r.ok){notify('Draft work plan deleted');load();}else notify('Failed to delete work plan','error');
    };

    const badge=s=>{const m={draft:'bg-gray-100 text-gray-700',active:'bg-green-100 text-green-700',closed:'bg-purple-100 text-purple-700'};
        return <span className={`px-2 py-1 rounded-full text-xs font-bold uppercase ${m[s]||m.draft}`}>{s||'draft'}</span>;};

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
            <div className="flex flex-wrap justify-between items-center gap-4">
                <div><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Monitoring &amp; Evaluation</h1>
                    <p className="text-gray-500 mt-1">Project work plans and delivery tracking</p></div>
               <div className="flex flex-wrap gap-2">
    <button onClick={()=>setView('medata')} className="px-5 py-3 rounded-xl font-bold text-sm" style={{background:'linear-gradient(135deg,#0891b2,#0e7490)',color:'#fff'}}><i className="fas fa-chart-line mr-2"/>Data &amp; Indicators</button>
    {!readOnlyView&&<button onClick={()=>setView('import')} className="btn-green text-white px-5 py-3 rounded-xl font-bold text-sm"><i className="fas fa-upload mr-2"/>Import Work Plan</button>}
</div>
            </div>
        </div>

        {err&&<div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-5 mb-6">
            <h3 className="font-bold text-amber-800 mb-1"><i className="fas fa-triangle-exclamation mr-2"/>Setup required</h3>
            <p className="text-sm text-amber-700">{err}</p></div>}
{!loading && <MandEDashboard plans={plans} counts={counts} acts={actsByPlan} notify={notify}
            onOpenPlan={(p)=>{setSelPlan(p);setView('activities');}}/>}
        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>
        :plans.length===0&&!err?<div className="glass rounded-2xl p-12 text-center text-gray-400">
            <i className="fas fa-clipboard-list text-4xl mb-3"/><p className="font-semibold">No work plans yet</p>
            <p className="text-sm mt-1">Import a work plan from Excel to get started.</p></div>
        :<div className="space-y-3">{plans.map(p=>
            <div key={p.id} className="glass rounded-2xl p-5">
                <div className="flex flex-wrap justify-between items-start gap-4">
                    <div className="min-w-0">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                            <h3 className="font-bold text-gray-800">{p.plan_name}</h3>{badge(p.status)}
                        </div>
                        <p className="text-sm text-gray-500">{p.project_code} · {counts[p.id]||0} activities</p>
                        <p className="text-xs text-gray-400 mt-1">Created by {p.created_by||'—'}{p.start_date?` · ${p.start_date} → ${p.end_date||'—'}`:''}</p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                     <button onClick={()=>{setSelPlan(p);setView('activities');}} className="px-4 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-xl font-semibold text-sm"><i className="fas fa-list mr-2"/>Activities</button>
                        {!readOnlyView&&<button onClick={()=>{setSelPlan(p);setView('assign');}} className="px-4 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-xl font-semibold text-sm"><i className="fas fa-users mr-2"/>Assign</button>}
                        {!readOnlyView&&(p.status||'draft')==='draft'&&<button onClick={()=>publish(p)} className="btn-green text-white px-4 py-2 rounded-xl font-semibold text-sm"><i className="fas fa-check mr-2"/>Publish</button>}
                        {!readOnlyView&&(p.status||'draft')==='draft'&&<button onClick={()=>deletePlan(p)} className="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl font-semibold text-sm"><i className="fas fa-trash-alt mr-2"/>Delete</button>}
                    </div>
                </div>
            </div>)}</div>}
    </div></div>;
}
function WorkPlanImport({user,notify,onDone}) {
    const [parsed,setParsed]=useState(null);
    const [fileName,setFileName]=useState('');
    const [projectCode,setProjectCode]=useState('');
    const [planName,setPlanName]=useState('');
    const [startDate,setStartDate]=useState('');
    const [endDate,setEndDate]=useState('');
    const [busy,setBusy]=useState(false);
    const fileRef=useRef(null);

    const onFile=async(e)=>{
        const f=e.target.files[0]; if(!f) return;
        setFileName(f.name);
        try{
            const buf=await f.arrayBuffer();
            const wb=XLSX.read(buf,{type:'array'});
            const p=parseWorkPlanWorkbook(wb);
            if(!p.rows.length){notify('No activity rows found — check the sheet has "Sub-Activities" and "Type of activity" headings','error');setParsed(null);return;}
            setParsed(p); notify(`${p.rows.length} activities found in "${p.sheetName}"`,'info');
        }catch(ex){notify('Could not read file: '+ex.message,'error');}
    };

    const toggle=(i,val)=>{const c={...parsed};c.rows=[...c.rows];c.rows[i]={...c.rows[i],include:val};setParsed(c);};
    const toggleAll=val=>{const c={...parsed};c.rows=c.rows.map(r=>({...r,include:val}));setParsed(c);};

    const save=async()=>{
        if(!projectCode.trim()){notify('Enter the project code','error');return;}
        if(!planName.trim()){notify('Give the work plan a name','error');return;}
        const rows=parsed.rows.filter(r=>r.include);
        if(!rows.length){notify('No activities selected','error');return;}
        setBusy(true);
        try{
            const r=await fetch(`${SB}/rest/v1/work_plans`,{method:'POST',
                headers:{...H,'Content-Type':'application/json','Prefer':'return=representation'},
                body:JSON.stringify({project_code:projectCode.trim(),plan_name:planName.trim(),
                    start_date:startDate||null,end_date:endDate||null,status:'draft',
                    source_sheet:parsed.sheetName,activity_count:rows.length,created_by:user.name})});
            if(!r.ok) throw new Error(await r.text());
            const plan=(await r.json())[0];

            // Re-use any saved DRI → owner mapping for this project
            let driMap={};
            try{
                const m=await fetch(`${SB}/rest/v1/work_plan_dri_map?project_code=eq.${encodeURIComponent(projectCode.trim())}`,{headers:H});
                const md=await m.json();
                (Array.isArray(md)?md:[]).forEach(x=>{driMap[x.dri]=x.staff_email;});
            }catch(e){}

            const payload=rows.map((x,i)=>({work_plan_id:plan.id,project_code:projectCode.trim(),
                stage:x.stage||null,milestone:x.milestone||null,key_activity:x.keyActivity||null,
                sub_activity:x.subActivity,activity_type:x.activityType,dri:x.dri||null,
                assigned_to:driMap[(x.dri||'').trim()]||null,
                total_months:x.totalMonths,planned_months:JSON.stringify(x.plannedMonths),
                budget_ref:x.budgetRef,budget_note:x.budgetNote||null,year:x.year||null,
                sort_order:i,current_status:'Not Started'}));
            for(let i=0;i<payload.length;i+=100){
                const br=await fetch(`${SB}/rest/v1/work_plan_activities`,{method:'POST',headers:HJ,body:JSON.stringify(payload.slice(i,i+100))});
                if(!br.ok) throw new Error(await br.text());
            }
            notify(`Work plan saved — ${rows.length} activities imported`);
            onDone();
        }catch(e){notify('Save failed: '+String(e.message).slice(0,120),'error');}
        setBusy(false);
    };

    const sel=parsed?parsed.rows.filter(r=>r.include).length:0;
    const totalBudget=parsed?parsed.rows.reduce((s,r)=>s+(r.budgetRef||0),0):0;

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onDone} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Import Work Plan</h1>
            <p className="text-gray-500 mt-1">Upload the Excel work plan — activities are extracted for review before saving</p>
        </div>

        <div className="glass rounded-2xl p-6 mb-6 space-y-4">
            <div className="grid md:grid-cols-2 gap-4">
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Project Code *</label>
                    <input value={projectCode} onChange={e=>setProjectCode(e.target.value)} placeholder="e.g. CBA101" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Work Plan Name *</label>
                    <input value={planName} onChange={e=>setPlanName(e.target.value)} placeholder="e.g. ECHO HIP Work Plan 2026" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Start Date</label>
                    <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">End Date</label>
                    <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl"/></div>
            </div>
            <div>
                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Excel File *</label>
                <div onClick={()=>fileRef.current&&fileRef.current.click()}
                    className={`border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition ${fileName?'border-green-400 bg-green-50':'border-gray-300 hover:border-green-400 hover:bg-green-50'}`}>
                    {fileName?<div><i className="fas fa-file-excel text-green-600 text-2xl mb-2"/><p className="text-sm font-semibold text-green-700">{fileName}</p>
                        {parsed&&<p className="text-xs text-gray-500 mt-1">{parsed.rows.length} activities · sheet "{parsed.sheetName}"</p>}</div>
                    :<div><i className="fas fa-cloud-arrow-up text-gray-400 text-2xl mb-2"/><p className="text-sm text-gray-500">Click to select the work plan (.xlsx)</p>
                        <p className="text-xs text-gray-400 mt-1">The sheet with the master schedule is detected automatically</p></div>}
                </div>
                <input ref={fileRef} type="file" accept=".xlsx,.xlsm,.xls" className="hidden" onChange={onFile}/>
            </div>
        </div>

        {parsed&&<>
            <div className="glass rounded-2xl p-5 mb-4">
                <div className="flex flex-wrap gap-6 items-center">
                    <div><p className="text-xs font-bold text-gray-400 uppercase">Selected</p><p className="text-2xl font-extrabold text-green-600">{sel}<span className="text-sm text-gray-400">/{parsed.rows.length}</span></p></div>
                    <div><p className="text-xs font-bold text-gray-400 uppercase">Budget Reference</p><p className="text-lg font-bold text-gray-700">₦{totalBudget.toLocaleString()}</p></div>
                    <div className="flex gap-2 ml-auto">
                        <button onClick={()=>toggleAll(true)} className="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-xs font-bold">Select All</button>
                        <button onClick={()=>toggleAll(false)} className="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-xs font-bold">Clear All</button>
                    </div>
                </div>
                <p className="text-xs text-gray-400 mt-3 italic">Budget is stored as reference only — delivery tracking never derives from spend.</p>
            </div>

            <div className="glass rounded-2xl p-4 mb-6 overflow-auto" style={{maxHeight:'520px'}}>
                <table className="w-full text-xs">
                    <thead><tr className="border-b-2 border-gray-100 sticky top-0 bg-white">
                        <th className="py-2 px-2 w-8"></th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Stage</th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Sub-Activity</th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Type</th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">DRI</th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Mo</th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Planned</th>
                        <th className="text-right py-2 px-2 font-bold text-gray-500 uppercase">Budget Ref</th>
                    </tr></thead>
                    <tbody>{parsed.rows.map((r,i)=><tr key={i} className={`border-b border-gray-50 ${r.include?'':'opacity-40'}`}>
                        <td className="py-2 px-2"><input type="checkbox" checked={r.include} onChange={e=>toggle(i,e.target.checked)}/></td>
                        <td className="py-2 px-2 text-gray-500">{r.stage||'—'}</td>
                        <td className="py-2 px-2 text-gray-800 font-medium" style={{maxWidth:'320px'}}>{r.subActivity}</td>
                        <td className="py-2 px-2 text-gray-500 whitespace-nowrap">{r.activityType}</td>
                        <td className="py-2 px-2 text-gray-500">{r.dri||'—'}</td>
                        <td className="py-2 px-2 text-center text-gray-600">{r.totalMonths}</td>
                        <td className="py-2 px-2 text-gray-400" style={{fontSize:'10px'}}>{r.plannedMonths.join(', ')||'—'}</td>
                        <td className="py-2 px-2 text-right text-gray-600">{r.budgetRef?'₦'+r.budgetRef.toLocaleString():(r.budgetNote||'—')}</td>
                    </tr>)}</tbody>
                </table>
            </div>

            <div className="glass rounded-xl p-6 flex gap-4">
                <button onClick={onDone} disabled={busy} className="flex-1 bg-gray-100 py-4 rounded-xl font-bold hover:bg-gray-200">Cancel</button>
                <button onClick={save} disabled={busy||!sel} className="flex-1 btn-green text-white py-4 rounded-xl font-bold disabled:opacity-50">
                    {busy?<><i className="fas fa-spinner fa-spin mr-2"/>Saving…</>:`Save Work Plan (${sel} activities)`}</button>
            </div>
        </>}
    </div></div>;
}

function WorkPlanAssign({plan,user,notify,onDone}) {
    const [acts,setActs]=useState([]);
    const [loading,setLoading]=useState(true);
    const [driMap,setDriMap]=useState({});
    const [owners,setOwners]=useState({});
    const [staff,setStaff]=useState([]);
    const [busy,setBusy]=useState(false);

    useEffect(()=>{(async()=>{
        try{
            const u=await fetch(`${SB}/rest/v1/users?select=id,name,email,role,is_mne&order=name.asc`,{headers:H}).then(r=>r.json());
            setStaff(Array.isArray(u)?u:[]);
            const a=await fetch(`${SB}/rest/v1/work_plan_activities?work_plan_id=eq.${plan.id}&order=sort_order.asc`,{headers:H}).then(r=>r.json());
            const rows=Array.isArray(a)?a:[];
            setActs(rows);
            const o={};rows.forEach(x=>{if(x.assigned_to)o[x.id]=x.assigned_to;});setOwners(o);
            const m=await fetch(`${SB}/rest/v1/work_plan_dri_map?project_code=eq.${encodeURIComponent(plan.project_code)}`,{headers:H}).then(r=>r.json());
            const dm={};(Array.isArray(m)?m:[]).forEach(x=>{dm[x.dri]=x.staff_email;});setDriMap(dm);
        }catch(e){}
        setLoading(false);
    })();},[]);

    const dris=[...new Set(acts.map(a=>(a.dri||'').trim()).filter(Boolean))].sort();

    const applyMap=()=>{
        const o={...owners};let n=0;
        acts.forEach(a=>{const d=(a.dri||'').trim();if(driMap[d]){o[a.id]=driMap[d];n++;}});
        setOwners(o);
        notify(`Applied to ${n} activities — review and override below`,'info');
    };

    const save=async()=>{
        const assigned=Object.values(owners).filter(Boolean).length;
        if(!assigned){notify('No owners selected','error');return;}
        setBusy(true);
        try{
            for(const a of acts){
                const val=owners[a.id]||null;
                if(val===(a.assigned_to||null)) continue;
                await fetch(`${SB}/rest/v1/work_plan_activities?id=eq.${a.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify({assigned_to:val})});
            }
            for(const [dri,name] of Object.entries(driMap)){
                if(!name) continue;
                await fetch(`${SB}/rest/v1/work_plan_dri_map?project_code=eq.${encodeURIComponent(plan.project_code)}&dri=eq.${encodeURIComponent(dri)}`,{method:'DELETE',headers:H});
                await fetch(`${SB}/rest/v1/work_plan_dri_map`,{method:'POST',headers:HJ,
                    body:JSON.stringify({project_code:plan.project_code,dri,staff_email:name,updated_by:user.name})});
            }
            notify(`Saved — ${assigned} of ${acts.length} activities have an owner`);
            onDone();
        }catch(e){notify('Save failed','error');}
        setBusy(false);
    };

    const unassigned=acts.filter(a=>!owners[a.id]).length;

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onDone} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">Assign Activity Owners</h1>
            <p className="text-gray-500 mt-1">{plan.plan_name} · {acts.length} activities{unassigned>0&&<span className="text-amber-600 font-semibold"> · {unassigned} unassigned</span>}</p>
        </div>

        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>:<>
            <div className="glass rounded-2xl p-6 mb-6">
                <h3 className="font-bold text-gray-800 mb-1"><i className="fas fa-diagram-project text-indigo-600 mr-2"/>Step 1 — Map each DRI label to a person</h3>
                <p className="text-sm text-gray-500 mb-4">The Excel records responsibility at unit level. Choose the single accountable owner for each label.</p>
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {dris.map(d=><div key={d} className="border-2 border-gray-100 rounded-xl p-3">
                        <p className="text-xs font-bold text-indigo-700 mb-2">{d} <span className="text-gray-400 font-normal">({acts.filter(a=>(a.dri||'').trim()===d).length})</span></p>
                        <select value={driMap[d]||''} onChange={e=>setDriMap({...driMap,[d]:e.target.value})}
                            className="w-full px-3 py-2 border-2 border-gray-200 rounded-lg text-sm">
                            <option value="">— Select owner —</option>
                            {staff.map(s=><option key={s.id} value={s.email}>{s.name}</option>)}
                        </select>
                    </div>)}
                </div>
                <button onClick={applyMap} className="mt-4 btn-green text-white px-5 py-3 rounded-xl font-bold text-sm"><i className="fas fa-arrow-down mr-2"/>Apply to Matching Activities</button>
            </div>

            <div className="glass rounded-2xl p-4 mb-6 overflow-auto" style={{maxHeight:'520px'}}>
                <h3 className="font-bold text-gray-800 mb-3 px-2"><i className="fas fa-user-check text-green-600 mr-2"/>Step 2 — Review &amp; override</h3>
                <table className="w-full text-xs">
                    <thead><tr className="border-b-2 border-gray-100 sticky top-0 bg-white">
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">#</th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Sub-Activity</th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">DRI</th>
                        <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase" style={{minWidth:'190px'}}>Accountable Owner</th>
                    </tr></thead>
                    <tbody>{acts.map((a,i)=><tr key={a.id} className="border-b border-gray-50">
                        <td className="py-2 px-2 text-gray-400">{i+1}</td>
                        <td className="py-2 px-2 text-gray-800" style={{maxWidth:'340px'}}>{a.sub_activity}</td>
                        <td className="py-2 px-2 text-indigo-600 font-semibold">{a.dri||'—'}</td>
                        <td className="py-2 px-2"><select value={owners[a.id]||''} onChange={e=>setOwners({...owners,[a.id]:e.target.value})}
                            className="w-full px-2 py-1.5 border-2 border-gray-200 rounded-lg text-xs">
                            <option value="">— Unassigned —</option>
                            {staff.map(s=><option key={s.id} value={s.email}>{s.name}</option>)}
                        </select></td>
                    </tr>)}</tbody>
                </table>
            </div>

            <div className="glass rounded-xl p-6 flex gap-4">
                <button onClick={onDone} disabled={busy} className="flex-1 bg-gray-100 py-4 rounded-xl font-bold hover:bg-gray-200">Cancel</button>
                <button onClick={save} disabled={busy} className="flex-1 btn-green text-white py-4 rounded-xl font-bold disabled:opacity-50">
                    {busy?<><i className="fas fa-spinner fa-spin mr-2"/>Saving…</>:'Save Assignments'}</button>
            </div>
        </>}
    </div></div>;
}

function WorkPlanActivities({plan,user,notify,onBack,readOnlyView}) {
    const [acts,setActs]=useState([]);
    const [loading,setLoading]=useState(true);
    const [filter,setFilter]=useState('all');
    const [nameByEmail,setNameByEmail]=useState({});
    const [sel,setSel]=useState(null);
    const [periodReports,setPeriodReports]=useState({});

    const load=async()=>{setLoading(true);
        try{
            const a=await fetch(`${SB}/rest/v1/work_plan_activities?work_plan_id=eq.${plan.id}&order=sort_order.asc`,{headers:H}).then(r=>r.json());
            const rows=Array.isArray(a)?a:[];
            setActs(rows);
            const u=await fetch(`${SB}/rest/v1/users?select=id,name,email`,{headers:H}).then(r=>r.json());
            const m={};(Array.isArray(u)?u:[]).forEach(x=>{m[x.email]=x.name;});setNameByEmail(m);
            const routineIds=rows.filter(isRoutine).map(x=>x.id);
            if(routineIds.length){
                const pr=await fetch(`${SB}/rest/v1/activity_period_reports?activity_id=in.(${routineIds.join(',')})&order=period_year.desc,period_month.desc`,{headers:H}).then(r=>r.json());
                const grouped={};(Array.isArray(pr)?pr:[]).forEach(x=>{(grouped[x.activity_id]=grouped[x.activity_id]||[]).push(x);});
                setPeriodReports(grouped);
            }
        }catch(e){}
        setLoading(false);};
    useEffect(()=>{load();},[]);

    const verify=async(a,ok,note)=>{
        const body=ok
            ? {verification_status:'verified',mne_verified_by:user.name,mne_verified_at:new Date().toISOString(),mne_note:note||null}
            : {verification_status:'rejected',mne_verified_by:user.name,mne_verified_at:new Date().toISOString(),mne_note:note||null};
        const r=await fetch(`${SB}/rest/v1/work_plan_activities?id=eq.${a.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(body)});
        if(r.ok){notify(ok?'Activity verified':'Sent back to owner');setSel(null);load();}
        else notify('Failed','error');
    };
   const verifyPeriod=async(pr,ok,note)=>{
        const body=ok
            ? {verification_status:'verified',mne_verified_by:user.name,mne_verified_at:new Date().toISOString(),mne_note:note||null}
            : {verification_status:'rejected',mne_verified_by:user.name,mne_verified_at:new Date().toISOString(),mne_note:note||null};
        const r=await fetch(`${SB}/rest/v1/activity_period_reports?id=eq.${pr.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(body)});
        if(r.ok){notify(ok?'Period verified':'Sent back to owner');setSel(null);load();}
        else notify('Failed','error');
    };

    const reopenWindow=async(a)=>{
        const r=await fetch(`${SB}/rest/v1/work_plan_activities?id=eq.${a.id}`,{method:'PATCH',headers:HJ,
            body:JSON.stringify({window_override:!a.window_override})});
        if(r.ok){notify(a.window_override?'Reopen cancelled':'Reporting reopened for this activity');load();}
        else notify('Failed','error');
    };

    const setStatus=async(a,status)=>{
        const r=await fetch(`${SB}/rest/v1/work_plan_activities?id=eq.${a.id}`,{method:'PATCH',headers:HJ,
            body:JSON.stringify({current_status:status,status_updated_by:user.name,status_updated_at:new Date().toISOString()})});
        if(r.ok){setActs(acts.map(x=>x.id===a.id?{...x,current_status:status}:x));notify('Status updated','info');}
        else notify('Update failed','error');
    };

    const byStatus={};acts.forEach(a=>{const s=a.current_status||'Not Started';byStatus[s]=(byStatus[s]||0)+1;});
    // Only M&E-verified deliveries count toward the completion rate
    const done=acts.filter(a=>['Completed','Completed For Period'].includes(a.current_status)&&a.verification_status==='verified').length;
    const awaiting=acts.filter(a=>a.verification_status==='submitted').length;
    const score=acts.length?done/acts.length:0;
    const grade=wpGrade(score);
    const list=filter==='all'?acts:acts.filter(a=>(a.current_status||'Not Started')===filter);

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-6xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">{plan.plan_name}</h1>
            <p className="text-gray-500 mt-1">{plan.project_code} · {acts.length} activities · {plan.status||'draft'}</p>
        </div>

        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Activities</p><p className="text-3xl font-extrabold text-gray-800 mt-1">{acts.length}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Verified</p><p className="text-3xl font-extrabold text-green-600 mt-1">{done}</p>{awaiting>0&&<p className="text-xs text-amber-600 font-semibold mt-1">{awaiting} awaiting review</p>}</div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Completion</p><p className="text-3xl font-extrabold text-blue-600 mt-1">{Math.round(score*100)}%</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Grade</p>
                <p className="text-lg font-extrabold mt-2" style={{color:grade.colour}}>{grade.label}</p>
                <p className="text-xs text-gray-400">Score {score.toFixed(2)}</p></div>
        </div>

        <div className="glass rounded-xl p-4 mb-6">
            <div className="cbar mb-3"><div className="cbar-fill" style={{width:`${score*100}%`,background:grade.colour}}/></div>
            <div className="flex flex-wrap gap-2">
                <button onClick={()=>setFilter('all')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${filter==='all'?'btn-green text-white':'bg-gray-100 text-gray-600'}`}>All ({acts.length})</button>
                {WP_STATUSES.filter(s=>byStatus[s]).map(s=>
                    <button key={s} onClick={()=>setFilter(s)}
                        className="px-3 py-1.5 rounded-lg text-xs font-bold"
                        style={filter===s?{background:wpStatusColour(s),color:'#fff'}:{background:wpStatusColour(s)+'20',color:wpStatusColour(s)}}>
                        {s} ({byStatus[s]})</button>)}
            </div>
        </div>

        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>
        :<div className="glass rounded-2xl p-4 overflow-auto">
            <table className="w-full text-xs">
                <thead><tr className="border-b-2 border-gray-100">
                    <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">#</th>
                    <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Stage</th>
                    <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Sub-Activity</th>
                    <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Type</th>
                    <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Owner</th>
                    <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase" style={{minWidth:'190px'}}>Status</th>
                    <th className="text-left py-2 px-2 font-bold text-gray-500 uppercase">Verification</th>
                </tr></thead>
                <tbody>{list.map((a,i)=><tr key={a.id} className="border-b border-gray-50 hover:bg-gray-50">
                    <td className="py-2 px-2 text-gray-400">{i+1}</td>
                    <td className="py-2 px-2 text-gray-500">{a.stage||'—'}</td>
                    <td className="py-2 px-2 text-gray-800 font-medium" style={{maxWidth:'320px'}}>{a.sub_activity}</td>
                    <td className="py-2 px-2 text-gray-500 whitespace-nowrap">{a.activity_type||'—'}</td>
                    <td className={`py-2 px-2 font-semibold ${a.assigned_to?'text-indigo-600':'text-red-500'}`}>{a.assigned_to?(nameByEmail[a.assigned_to]||a.assigned_to):'Unassigned'}</td>
                    <td className="py-2 px-2">
                        <select value={a.current_status||'Not Started'} onChange={e=>setStatus(a,e.target.value)}
                            className="w-full px-2 py-1.5 border-2 rounded-lg text-xs font-semibold"
                            style={{borderColor:wpStatusColour(a.current_status)+'55',color:wpStatusColour(a.current_status)}}>
                            {WP_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                        </select>
                    </td>
                    <td className="py-2 px-2">
                        {isRoutine(a) ? (()=>{
                            const reports = periodReports[a.id]||[];
                            const latest = reports[0];
                            const {month:curM,year:curY} = currentPeriod();
                            const hasCurrentReport = latest && latest.period_month===curM && latest.period_year===curY;
                            if(!hasCurrentReport) return <div className="text-right">
                                <span className="text-gray-300 block mb-1">—</span>
                                <button onClick={()=>reopenWindow(a)} className="px-2 py-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg font-bold text-xs whitespace-nowrap">
                                    {a.window_override?<><i className="fas fa-lock-open mr-1"/>Reopened</>:<><i className="fas fa-unlock mr-1"/>Reopen</>}
                                </button>
                            </div>;
                            if(latest.verification_status==='submitted')
                                return <button onClick={()=>setSel({...latest,_isPeriod:true,sub_activity:a.sub_activity,assigned_to:a.assigned_to,current_status:latest.current_status})} className="px-3 py-1.5 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded-lg font-bold whitespace-nowrap"><i className="fas fa-clipboard-check mr-1"/>Review {latest.period_month}</button>;
                            if(latest.verification_status==='verified')
                                return <span className="text-green-600 font-bold whitespace-nowrap"><i className="fas fa-check-circle mr-1"/>Verified {latest.period_month}</span>;
                            if(latest.verification_status==='rejected')
                                return <button onClick={()=>setSel({...latest,_isPeriod:true,sub_activity:a.sub_activity,assigned_to:a.assigned_to,current_status:latest.current_status})} className="px-3 py-1.5 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg font-bold whitespace-nowrap"><i className="fas fa-rotate-left mr-1"/>Returned {latest.period_month}</button>;
                            return <span className="text-gray-300">—</span>;
                        })() : (
                            a.verification_status==='submitted'
                            ? <button onClick={()=>setSel(a)} className="px-3 py-1.5 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded-lg font-bold whitespace-nowrap"><i className="fas fa-clipboard-check mr-1"/>Review</button>
                            : a.verification_status==='verified'
                            ? <span className="text-green-600 font-bold whitespace-nowrap"><i className="fas fa-check-circle mr-1"/>Verified</span>
                            : a.verification_status==='rejected'
                            ? <button onClick={()=>setSel(a)} className="px-3 py-1.5 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg font-bold whitespace-nowrap"><i className="fas fa-rotate-left mr-1"/>Returned</button>
                            : <span className="text-gray-300">—</span>
                        )}
                    </td>
                </tr>)}</tbody>
            </table>
            {list.length===0&&<p className="text-center text-gray-400 py-8 font-semibold">No activities match this filter</p>}
        </div>}

{sel&&<VerifyModal act={sel} nameByEmail={nameByEmail} onClose={()=>setSel(null)} onDecide={sel._isPeriod?verifyPeriod:verify}/>}
    </div></div>;
}

function VerifyModal({act,nameByEmail,onClose,onDecide}) {
    const [note,setNote]=useState(act.mne_note||'');
    return <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 overflow-auto">
        <div className="bg-white rounded-2xl p-6 max-w-2xl w-full animate-in my-8">
            <div className="flex justify-between items-start mb-5">
                <div><h2 className="text-xl font-bold text-gray-800"><i className="fas fa-clipboard-check text-amber-600 mr-2"/>Verify Delivery</h2>
                    <p className="text-sm text-gray-500 mt-1">{act.sub_activity}</p></div>
                <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center flex-shrink-0"><i className="fas fa-times text-gray-500"/></button>
            </div>

            <div className="grid grid-cols-2 gap-3 mb-4">
                <div className="bg-gray-50 rounded-xl p-3"><p className="text-xs font-bold text-gray-400 uppercase">Owner</p><p className="text-sm font-semibold text-gray-800">{nameByEmail[act.assigned_to]||act.assigned_to||'—'}</p></div>
                <div className="bg-gray-50 rounded-xl p-3"><p className="text-xs font-bold text-gray-400 uppercase">Reported Status</p><p className="text-sm font-semibold" style={{color:wpStatusColour(act.current_status)}}>{act.current_status}</p></div>
            </div>

            {act.submitted_at&&<p className="text-xs text-gray-400 mb-4">Submitted {new Date(act.submitted_at).toLocaleString()}</p>}

            <div className="mb-4">
                <p className="text-xs font-bold text-gray-500 uppercase mb-2">Narrative from Owner</p>
                <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
                    <p className="text-sm text-gray-700 whitespace-pre-wrap">{act.narrative||<span className="text-gray-400 italic">No narrative provided</span>}</p>
                </div>
            </div>

            <div className="mb-4">
                <p className="text-xs font-bold text-gray-500 uppercase mb-2">Means of Verification</p>
                {act.mov_file_url
                    ? <a href={act.mov_file_url} download={act.mov_file_name||'mov'} className="flex items-center gap-3 bg-green-50 border border-green-200 rounded-xl p-3 hover:bg-green-100">
                        <i className="fas fa-file-circle-check text-green-600 text-lg"/>
                        <div className="flex-1 min-w-0"><p className="text-sm font-semibold text-gray-800 truncate">{act.mov_file_name||'Attachment'}</p></div>
                        <i className="fas fa-download text-green-600"/></a>
                    : <div className="bg-amber-50 border border-amber-200 rounded-xl p-3"><p className="text-sm text-amber-700"><i className="fas fa-triangle-exclamation mr-2"/>No MoV attached</p></div>}
            </div>

            <div className="mb-5">
                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">M&amp;E Note</label>
                <textarea value={note} onChange={e=>setNote(e.target.value)} rows="3"
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm"
                    placeholder="Optional for verify — required when sending back"/>
            </div>

            <div className="flex gap-3">
                <button onClick={()=>{if(!note.trim()){alert('Add a note explaining what needs fixing');return;}onDecide(act,false,note);}}
                    className="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold"><i className="fas fa-rotate-left mr-2"/>Send Back</button>
                <button onClick={()=>onDecide(act,true,note)}
                    className="flex-1 btn-green text-white py-3 rounded-xl font-bold"><i className="fas fa-check mr-2"/>Verify Delivery</button>
            </div>
        </div>
    </div>;
}

/* Owner-facing view — every staff member sees only the activities assigned to them */
function MyActivities({user,notify,onBack}) {
    const [acts,setActs]=useState([]);
    const [plans,setPlans]=useState({});
    const [loading,setLoading]=useState(true);
    const [sel,setSel]=useState(null);
    const [periodReports,setPeriodReports]=useState({});

    const load=async()=>{setLoading(true);
        try{
            const a=await fetch(`${SB}/rest/v1/work_plan_activities?assigned_to=eq.${encodeURIComponent(user.email)}&order=sort_order.asc`,{headers:H}).then(r=>r.json());
            const rows=Array.isArray(a)?a:[];
            setActs(rows);
            const ids=[...new Set(rows.map(x=>x.work_plan_id))];
            if(ids.length){
                const p=await fetch(`${SB}/rest/v1/work_plans?id=in.(${ids.join(',')})`,{headers:H}).then(r=>r.json());
                const m={};(Array.isArray(p)?p:[]).forEach(x=>{m[x.id]=x;});setPlans(m);
            }
            const routineIds=rows.filter(isRoutine).map(x=>x.id);
            if(routineIds.length){
                const {month,year}=currentPeriod();
                const pr=await fetch(`${SB}/rest/v1/activity_period_reports?activity_id=in.(${routineIds.join(',')})&period_month=eq.${month}&period_year=eq.${year}`,{headers:H}).then(r=>r.json());
                const pm={};(Array.isArray(pr)?pr:[]).forEach(x=>{pm[x.activity_id]=x;});
                setPeriodReports(pm);
            }
        }catch(e){}
        setLoading(false);};
    useEffect(()=>{load();},[]);

    if(sel) return <ReportActivity act={sel} user={user} notify={notify} onDone={()=>{setSel(null);load();}}/>;

    const pending=acts.filter(a=>!a.verification_status||a.verification_status==='not_submitted'||a.verification_status==='rejected').length;
    const submitted=acts.filter(a=>a.verification_status==='submitted').length;
    const verified=acts.filter(a=>a.verification_status==='verified').length;

    const overdueRoutine = acts.filter(a=>isRoutine(a) && (!periodReports[a.id] || periodReports[a.id].verification_status==='rejected'));
    const sortedActs = [...acts].sort((a,b)=>{
        const aOver = isRoutine(a) && !periodReports[a.id];
        const bOver = isRoutine(b) && !periodReports[b.id];
        if(aOver && !bOver) return -1;
        if(!aOver && bOver) return 1;
        return 0;
    });
    const dayOfMonth = new Date().getDate();
    const windowOpen = dayOfMonth <= 5;
    const vBadge=a=>{
        const v=a.verification_status;
        if(v==='verified')  return <span className="px-2 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700"><i className="fas fa-check-circle mr-1"/>Verified</span>;
        if(v==='submitted') return <span className="px-2 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700"><i className="fas fa-hourglass-half mr-1"/>Awaiting M&amp;E</span>;
        if(v==='rejected')  return <span className="px-2 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700"><i className="fas fa-rotate-left mr-1"/>Returned</span>;
        return <span className="px-2 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-600">Not reported</span>;
    };

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-5xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onBack} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back to Dashboard</button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">My Work Plan Activities</h1>
            <p className="text-gray-500 mt-1">Activities you are accountable for delivering</p>
        </div>

        <div className="grid grid-cols-3 gap-4 mb-6">
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">To Report</p><p className="text-3xl font-extrabold text-amber-600 mt-1">{pending}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Awaiting M&amp;E</p><p className="text-3xl font-extrabold text-blue-600 mt-1">{submitted}</p></div>
            <div className="glass rounded-xl p-5 stat"><p className="text-xs font-bold text-gray-400 uppercase">Verified</p><p className="text-3xl font-extrabold text-green-600 mt-1">{verified}</p></div>
        </div>

        {!loading && overdueRoutine.length>0 && <div className="glass rounded-2xl p-5 mb-6" style={{background:'rgba(255,251,235,0.98)',border:'2px solid #fcd34d'}}>
            <div className="flex items-start gap-3">
                <div className="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center flex-shrink-0"><i className="fas fa-bell text-amber-600"/></div>
                <div><h3 className="font-bold text-amber-800">Recurring Reports Due</h3>
                    <p className="text-sm text-amber-700 mt-1">You have {overdueRoutine.length} recurring activit{overdueRoutine.length===1?'y':'ies'} to report on for {currentPeriod().month} {currentPeriod().year}.</p></div>
            </div>
        </div>}

        {loading?<div className="glass rounded-2xl p-12 text-center text-gray-400"><i className="fas fa-spinner fa-spin text-2xl"/></div>
        :acts.length===0?<div className="glass rounded-2xl p-12 text-center text-gray-400">
            <i className="fas fa-clipboard-list text-4xl mb-3"/><p className="font-semibold">No activities assigned to you</p>
            <p className="text-sm mt-1">M&amp;E will assign work plan activities to you.</p></div>
        :<div className="space-y-3">{sortedActs.map(a=>{
            const routine = isRoutine(a);
            const pr = routine ? periodReports[a.id] : null;
            const effStatus = routine ? (pr?.verification_status||'not_submitted') : a.verification_status;
            const effNote = routine ? pr?.mne_note : a.mne_note;
            return <div key={a.id} className={`glass rounded-2xl p-5 ${effStatus==='rejected'?'border-2 border-red-200':''}`}>
                <div className="flex flex-wrap justify-between items-start gap-3">
                    <div className="min-w-0 flex-1">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                            {vBadge({verification_status:effStatus})}
                            <span className="px-2 py-1 rounded-full text-xs font-bold" style={{background:wpStatusColour(a.current_status)+'20',color:wpStatusColour(a.current_status)}}>{a.current_status||'Not Started'}</span>
                        </div>
                        <p className="font-semibold text-gray-800 mt-1">{a.sub_activity}</p>
                        <p className="text-xs text-gray-400 mt-1">{plans[a.work_plan_id]?.plan_name||''} · {a.stage||'—'} · {a.activity_type||'—'}
                            {a.planned_months&&(()=>{try{const m=JSON.parse(a.planned_months);return m.length?' · Planned: '+m.join(', '):'';}catch(e){return '';}})()}</p>
                        {routine && <p className="text-xs text-cyan-600 font-semibold mt-1"><i className="fas fa-rotate mr-1"/>Recurring — reporting for {currentPeriod().month} {currentPeriod().year}</p>}
                        {effStatus==='rejected'&&effNote&&
                            <div className="bg-red-50 border border-red-200 rounded-lg p-3 mt-3">
                                <p className="text-xs font-bold text-red-600 mb-1">M&amp;E sent this back:</p>
                                <p className="text-sm text-red-700">{effNote}</p></div>}
                    </div>
                {effStatus!=='verified'&&effStatus!=='submitted'&&(
 routine && !windowOpen && !a.window_override
                        ? <div className="text-right">
                            <button disabled className="bg-gray-200 text-gray-400 px-5 py-2.5 rounded-xl font-semibold text-sm whitespace-nowrap cursor-not-allowed"><i className="fas fa-lock mr-2"/>Closed</button>
                            <p className="text-xs text-red-500 mt-1 max-w-[160px]">Reporting window closed (1st–5th only)</p>
                          </div>
                        : <button onClick={()=>setSel(routine?{...a,verification_status:effStatus,narrative:pr?.narrative||'',mne_note:effNote,mov_file_url:pr?.mov_file_url||null,mov_file_name:pr?.mov_file_name||null}:a)} className="btn-green text-white px-5 py-2.5 rounded-xl font-semibold text-sm whitespace-nowrap"><i className="fas fa-pen mr-2"/>Report</button>
                    )}
                </div>
            </div>;})}</div>}
    </div></div>;
}

  </div>
  <div style="text-align:right;font-size:11px;color:#777">Generated<br><b>${new Date().toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'})}</b></div>
</div>
<h2>ACTIVITY</h2>
<div style="margin:10px 0"><div class="lbl">Sub-Activity</div><div class="val" style="font-size:15px">${esc(act.sub_activity)}</div></div>
<div class="grid">
  <div class="box"><div class="lbl">Stage</div><div class="val">${esc(act.stage)||'—'}</div></div>
  <div class="box"><div class="lbl">Type</div><div class="val">${esc(act.activity_type)||'—'}</div></div>
  <div class="box"><div class="lbl">DRI</div><div class="val">${esc(act.dri)||'—'}</div></div>
  <div class="box"><div class="lbl">Delivery Status</div><div class="val">${esc(act.current_status)||'—'}</div></div>
  <div class="box"><div class="lbl">Verification</div><div class="val">${esc(act.verification_status||'not submitted')}</div></div>
  <div class="box"><div class="lbl">Submitted</div><div class="val">${act.submitted_at?new Date(act.submitted_at).toLocaleDateString('en-NG'):'—'}</div></div>
</div>
<h2>NARRATIVE — WHAT WAS DONE</h2>
<div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:14px;white-space:pre-wrap;line-height:1.6">${esc(act.narrative)||'No narrative provided'}</div>
${act.mne_note?`<h2>M&amp;E NOTE</h2><div style="background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:14px">${esc(act.mne_note)}</div>`:''}
${act.mov_file_url?`<h2>MEANS OF VERIFICATION</h2><p style="font-size:12px">Attachment: <b>${esc(act.mov_file_name)||'file'}</b> — available in the system.</p>${/^data:image/.test(act.mov_file_url)?`<img src="${act.mov_file_url}" style="max-width:100%;border:1px solid #ddd;border-radius:8px;margin-top:8px">`:''}`:'<h2>MEANS OF VERIFICATION</h2><p style="color:#999;font-size:12px">No attachment provided.</p>'}
<div style="margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:32px">
  <div><div class="lbl">Reported By</div><div style="height:46px;border-bottom:1px solid #333;margin-top:6px"></div>
    <div style="font-size:11px;color:#777;margin-top:4px">${esc(act.submitted_by)||''}</div></div>

    a.href=u;a.download=`Activity_Report_${(act.sub_activity||'activity').slice(0,40).replace(/[^a-z0-9]/gi,'_')}.html`;

function ReportActivity({act,user,notify,onDone}) {
    const routine = isRoutine(act);
    // Submitted/verified reports are read-only until the owner chooses to revise.
    // Revising resets verification so M&E re-checks the changed submission.
    const [editing,setEditing]=useState(false);
    const locked=act.verification_status==='submitted'||act.verification_status==='verified';
    const readOnly=locked&&!editing;
    const [status,setStatus]=useState(act.current_status||'Not Started');
    const [narrative,setNarrative]=useState(act.narrative||'');
    const [file,setFile]=useState(null);
    const [busy,setBusy]=useState(false);
    const fileRef=useRef(null);
    const toB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});

    const submit=async()=>{
        if(narrative.trim().length<10){notify('Describe what was done (min 10 characters)','error');return;}
        setBusy(true);
        try{
            let movUrl=null, movName=null;
            if(file){
                if(file.size>5*1024*1024){notify('File too large (max 5MB)','error');setBusy(false);return;}
                const compressed=await compressImage(file);   // photos shrink ~90% before base64
                movUrl=await toB64(compressed); movName=file.name;
            }
            if(routine){
                const {month,year}=currentPeriod();
                const body={activity_id:act.id,period_month:month,period_year:year,current_status:status,
                    narrative,mov_file_url:movUrl,mov_file_name:movName,verification_status:'submitted',
                    submitted_by:user.name,submitted_at:new Date().toISOString(),mne_note:null};
                const r=await fetch(`${SB}/rest/v1/activity_period_reports`,{method:'POST',headers:HJ,body:JSON.stringify(body)});
                if(r.ok){notify('Submitted to M&E for verification');onDone();}
                else notify('Submission failed','error');
            } else {
                const body={current_status:status,narrative,verification_status:'submitted',
                    submitted_by:user.name,submitted_at:new Date().toISOString(),
                    status_updated_by:user.name,status_updated_at:new Date().toISOString(),mne_note:null};
                if(movUrl){body.mov_file_url=movUrl;body.mov_file_name=movName;}
                const r=await fetch(`${SB}/rest/v1/work_plan_activities?id=eq.${act.id}`,{method:'PATCH',headers:HJ,body:JSON.stringify(body)});
                if(r.ok){notify('Submitted to M&E for verification');onDone();}
                else notify('Submission failed','error');
            }
        }catch(e){notify('Error submitting','error');}
        setBusy(false);
    };

    return <div className="min-h-screen p-4 md:p-8"><div className="max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-6 mb-6 animate-in">
            <button onClick={onDone} className="text-green-600 font-semibold text-sm mb-3 hover:underline"><i className="fas fa-arrow-left mr-2"/>Back</button>
            <h1 className="text-2xl font-extrabold text-gray-800">{readOnly?'Activity Report':'Report on Activity'}</h1>
            <p className="text-gray-500 mt-1">{act.sub_activity}</p>
            <p className="text-xs text-gray-400 mt-2">{act.stage||'—'} · {act.activity_type||'—'} · DRI: {act.dri||'—'}</p>
        </div>

        {act.verification_status==='rejected'&&act.mne_note&&
            <div className="bg-red-50 border-2 border-red-200 rounded-2xl p-5 mb-6">
                <h3 className="font-bold text-red-800 mb-1"><i className="fas fa-rotate-left mr-2"/>Sent back by M&amp;E</h3>
                <p className="text-sm text-red-700">{act.mne_note}</p></div>}

        {readOnly&&<div className="bg-blue-50 border-2 border-blue-200 rounded-2xl p-4 mb-6">
            <div className="flex flex-wrap justify-between items-center gap-3">
                <p className="text-sm text-blue-700 font-semibold">
                    <i className={`fas ${act.verification_status==='verified'?'fa-check-circle':'fa-hourglass-half'} mr-2`}/>
                    {act.verification_status==='verified'?'Verified by M&E — no further action needed':'Submitted and awaiting M&E verification'}</p>
                <div className="flex gap-2">
                    <button onClick={()=>downloadActivityReport(act)} className="px-4 py-2 bg-white border-2 border-blue-200 text-blue-700 hover:bg-blue-100 rounded-xl font-semibold text-sm"><i className="fas fa-download mr-2"/>Download</button>
                    <button onClick={()=>setEditing(true)} className="px-4 py-2 bg-amber-100 text-amber-800 hover:bg-amber-200 rounded-xl font-semibold text-sm"><i className="fas fa-pen mr-2"/>Revise</button>
                </div>
            </div>
        </div>}

        {editing&&<div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6">
            <p className="text-sm text-amber-800 font-semibold"><i className="fas fa-triangle-exclamation mr-2"/>Revising a {act.verification_status==='verified'?'verified':'submitted'} report — resubmitting sends it back to M&amp;E for re-verification.</p>
        </div>}

        <div className="glass rounded-2xl p-6 mb-6 space-y-5">
            <div>
                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Delivery Status *</label>
                <select value={status} onChange={e=>setStatus(e.target.value)} disabled={readOnly}
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl disabled:bg-gray-50">
                    {WP_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
            </div>
            <div>
                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">What was done? *</label>
                <textarea value={narrative} onChange={e=>setNarrative(e.target.value)} rows="6" disabled={readOnly}
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm disabled:bg-gray-50"
                    placeholder="Describe the activity carried out, where, when, who participated, and any issues encountered..."/>
                {!readOnly&&narrative.trim().length<10&&<p className="text-amber-600 text-xs mt-1"><i className="fas fa-exclamation-circle mr-1"/>Min 10 characters</p>}
            </div>
            <div>
                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Means of Verification (MoV)</label>
                {act.mov_file_url&&!file&&
                    <a href={act.mov_file_url} download={act.mov_file_name||'mov'} className="flex items-center gap-3 bg-green-50 border border-green-200 rounded-xl p-3 mb-3 hover:bg-green-100">
                        <i className="fas fa-file-circle-check text-green-600"/>
                        <span className="text-sm font-semibold text-gray-800 flex-1 truncate">{act.mov_file_name||'Attachment'}</span>
                        <i className="fas fa-download text-green-600"/></a>}
                {!readOnly&&<>
                    <div onClick={()=>fileRef.current&&fileRef.current.click()}
                        className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer transition ${file?'border-green-400 bg-green-50':'border-gray-300 hover:border-green-400 hover:bg-green-50'}`}>
                        {file?<div className="flex items-center justify-center gap-2"><i className="fas fa-file-circle-check text-green-600"/>
                            <span className="text-sm font-semibold text-green-700">{file.name}</span>
                            <span className="text-xs text-gray-500">({(file.size/1024).toFixed(0)}KB)</span>
                            <button onClick={e=>{e.stopPropagation();setFile(null);if(fileRef.current)fileRef.current.value='';}} className="ml-2 text-red-400"><i className="fas fa-times-circle"/></button></div>
                        :<div><i className="fas fa-cloud-arrow-up text-gray-400 text-2xl mb-2"/>
                            <p className="text-sm text-gray-500">{act.mov_file_url?'Replace attachment':'Attach evidence'}</p>
                            <p className="text-xs text-gray-400 mt-1">Attendance sheet, photo, report — PDF, JPG, PNG, DOC (max 5MB)</p></div>}
                    </div>
                    <input ref={fileRef} type="file" className="hidden" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx"
                        onChange={e=>{const f=e.target.files[0];if(f){if(f.size>5*1024*1024){notify('File too large (max 5MB)','error');e.target.value='';return;}setFile(f);}}}/>
                </>}
            </div>
        </div>

        {!readOnly&&<div className="glass rounded-xl p-6 flex gap-4">
            <button onClick={onDone} disabled={busy} className="flex-1 bg-gray-100 py-4 rounded-xl font-bold hover:bg-gray-200">Cancel</button>
            <button onClick={submit} disabled={busy||narrative.trim().length<10} className="flex-1 btn-green text-white py-4 rounded-xl font-bold disabled:opacity-50">
                {busy?<><i className="fas fa-spinner fa-spin mr-2"/>Submitting…</>:'Submit to M&E'}</button>
        </div>}
    </div></div>;
}

function Dashboard({user,onLogout,notify}) {
    const [view,setView]=useState('list');const [showPw,setShowPw]=useState(false);const [apps,setApps]=useState([]);const [loading,setLoading]=useState(true);const [selApp,setSelApp]=useState(null);const [leaves,setLeaves]=useState([]);
    const [isHr,setIsHr]=useState(false);const [isEd,setIsEd]=useState(false);const [polPending,setPolPending]=useState(0);
    const load=()=>{setLoading(true);
        fetch(`${SB}/rest/v1/appraisals?employee_id=eq.${user.id}&order=created_at.desc`,{headers:H}).then(r=>r.json()).then(d=>{setApps(d);}).catch(()=>{});
        fetch(`${SB}/rest/v1/leave_requests?employee_id=eq.${user.id}&order=created_at.desc`,{headers:H}).then(r=>r.json()).then(d=>setLeaves(d||[])).catch(()=>setLeaves([]));

        fetch(`${SB}/rest/v1/users?id=eq.${user.id}&select=is_hr`,{headers:H}).then(r=>r.ok?r.json():[]).then(d=>setIsHr(Array.isArray(d)&&d.length?!!d[0].is_hr:false)).catch(()=>{});
        fetch(`${SB}/rest/v1/users?id=eq.${user.id}&select=is_ed`,{headers:H}).then(r=>r.ok?r.json():[]).then(d=>setIsEd(Array.isArray(d)&&d.length?!!d[0].is_ed:false)).catch(()=>{});
        loadMyPolicyItems(user.id).then(it=>setPolPending(it.filter(x=>x.status!=='signed').length)).catch(()=>{});

    if(view==='create') return <Assessment user={user} notify={notify} onDone={()=>{setView('list');load();}}/>;
    if(view==='review') return <EmpReview appraisal={selApp} user={user} notify={notify} onDone={()=>{setView('list');load();}}/>;

function Assessment({user,notify,onDone}) {
    const [rate,setRate]=useState({});const [comm,setComm]=useState({});const [overall,setOverall]=useState('');const [busy,setBusy]=useState(false);
    const [evidence,setEvidence]=useState([]);const [evDesc,setEvDesc]=useState('');const [evLink,setEvLink]=useState('');const [evFile,setEvFile]=useState(null);const [uploading,setUploading]=useState(false);
    const fileRef=useRef(null);
    // Deadline is a single global setting the supervisor controls — checked

                const passed=s&&s.deadline&&new Date(s.deadline+'T23:59:59')<new Date();
                setDeadlineInfo({deadline:s?.deadline||null, locked: !!(passed && !s.override_open)});
            })
            .catch(()=>setDeadlineInfo({deadline:null, locked:false}))
